class=\"sub\">Сначала правило, потом отработка. Три минуты за подход.<\/p>\n    <div id=\"menuList\"><\/div>\n  <\/section>\n\n  <!-- ЭКРАН 1б: СПИСОК ПРАВИЛ РАЗДЕЛА -->\n  <section id=\"blocks\" class=\"hidden\">\n    <div class=\"crumb\" id=\"crumbSet\"><\/div>\n    <h1 id=\"setTitle\"><\/h1>\n    <p class=\"sub\" id=\"setSub\"><\/p>\n    <div id=\"blockList\"><\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"blocksBack\">К разделам<\/button>\n    <\/div>\n  <\/section>\n\n  <!-- ЭКРАН 2: ПРАВИЛО -->\n  <section id=\"ruleScreen\" class=\"hidden\">\n    <div class=\"crumb\" id=\"crumb1\"><\/div>\n    <h2 class=\"rule-name\" id=\"ruleName\"><\/h2>\n    <div class=\"explain\" id=\"explain\"><\/div>\n    <div class=\"ex-list\" id=\"exList\"><\/div>\n    <div class=\"row\">\n      <button class=\"btn main\" id=\"toDrill\">Тренироваться<\/button>\n    <\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"ruleBack\">К списку правил<\/button>\n    <\/div>\n  <\/section>\n\n  <!-- ЭКРАН 3: УПРАЖНЕНИЕ -->\n  <section id=\"card\" class=\"hidden\">\n    <div class=\"crumb\" id=\"crumb2\"><\/div>\n    <div class=\"bar\"><i id=\"prog\"><\/i><\/div>\n    <div class=\"word\" id=\"word\"><\/div>\n    <p class=\"ask\" id=\"ask\">Как читается выделенная часть?<\/p>\n    <div id=\"opts\"><\/div>\n    <div id=\"typeBox\" class=\"hidden\">\n      <input id=\"typed\" type=\"text\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"впиши слово\">\n      <div class=\"tiprow\" id=\"tiprow\">\n        <button class=\"btn main\" id=\"check\">Проверить<\/button>\n        <button class=\"btn\" id=\"hintBtn\">Подсказка<\/button>\n      <\/div>\n      <div id=\"chips\" class=\"chips hidden\"><\/div>\n      <p class=\"note\">Enter тоже проверяет. Если слово не нужно — поставь дефис.<\/p>\n    <\/div>\n    <div id=\"hint\" class=\"hint hidden\"><\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"say\">Послушать<\/button>\n      <button class=\"btn hidden\" id=\"accept\">Мой ответ тоже верный<\/button>\n      <button class=\"btn main hidden\" id=\"next\">Дальше<\/button>\n    <\/div>\n  <\/section>\n\n  <!-- ЭКРАН 4: ИТОГ -->\n  <section id=\"done\" class=\"hidden done\">\n    <h2 id=\"doneTitle\"><\/h2>\n    <p class=\"quiet\" id=\"doneSub\"><\/p>\n    <div id=\"groups\"><\/div>\n    <div id=\"readingNext\" class=\"hidden\">\n      <h3>От слов к целому тексту<\/h3>\n      <p>Продолжай читать по правилам: в подписке есть 32 текста с британской озвучкой. Можно слушать целый текст или отдельное слово, включать подсветку правила и перевод. Также доступны остальные темы грамматики и словообразование.<\/p>\n      <p><b>400 ₽ в месяц.<\/b><\/p>\n      <div class=\"row\"><button class=\"btn\" id=\"readingSubscribe\">Посмотреть полный доступ<\/button><\/div>\n    <\/div>\n    <div class=\"row\">\n      <button class=\"btn main\" id=\"again\">Пройти раздел ещё раз<\/button>\n    <\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"back\">К списку правил<\/button>\n    <\/div>\n  <\/section>\n\n  <!-- ЭКРАН 5: ТЕКСТ ДЛЯ ЧТЕНИЯ ВСЛУХ -->\n  <section id=\"reader\" class=\"hidden\">\n    <div class=\"crumb\" id=\"crumbT\"><\/div>\n    <h2 class=\"rule-name\" id=\"tTitle\"><\/h2>\n    <p class=\"t-rule\" id=\"tRule\"><\/p>\n    <p class=\"quiet\">Сначала прочитай вслух сам. Потом нажми «Послушать» и сравни. Если сомневаешься в слове — нажми на него, оно прозвучит отдельно.<\/p>\n    <div class=\"t-body\" id=\"tBody\"><\/div>\n    <p class=\"t-ru hidden\" id=\"tRu\"><\/p>\n    <div class=\"row\">\n      <button class=\"btn main\" id=\"tListen\">Послушать<\/button>\n      <button class=\"btn\" id=\"tMark\">Показать правило<\/button>\n    <\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"tTrans\">Перевод<\/button>\n      <button class=\"btn\" id=\"tNext\">Следующий текст<\/button>\n    <\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"tBack\">К списку текстов<\/button>\n    <\/div>\n  <\/section>\n\n  <footer>Звуки — по перечню ФИПИ. Грамматика — по кодификатору ЕГЭ ФИПИ.<\/footer>\n<\/div>\n\n<script>\n/* ============================================================\n   СТРУКТУРА: раздел → блоки. Блок = ПРАВИЛО + отработка.\n   Сначала объяснение, потом упражнения на него.\n   ============================================================\n   В explain: <span class=\"key\">…<\/span> подсвечивает главное.\n   В словах квадратные скобки выделяют нужную часть: c[u]p\n   ru — опора на русский звук (как объясняет Юля)\n*/\n/* Звуки: wrong — [звук, пример, почему этот вариант неверный]; why — почему верен правильный звук.\n   При ошибке подсказка = заметка к выбранному варианту + why. */\nconst SETS = {\"types\":{\"kind\":\"phon\",\"title\":\"Четыре типа чтения\",\"sub\":\"Открытый слог, закрытый, гласная + r + согласная, гласная + r + гласная\",\"blocks\":[{\"name\":\"Закрытый слог\",\"explain\":[\"<span class='h'>Что это<\/span>Закрытый слог <span class='key'>заканчивается на согласную<\/span>: после гласной стоит согласная, и слог на ней обрывается. cat, pen, big, box, cup — всё это закрытые слоги.\",\"<span class='h'>Как читается<\/span>Гласная звучит <span class='key'>кратко<\/span>, не так, как она называется в алфавите: a — [æ] как в cat, e — [e] как в pen, i — [ɪ] как в big, o — [ɒ] как в box, u — [ʌ] как в cup, y — [ɪ] как в gym: y читается так же, как i.\",\"<span class='h'>Как звучат по-русски<\/span>[æ] — между «а» и «э», рот открыт шире, чем для «э». [e] — почти «э». [ɪ] — между «и» и «ы». [ɒ] — короткое открытое «о». [ʌ] — короткое «а».\",\"<span class='h'>Как узнать на письме<\/span>После гласной одна или несколько согласных, и в конце нет немой e: hat, but, stop, lamp. Удвоенная согласная тоже держит слог закрытым: apple, happy, dinner.\",\"<span class='h'>Ловушка<\/span>Стоит добавить к слову немую e, и слог становится открытым, а звук меняется: hat — hate, pin — pine, hop — hope. Всегда смотри, есть ли e на конце.\",\"<span class='h'>Как тренировать<\/span>Читай пары подряд: cap — cape, kit — kite, not — note, cut — cute. Первое слово — закрытый слог, второе — открытый.\"],\"examples\":[{\"w\":\"c[u]p\",\"ipa\":\"[ʌ]\",\"ru\":\"близко к русскому а\"},{\"w\":\"c[a]t\",\"ipa\":\"[æ]\",\"ru\":\"между а и э\"},{\"w\":\"p[e]n\",\"ipa\":\"[e]\",\"ru\":\"как э\"},{\"w\":\"b[i]g\",\"ipa\":\"[ɪ]\",\"ru\":\"короткое и\"},{\"w\":\"b[o]x\",\"ipa\":\"[ɒ]\",\"ru\":\"короткое о\"},{\"w\":\"g[y]m\",\"ipa\":\"[ɪ]\",\"ru\":\"короткое и — y читается как i\"}],\"drill\":[{\"word\":\"c[u]p\",\"ipa\":\"[ʌ]\",\"ex\":\"как в but\",\"wrong\":[[\"[juː]\",\"как в tune\",\"[juː] — так u читается в открытом слоге, когда на конце немая e: tune, cute.\"],[\"[ʊ]\",\"как в book\",\"[ʊ] — короткое «у»: его дают oo перед k (book) и u в нескольких словах вроде put, pull.\"]],\"why\":\"В cup после u стоит согласная p, немой e на конце нет: слог закрытый, u читается кратко — [ʌ].\"},{\"word\":\"c[a]t\",\"ipa\":\"[æ]\",\"ex\":\"как в bad\",\"wrong\":[[\"[eɪ]\",\"как в name\",\"[eɪ] — так a читается в открытом слоге, с немой e на конце: name, late.\"],[\"[ɑː]\",\"как в car\",\"[ɑː] — долгое «а», его даёт ar: car, park. Здесь после a нет r.\"]],\"why\":\"В cat после a стоит согласная t, немой e нет: слог закрытый, a читается кратко — [æ].\"},{\"word\":\"p[e]n\",\"ipa\":\"[e]\",\"ex\":\"как в bed\",\"wrong\":[[\"[iː]\",\"как в see\",\"[iː] — долгое «и»: его дают ee (see) и e в открытом слоге (he, Pete).\"],[\"[ɜː]\",\"как в her\",\"[ɜː] дают er, ir, ur — гласная с r после неё. Здесь после e нет r.\"]],\"why\":\"В pen после e стоит согласная n: слог закрытый, e читается кратко — [e].\"},{\"word\":\"b[i]g\",\"ipa\":\"[ɪ]\",\"ex\":\"как в sit\",\"wrong\":[[\"[aɪ]\",\"как в nine\",\"[aɪ] — так i читается в открытом слоге, с немой e на конце: nine, time.\"],[\"[iː]\",\"как в see\",\"[iː] — долгое «и» из ee и ea: see, sea.\"]],\"why\":\"В big после i стоит согласная g: слог закрытый, i читается кратко — [ɪ].\"},{\"w },{\"word\":\"p[i]ck\",\"ipa\":\"[ɪ]\",\"ex\":\"короткое\",\"wrong\":[[\"[iː]\",\"долгое, как в peak\",\"С долгим [iː] получится peak «вершина» — ошибка, искажающая смысл.\"],[\"[aɪ]\",\"как в nine\",\"[aɪ] — i в открытом слоге, с немой e: nine, like.\"]],\"why\":\"i в закрытом слоге — короткое [ɪ]: pick «выбирать».\"},{\"word\":\"sh[or]t\",\"ipa\":\"[ɔː]\",\"ex\":\"долгое\",\"wrong\":[[\"[ɒ]\",\"короткое, как в shot\",\"С коротким [ɒ] получится shot «выстрел» — другое слово.\"],[\"[ɜː]\",\"как в her\",\"[ɜː] дают er, ir, ur: с ним получится shirt «рубашка».\"]],\"why\":\"or перед согласной — долгое [ɔː]: short «короткий».\"},{\"word\":\"sh[o]t\",\"ipa\":\"[ɒ]\",\"ex\":\"короткое\",\"wrong\":[[\"[ɔː]\",\"долгое, как в short\",\"С долгим [ɔː] получится short «короткий» — другое слово.\"],[\"[əʊ]\",\"как в go\",\"[əʊ] — o в открытом слоге: go, note.\"]],\"why\":\"o в закрытом слоге — короткое [ɒ]: shot «выстрел».\"},{\"word\":\"h[ear]t\",\"ipa\":\"[ɑː]\",\"ex\":\"долгое\",\"wrong\":[[\"[ʌ]\",\"короткое, как в hut\",\"С коротким [ʌ] получится hut «хижина» — другое слово.\"],[\"[ɪə]\",\"как в here\",\"[ɪə] у ear — в hear, near.\"]],\"why\":\"heart — слово-исключение: ear здесь читается [ɑː], как ar в card.\"},{\"word\":\"h[u]t\",\"ipa\":\"[ʌ]\",\"ex\":\"короткое\",\"wrong\":[[\"[ɑː]\",\"долгое, как в heart\",\"С долгим [ɑː] получится heart «сердце» — другое слово.\"],[\"[ʊ]\",\"как в put\",\"[ʊ] у u только в нескольких словах: put, pull, full.\"]],\"why\":\"u в закрытом слоге — короткое [ʌ]: hut «хижина».\"},{\"word\":\"p[oo]l\",\"ipa\":\"[uː]\",\"ex\":\"долгое\",\"wrong\":[[\"[ʊ]\",\"короткое, как в pull\",\"С коротким [ʊ] получится pull «тянуть» — другое слово.\"],[\"[əʊ]\",\"как в go\",\"[əʊ] даёт одна o в открытом слоге: go, no.\"]],\"why\":\"oo не перед k — долгое [uː]: pool «бассейн».\"},{\"word\":\"p[u]ll\",\"ipa\":\"[ʊ]\",\"ex\":\"короткое\",\"wrong\":[[\"[uː]\",\"долгое, как в pool\",\"С долгим [uː] получится pool «бассейн» — другое слово.\"],[\"[ʌ]\",\"как в c span class='h'>Как поймать ошибку у себя<\/span>Запиши на телефон, как читаешь фразу «I think this is the third thing», и послушай. Если слышишь «синк» или «зис» — язык остался за зубами. Потренируйся: скажи долгое «с» и медленно выдвигай язык вперёд, пока кончик не окажется между зубами, — звук сам станет [θ]. С «з» так же получится [ð].\"],\"examples\":[{\"w\":\"[th]ink\",\"ipa\":\"[θ]\",\"ru\":\"не sink!\"},{\"w\":\"[th]ick\",\"ipa\":\"[θ]\",\"ru\":\"не sick!\"},{\"w\":\"[th]ree\",\"ipa\":\"[θ]\",\"ru\":\"не tree и не free\"},{\"w\":\"[th]is\",\"ipa\":\"[ð]\",\"ru\":\"звонкий, не zis\"},{\"w\":\"[th]e\",\"ipa\":\"[ð]\",\"ru\":\"звонкий, самое частое слово\"},{\"w\":\"brea[th]e\",\"ipa\":\"[ð]\",\"ru\":\"звонкий\"}],\"drill\":[{\"word\":\"[th]ink\",\"ipa\":\"[θ]\",\"ex\":\"межзубный глухой\",\"wrong\":[[\"[s]\",\"получится sink\",\"Язык остался за зубами — вышло sink «тонуть». Это ошибка, искажающая смысл.\"],[\"[ð]\",\"звонкий\",\"[ð] — с голосом, он в служебных словах: this, the.\"]],\"why\":\"Межзубный глухой [θ]: кончик языка между зубами, без голоса.\"},{\"word\":\"[th]ick\",\"ipa\":\"[θ]\",\"ex\":\"межзубный глухой\",\"wrong\":[[\"[s]\",\"получится sick\",\"Язык остался за зубами — вышло sick «больной». Это ошибка, искажающая смысл.\"],[\"[t]\",\"т\",\"Язык упёрся в зубы — вышло tick «галочка». Для th воздух идёт через щель между языком и зубами.\"]],\"why\":\"Межзубный глухой [θ]: кончик языка между зубами, без голоса.\"},{\"word\":\"[th]is\",\"ipa\":\"[ð]\",\"ex\":\"межзубный звонкий\",\"wrong\":[[\"[z]\",\"получится zis\",\"Язык остался за зубами — вышло «зис». Смысл не меняется, но это фонетическая ошибка, а this и the в тексте встречаются постоянно.\"],[\"[θ]\",\"глухой\",\"[θ] — глухой, без голоса: так th читается в think.\"]],\"why\":\"Межзубный звонкий [ð]: язык между зубами, с голосом.\"},{\"word\":\"[th]ree\",\"ipa\":\"[θ]\",\"ex\":\"межзубный глухой\",\"wrong\":[[\"[s]\",\"получится sree\",\"Язык остался за зубами — вышло «сри».\"],[\"[tr]\",\"тр\ [ð]. Звучит так же, как whether «ли».\"}]},{\"name\":\"w и v — разные звуки\",\"explain\":[\"<span class='h'>Чем грозит на ЕГЭ<\/span>ФИПИ требует <span class='key'>различать губно-губной [w] и губно-зубной [v]<\/span>. В русском звука [w] нет, и его заменяют на «в». Тогда west превращается в vest «жилет», а wine — в vine «лоза». Слово меняется — ошибка искажает смысл.\",\"<span class='h'>Как произносить [w]<\/span>Зубы в этом звуке не участвуют совсем. Вытяни губы трубочкой, как для русского «у», и сразу разведи их, переходя к следующей гласной: we звучит почти как быстрое «уи», wine — как «уайн».\",\"<span class='h'>Как произносить [v]<\/span>Верхние зубы слегка касаются нижней губы, воздух проходит между ними с голосом. Это почти русское «в»: very, village, seven.\",\"<span class='h'>Как узнать на письме<\/span>[w] пишется буквой w и сочетанием wh: we, what, when, white. Ещё он прячется в qu — quick читается [kwɪk] — и в слове one [wʌn]. [v] — только буква v.\",\"<span class='h'>Как поймать ошибку у себя<\/span>Читай перед зеркалом: если на [w] верхние зубы коснулись губы, получился [v]. Тренируй пары подряд — west и vest, wine и vine, wet и vet, — а потом фразу, где звуки идут вперемешку: «We visit the village every week».\"],\"examples\":[{\"w\":\"[w]est\",\"ipa\":\"[w]\",\"ru\":\"губы трубочкой · vest — зубы на губе\"},{\"w\":\"[w]ine\",\"ipa\":\"[w]\",\"ru\":\"не vine!\"},{\"w\":\"[w]et\",\"ipa\":\"[w]\",\"ru\":\"«мокрый» · vet «ветеринар» — [v]\"},{\"w\":\"[wh]at\",\"ipa\":\"[w]\",\"ru\":\"wh тоже читается [w]\"},{\"w\":\"[v]ery\",\"ipa\":\"[v]\",\"ru\":\"верхние зубы на нижней губе\"},{\"w\":\"[w]e\",\"ipa\":\"[w]\",\"ru\":\"не ve\"}],\"drill\":[{\"word\":\"[w]est\",\"ipa\":\"[w]\",\"ex\":\"губно-губной\",\"wrong\":[[\"[v]\",\"получится vest\",\"Зубы коснулись губы — вышло vest «жилет». Это ошибка, искажающая смысл.\"],[\"[u]\",\"у\",\"«у» — только начало звука. [w] короткий: губы трубочкой и сразу переход к гласной.\"]],\"why\":\"[w] — губно-губной: губы трубочкой, зубы губы не касаются.\"},{\"word\":\"[w]ine\",\"ipa\":\"[w]\",\"ex\":\"губно-губной\",\"wrong\":[[\"[v]\",\"получится vine\",\"Зубы коснулись губы — вышло vine «лоза». Это ошибка, искажающая смысл.\"],[\"[b]\",\"б\",\"На «б» губы смыкаются. На [w] они вытянуты трубочкой, но не закрыты.\"]],\"why\":\"[w] — губно-губной: губы трубочкой, зубы не участвуют.\"},{\"word\":\"[v]ery\",\"ipa\":\"[v]\",\"ex\":\"губно-зубной\",\"wrong\":[[\"[w]\",\"получится wery\",\"Губы трубочкой без зубов — вышло «уэри». Буква v всегда читается [v].\"],[\"[f]\",\"ф\",\"[f] — то же положение губ и зубов, но без голоса.\"]],\"why\":\"[v] — губно-зубной: верхние зубы касаются нижней губы, с голосом.\"},{\"word\":\"[w]hat\",\"ipa\":\"[w]\",\"ex\":\"губно-губной\",\"wrong\":[[\"[v]\",\"в\",\"На «в» зубы касаются губы, а на [w] — нет.\"],[\"[h]\",\"х\",\"[h] у wh только перед o: who, whole.\"]],\"why\":\"wh читается [w]: губы трубочкой, зубы не участвуют.\"},{\"word\":\"[v]illage\",\"ipa\":\"[v]\",\"ex\":\"губно-зубной\",\"wrong\":[[\"[w]\",\"в как в we\",\"[w] — губы трубочкой, без зубов. Буква v всегда читается [v].\"],[\"[f]\",\"ф\",\"[f] — то же положение губ и зубов, но без голоса.\"]],\"why\":\"[v] — губно-зубной: верхние зубы касаются нижней губы, с голосом.\"},{\"word\":\"[v]est\",\"ipa\":\"[v]\",\"ex\":\"губно-зубной\",\"wrong\":[[\"[w]\",\"получится west\",\"Губы трубочкой без зубов — вышло west «запад». Ошибка, искажающая смысл.\"],[\"[f]\",\"ф\",\"То же положение губ и зубов, но без голоса — вышло «фест».\"]],\"why\":\"Буква v всегда [v]: верхние зубы касаются нижней губы, голос звучит.\"},{\"word\":\"[w]ork\",\"ipa\":\"[w]\",\"ex\":\"губно-губной\",\"wrong\":[[\"[v]\",\"в\",\"Зубы коснулись губы — вышло «ворк». Для [w] губы вытянуты трубочкой.\"],[\"[u]\",\"у\",\"«у» — только начало звука: [w] короткий и сразу переходит в гласную.\"]],\"why\":\"w читается [w]: work, we, want. Зубы в этом звуке не участвуют.\"},{\"word\":\"[v]isit\",\"ipa\":\"[v]\",\"ex\":\"губно-зубной\",\"wrong\":[[\"[w]\",\"получится «уизит»\",\"Губы трубочкой — так читается w, а не v.\"],[\"[f]\",\"ф\",\"Тот же уклад, но глухой — вышло «физит».\"]],\"why\":\"v — всегда [v], в начале слова тоже: visit, very, village.\"},{\"word\":\"[w]orld\",\"ipa\":\"[w]\",\"ex\":\"губно-губной\",\"wrong\":[[\"[v]\",\"в\",\"Зубы на губе — вышло «ворлд». Для [w] зубы не нужны.\"],[\"[b]\",\"б\",\"На «б» губы смыкаются полностью, а на [w] вытягиваются трубочкой.\"]],\"why\":\"world начинается с [w], дальше идёт [ɜː]: после w сочетание or даёт именно его.\"},{\"word\":\"[v]oice\",\"ipa\":\"[v]\",\"ex\":\"губно-зубной\",\"wrong\":[[\"[w]\",\"получится «уойс»\",\"Так читается w. Буква v требует зубов на губе.\"],[\"[f]\",\"ф\",\"[f] — то же положение, но без голоса.\"]],\"why\":\"voice — [v], дальше дифтонг [ɔɪ]: oi читается «ой».\"}]},{\"name\":\"[ɔː] и [ɜː] — walk и work\",\"explain\":[\"<span class='h'>Чем грозит на ЕГЭ<\/span>ФИПИ приводит эту пару отдельно: <span class='key'>walk — work, form — firm<\/span>. Звуки близкие, а слова разные: «идти пешком» и «работа», «форма» и «фирма». Перепутал — ошибка, искажающая смысл.\",\"<span class='h'>Как произносить [ɔː]<\/span>Губы округлены и немного вытянуты, как для русского «о», звук долгий: walk, form, more, four.\",\"<span class='h'>Как произносить [ɜː]<\/span>Губы не округляй — они спокойные, чуть растянуты. Язык лежит посередине рта. Звук средний между «э» и «ё», но без округления губ: work, firm, bird, learn.\",\"<span class='h'>Как узнать на письме<\/span>[ɔː] дают or и ore (form, more), al перед k (walk, talk), aw (saw), our в слове four. [ɜː] дают er, ir, ur перед согласной (term, bird, turn) и чаще всего ear перед согласной (learn, early).\",\"Почему work читается не как fork: после <span class='key'>w<\/span> сочетание <span class='key'>or<\/span> обычно даёт [ɜː] — work, word, world, worse. А в walk и talk буквы <span class='key'>al<\/span> читаются [ɔː], l не произносится.\",\"<span class='h'>Как поймать ошибку у себя<\/span>Если округлить губы и на [ɜː], work прозвучит как walk. Посмотри в зеркало: на [ɜː] губы в лёгкой улыбке, на [ɔː] вытянуты вперёд. Читай пары подряд: walk — work, form — firm, short — shirt, born — burn.\"],\"examples\":[{\"w\":\"w[al]k\",\"ipa\":\"[ɔː]\",\"ru\":\"о · «идти пешком»\"},{\"w\":\"w[or]k\",\"ipa\":\"[ɜː]\",\"ru\":\"ё · «работа»\"},{\"w\":\"f[or]m\",\"ipa\":\"[ɔː]\",\"ru\":\"о · «форма»\"},{\"w\":\"f[ir]m\",\"ipa\":\"[ɜː]\",\"ru\":\"ё · «фирма»\"},{\"w\":\"b[or]n\",\"ipa\":\"[ɔː]\",\"ru\":\"о · «родился»\"},{\"w\":\"b[ur]n\",\"ipa\":\"[ɜː]\",\"ru\":\"ё · «гореть»\"}],\"drill\":[{\"word\":\"w[al]k\",\"ipa\":\"[ɔː]\",\"ex\":\"как в more\",\"wrong\":[[\"[ɜː]\",\"получится work\",\"Губы не округлились — вышло work «работа». Это ошибка, искажающая смысл.\"],[\"[æ]\",\"как в cat\",\"[æ] — одна a в закрытом слоге: cat.\"]],\"why\":\"al перед k читается [ɔː], l молчит: walk, talk.\"},{\"word\":\"w[or]k\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"получится walk\",\"Губы округлились — вышло walk «идти пешком».\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — одна o в закрытом слоге без r: box.\"]],\"why\":\"После w сочетание or читается [ɜː]: work, word, world.\"},{\"word\":\"f[or]m\",\"ipa\":\"[ɔː]\",\"ex\":\"как в more\",\"wrong\":[[\"[ɜː]\",\"получится firm\",\"Губы не округлились — вышло firm «фирма». Это ошибка, искажающая смысл.\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — краткое, одна o без r: box.\"]],\"why\":\"or перед согласной — долгое [ɔː], губы округлены: form «форма».\"},{\"word\":\"f[ir]m\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"получится form\",\"Губы округлились — вышло form «форма». Это ошибка, искажающая смысл.\"],[\"[ɪ]\",\"как в big\",\"[ɪ] — краткое, одна i без r: big.\"]],\"why\":\"ir перед согласной — долгое [ɜː], губы спокойные: firm «фирма».\"},{\"word\":\"sh[ir]t\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"как в short\",\"С [ɔː] получится short «короткий» — ошибка, искажающая смысл.\"],[\"[ɪ]\",\"как в big\",\"[ɪ] — краткое, одна i без r: big, sit.\"]],\"why\":\"ir перед согласной — долгое [ɜː]: shirt «рубашка».\"},{\"word\":\"t[al]k\",\"ipa\":\"[ɔː]\",\"ex\":\"как в walk\",\"wrong\":[[\"[ɜː]\",\"как в work\",\"Губы не округлились — звук ушёл в сторону work.\"],[\"[æ]\",\"как в cat\",\"[æ] — одна a в закрытом слоге. В сочетании al перед k буква l молчит, а a даёт [ɔː].\"]],\"why\":\"talk, walk, chalk: l не читается, гласная долгая и округлая [ɔː].\"},{\"word\":\"sp[or]t\",\"ipa\":\"[ɔː]\",\"ex\":\"как в more\",\"wrong\":[[\"[ɜː]\",\"как в her\",\"[ɜː] дают er, ir, ur: her, firm, turn.\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — краткое, одна o без r: box, got.\"]],\"why\":\"or под ударением — долгое округлое [ɔː]: sport, form, short.\"},{\"word\":\"w[or]d\",\"ipa\":\"[ɜː]\",\"ex\":\"после w\",\"wrong\":[[\"[ɔː]\",\"как в more\",\"[ɔː] — обычное чтение or: form, sport. Но после w сочетание or даёт [ɜː].\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — одна o без r: box, got.\"]],\"why\":\"После w сочетание or читается [ɜː]: word, work, world, worse.\"},{\"word\":\"b[ir]d\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"как в more\",\"[ɔː] даёт or: form, sport. Губы здесь не округляются.\"],[\"[aɪ]\",\"как в my\",\"[aɪ] — i в открытом слоге: five, time. Здесь после i стоит r.\"]],\"why\":\"ir под ударением — [ɜː]: bird, firm, shirt.\"},{\"word\":\"t[ur]n\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"как в more\",\"С округлыми губами получится torn «порванный» — другое слово.\"],[\"[ʌ]\",\"как в cup\",\"[ʌ] — одна u в закрытом слоге без r: cup, but.\"]],\"why\":\"ur под ударением — [ɜː]: turn, nurse, hurt.\"}]},{\"name\":\"Связующее r (linking r)\",\"explain\":[\"<span class='h'>Чем грозит на ЕГЭ<\/span>ФИПИ требует <span class='key'>владеть связующим r<\/span>. Без него слова отрываются друг от друга, и чтение звучит рублено.\",\"<span class='h'>Правило<\/span>В британском произношении r в конце слова <span class='key'>не читается<\/span>: car, more, where. Но если следующее слово начинается с гласного звука, r <span class='key'>появляется<\/span> и связывает слова: car is, more and more, where is.\",\"<span class='h'>Когда r молчит<\/span>Перед согласной и в конце фразы: car park, more time, «Where?». Смотри на начало следующего слова: в far away дальше гласная — r звучит, в far from home — согласная, r нет.\",\"<span class='h'>Как произносить<\/span>Это не русское раскатистое «р». Кончик языка приподнят к нёбу, но не касается его и не дрожит. Звук короткий, как мостик между словами: where is — почти «уэ-риз».\",\"<span class='h'>Как тренировать<\/span>Прежде чем читать текст, найди в нём все места «слово на r или re + слово на гласную» и соедини их карандашом дугой. Потом читай эти пары, не отрывая одно слово от другого: there are, for a walk, after all, here and there.\"],\"examples\":[{\"w\":\"whe[r]e is\",\"ipa\":\"[r]\",\"ru\":\"r звучит — дальше гласная\"},{\"w\":\"the[r]e are\",\"ipa\":\"[r]\",\"ru\":\"r звучит\"},{\"w\":\"fa[r] away\",\"ipa\":\"[r]\",\"ru\":\"r звучит\"},{\"w\":\"afte[r] all\",\"ipa\":\"[r]\",\"ru\":\"r звучит\"},{\"w\":\"whe[r]e\",\"ipa\":\"—\",\"ru\":\"отдельно — r не читается\"},{\"w\":\"fa[r] from\",\"ipa\":\"—\",\"ru\":\"дальше согласная — r не читается\"}],\"drill\":[{\"word\":\"whe[r]e is\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ɹə]\",\"с гласной\",\"Лишняя гласная после r не нужна: r — короткий мостик прямо к is.\"]],\"why\":\"Следующее слово is начинается с гласной — r появляется и связывает слова: «уэ-риз».\"},{\"word\":\"the[r]e are\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ə]\",\"только призвук\",\"Одного призвука мало: без r слова отрываются друг от друга.\"]],\"why\":\"Следующее слово are начинается с гласной — r появляется и связывает слова.\"},{\"word\":\"fa[r] away\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ɑː]\",\"только долгая гласная\",\"Одной долгой гласной мало: без r слова отрываются друг от друга.\"]],\"why\":\"Следующее слово away начинается с гласной — r появляется и связывает слова.\"},{\"word\":\"ca[r]\",\"ipa\":\"—\",\"ex\":\"отдельное слово — не звучит\",\"wrong\":[[\"[r]\",\"звучит\",\"r звучит, только если следующее слово начинается с гласной: car is.\"],[\"[ɹ]\",\"звучит слабо\",\"Даже слабого r здесь нет: в конце фразы r молчит полностью.\"]],\"why\":\"car отдельно, дальше ничего нет — в британском произношении r не читается: [kɑː].\"},{\"word\":\"mo[r]e and more\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ɔː]\",\"только гласная\",\"Одной гласной мало: без r слова отрываются друг от друга.\"]],\"why\":\"Следующее слово and начинается с гласной — r появляется и связывает слова.\"},{\"word\":\"fo[r] example\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"Следующее слово начинается с гласной — r оживает и связывает слова.\"],[\"[ɔː]\",\"только гласная\",\"Одной гласной мало: без r между словами появится пауза.\"]],\"why\":\"r в конце слова звучит, если дальше гласная: for example, for us.\"},{\"word\":\"fo[r] me\",\"ipa\":\"—\",\"ex\":\"не звучит\",\"wrong\":[[\"[r]\",\"звучит\",\"r звучит только перед гласной: for example. Перед согласной он молчит.\"],[\"[ɹ]\",\"слабое r\",\"Даже слабого r здесь нет: дальше идёт согласный.\"]],\"why\":\"Перед согласной конечное r молчит: for me, for you.\"},{\"word\":\"yea[r] ago\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"Дальше гласная — r произносится и соединяет слова.\"],[\"[ə]\",\"только призвук\",\"Призвука мало: нужен сам согласный [r].\"]],\"why\":\"year ago звучит слитно, через [r] — без паузы между словами.\"},{\"word\":\"he[r] eyes\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"Следующее слово начинается с гласной — r звучит.\"],[\"[ɜː]\",\"только долгая гласная\",\"Долгая гласная остаётся, но к ней добавляется мостик [r].\"]],\"why\":\"her eyes — классический случай связующего r.\"},{\"word\":\"ou[r] house\",\"ipa\":\"—\",\"ex\":\"не звучит\",\"wrong\":[[\"[r]\",\"звучит\",\"House начинается с согласного — r молчит.\"],[\"[ʊə]\",\"дифтонг с призвуком\",\"Дифтонг здесь есть, но согласный [r] не произносится.\"]],\"why\":\"Перед согласной r не звучит: our house. Зато our idea — уже со звуком.\"}]},{\"name\":\"Слабые формы служебных слов\",\"explain\":[\"<span class='h'>Чем грозит на ЕГЭ<\/span>ФИПИ требует <span class='key'>правильно использовать сильную и слабую формы<\/span> местоимений и служебных слов.\",\"<span class='h'>Что такое слабая форма<\/span>Служебные слова — артикли, предлоги, союзы, вспомогательные глаголы — в потоке речи обычно без ударения. Гласная в них сжимается до короткого нейтрального звука <span class='key'>[ə]<\/span>, похожего на безударное «а» в конце слова «мама»: to school [tə skuːl], a cup of tea [ə kʌp əv tiː].\",\"<span class='h'>Основные слабые формы<\/span>a [ə], the [ðə], and [ən], to [tə], for [fə], of [əv], at [ət], from [frəm], can [kən], was [wəz], were [wə], have [həv], some [səm].\",\"<span class='h'>Когда нужна сильная форма<\/span>Слово читается полностью, с ударением, в конце фразы и когда на нём смысл: Where are you <span class='key'>from<\/span>? [frɒm], Yes, I <span class='key'>can<\/span>. [kæn]. Перед гласным звуком the читается [ði], а to — [tu]: the apple, to eat.\",\"<span class='h'>Как поймать ошибку у себя<\/span>Если каждое служебное слово читать полностью — «ту скул», «фор ю», — речь звучит как по слогам. Прочитай фразу «I want to go for a walk», произнося полностью только слова со смыслом: want, go, walk. Служебные проговаривай быстро и тихо, будто они приклеены к соседнему слову.\"],\"examples\":[{\"w\":\"[to] school\",\"ipa\":\"[tə]\",\"ru\":\"не «ту», а слабое [tə]\"},{\"w\":\"[for] you\",\"ipa\":\"[fə]\",\"ru\":\"не «фо», а [fə]\"},{\"w\":\"[of] them\",\"ipa\":\"[əv]\",\"ru\":\"слабое [əv]\"},{\"w\":\"[can] swim\",\"ipa\":\"[kən]\",\"ru\":\"слабое [kən], не «кэн»\"},{\"w\":\"[the] apple\",\"ipa\":\"[ði]\",\"ru\":\"перед гласной the читается [ði]\"},{\"w\":\"Yes, I [can].\",\"ipa\":\"[kæn]\",\"ru\":\"в конце фразы — сильная форма\"}],\"drill\":[{\"word\":\"[to] school\",\"ipa\":\"[tə]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[tuː]\",\"сильная — под ударением\",\"Сильная форма [tuː] — под ударением или в конце фразы.\"],[\"[tɒ]\",\"то\",\"«то» — русское чтение буквы o.\"]],\"why\":\"to без ударения, дальше согласная — слабая форма [tə].\"},{\"word\":\"[for] you\",\"ipa\":\"[fə]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[fɔː]\",\"сильная\",\"Сильная [fɔː] — под ударением или в конце фразы: What for?\"],[\"[fɜː]\",\"как в fur\",\"[ɜː] — долгий звук из er, ir, ur, а в слабой форме гласная короткая.\"]],\"why\":\"for без ударения — слабая форма [fə].\"},{\"word\":\"[of] them\",\"ipa\":\"[əv]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[ɒv]\",\"сильная\",\"Сильная [ɒv] — под ударением или в конце фразы: What is it made of?\"],[\"[ɒf]\",\"как в off\",\"[ɒf] — это off «выключено, прочь».\"]],\"why\":\"of без ударения — слабая форма [əv]. Буква f в of читается [v].\"},{\"word\":\"[can] swim\",\"ipa\":\"[kən]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[kæn]\",\"сильная — в конце фразы\",\"Сильная [kæn] — в конце фразы или под ударением: Yes, I can.\"],[\"[kɑːn]\",\"долгая\",\"Долгое [ɑː] звучит в can't [kɑːnt]. Если прочитать can долго, могут услышать «не могу».\"]],\"why\":\"can перед глаголом, без ударения — слабая форма [kən].\"},{\"word\":\"[at] home\",\"ipa\":\"[ət]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[æt]\",\"сильная\",\"Сильная [æt] — под ударением или в конце фразы: What are you looking at?\"],[\"[ɑːt]\",\"долгая\",\"Долгой гласной в at не бывает.\"]],\"why\":\"at без ударения — слабая форма [ət].\"},{\"word\":\"[and] you\",\"ipa\":\"[ən]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[ænd]\",\"сильная\",\"Сильная [ænd] — под ударением или когда слова перечисляют раздельно.\"],[\"[end]\",\"энд\",\"«энд» — русское чтение буквы a.\"]],\"why\":\"В беглой речи and звучит [ən] или [ənd]: fish and chips.\"},{\"word\":\"[was] late\",\"ipa\":\"[wəz]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[wɒz]\",\"сильная\",\"Сильная [wɒz] — под ударением и в конце фразы: Yes, he was.\"],[\"[wɑːz]\",\"долгая\",\"Долгой гласной в was не бывает.\"]],\"why\":\"Безударный вспомогательный глагол ослабляется: was late — [wəz].\"},{\"word\":\"[are] going\",\"ipa\":\"[ə]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[ɑː]\",\"сильная\",\"Сильная [ɑː] — под ударением или в конце фразы: Yes, they are.\"],[\"[eə]\",\"как в care\",\"[eə] — так are читается внутри слов: care, share. Само слово are так не читается: сильная форма [ɑː], слабая [ə].\"]],\"why\":\"В связке they are going глагол ослаблен до [ə].\"},{\"word\":\"[have] seen\",\"ipa\":\"[həv]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[hæv]\",\"сильная\",\"Сильная [hæv] — когда have значит «иметь» и стоит под ударением.\"],[\"[heɪv]\",\"хэйв\",\"Долгого [eɪ] в have не бывает.\"]],\"why\":\"Во временах Perfect have безударный: I have seen часто сливается в одно слово.\"},{\"word\":\"[some] water\",\"ipa\":\"[səm]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[sʌm]\",\"сильная\",\"Сильная [sʌm] — под ударением: Some people like it.\"],[\"[səʊm]\",\"соум\",\"Такого чтения у some нет.\"]],\"why\":\"Перед существительным some ослабляется до [səm]: some water, some time.\"}]}]},\"endings\":{\"kind\":\"phon\",\"title\":\"Окончания -ed и -s: как читаются\",\"sub\":\"worked — [t], played — [d], wanted — [ɪd]; works — [s], plays — [z], watches — [ɪz]\",\"blocks\":[{\"name\":\"Окончание -ed: [t], [d] или [ɪd]\",\"explain\":[\"<span class='h'>Зачем это знать<\/span>Пишется всегда одинаково — <span class='key'>-ed<\/span>, а звучит по-разному. При чтении вслух это слышно сразу.\",\"<span class='h'>Три случая<\/span>После глухого звука — [t]. После звонкого звука или гласной — [d]. После t и d — <span class='key'>[ɪd]<\/span>, и только здесь появляется лишний слог.\",\"<span class='h'>Глухие звуки<\/span>p, k, f, s, ʃ (sh), tʃ (ch): helped, worked, laughed, missed, washed, watched. Всё это звучит с [t].\",\"<span class='h'>Звонкие и гласные<\/span>b, g, v, z, m, n, l, r и любая гласная: played, opened, lived, called, cleaned. Здесь [d].\",\"<span class='h'>Главный признак [ɪd]<\/span>Если глагол уже кончается на t или d, два одинаковых звука подряд не произнести — появляется [ɪd]: wanted, needed, started, decided.\",\"<span class='h'>Проверка на слух<\/span>Скажи слово без окончания и послушай последний звук. Дрожит голос — [d], нет — [t], а если это t или d — [ɪd].\"],\"examples\":[{\"w\":\"work[ed]\",\"ipa\":\"[t]\",\"ru\":\"после глухого k\"},{\"w\":\"play[ed]\",\"ipa\":\"[d]\",\"ru\":\"после гласной\"},{\"w\":\"want[ed]\",\"ipa\":\"[ɪd]\",\"ru\":\"после t — лишний слог\"},{\"w\":\"open[ed]\",\"ipa\":\"[d]\",\"ru\":\"после звонкого n\"}],\"drill\":[{\"word\":\"work[ed]\",\"ipa\":\"[t]\",\"ex\":\"после глухого k\",\"wrong\":[[\"[d]\",\"после звонкого\",\"[d] звучит после звонких и гласных: played, opened.\"],[\"[ɪd]\",\"после t и d\",\"[ɪd] появляется только после t и d: wanted, needed.\"]],\"why\":\"k — глухой звук, поэтому окончание глухое: [wɜːkt].\"},{\"word\":\"play[ed]\",\"ipa\":\"[d]\",\"ex\":\"после гласной\",\"wrong\":[[\"[t]\",\"после глухого\",\"[t] звучит после глухих: worked, helped.\"],[\"[ɪd]\",\"после t и d\",\"Лишний слог бывает только после t и d.\"]],\"why\":\"После гласной окончание звонкое: [pleɪd].\"},{\"word\":\"want[ed]\",\"ipa\":\"[ɪd]\",\"ex\":\"после t\",\"wrong\":[[\"[t]\",\"после глухого\",\"Два звука t подряд не произнести — между ними появляется гласная.\"],[\"[d]\",\"после звонкого\",\"То же самое: после t нужен [ɪd], иначе окончание не слышно.\"]],\"why\":\"Глагол кончается на t, поэтому [ˈwɒntɪd] — на слог длиннее.\"},{\"word\":\"help[ed]\",\"ipa\":\"[t]\",\"ex\":\"после глухого p\",\"wrong\":[[\"[d]\",\"после звонкого\",\"p — глухой, голос не дрожит, значит и окончание глухое.\"],[\"[ɪd]\",\"после t и d\",\"В конце helped нет ни t, ни d перед окончанием.\"]],\"why\":\"p — глухой звук: [helpt].\"},{\"word\":\"open[ed]\",\"ipa\":\"[d]\",\"ex\":\"после звонкого n\",\"wrong\":[[\"[t]\",\"после глухого\",\"n — звонкий: приложи руку к горлу, голос дрожит.\"],[\"[ɪd]\",\"после t и d\",\"Лишний слог тут не нужен.\"]],\"why\":\"n — звонкий, окончание тоже звонкое: [ˈəʊpənd].\"},{\"word\":\"need[ed]\",\"ipa\":\"[ɪd]\",\"ex\":\"после d\",\"wrong\":[[\"[d]\",\"после звонкого\",\"Два d подряд сливаются, поэтому и появляется [ɪd].\"],[\"[t]\",\"после глухого\",\"d — звонкий, глухого окончания здесь быть не может.\"]],\"why\":\"Глагол кончается на d: [ˈniːdɪd], лишний слог.\"},{\"word\":\"wash[ed]\",\"ipa\":\"[t]\",\"ex\":\"после глухого ш\",\"wrong\":[[\"[d]\",\"после звонкого\",\"Звук ш глухой, значит окончание тоже глухое.\"],[\"[ɪd]\",\"после t и d\",\"sh — это не t и не d.\"]],\"why\":\"sh даёт глухой [ʃ], поэтому [wɒʃt].\"},{\"word\":\"liv[ed]\",\"ipa\":\"[d]\",\"ex\":\"после звонкого v\",\"wrong\":[[\"[t]\",\"после глухого\",\"v — звонкий. Глухой вариант f дал бы [t], как в laughed.\"],[\"[ɪd]\",\"после t и d\",\"Перед окончанием стоит v.\"]],\"why\":\"v — звонкий: [lɪvd].\"},{\"word\":\"start[ed]\",\"ipa\":\"[ɪd]\",\"ex\":\"после t\",\"wrong\":[[\"[t]\",\"после глухого\",\"После t окончание не слышно без гласной, поэтому [ɪd].\"],[\"[d]\",\"после звонкого\",\"То же самое.\"]],\"why\":\"Кончается на t: [ˈstɑːtɪd].\"},{\"word\":\"watch[ed]\",\"ipa\":\"[t]\",\"ex\":\"после глухого ч\",\"wrong\":[[\"[d]\",\"после звонкого\",\"Звук ч глухой.\"],[\"[ɪd]\",\"после t и d\",\"ch — это не t, хотя t в написании есть.\"]],\"why\":\"ch даёт глухой [tʃ]: [wɒtʃt].\"}]},{\"name\":\"Окончание -s: [s], [z] или [ɪz]\",\"explain\":[\"<span class='h'>Где встречается<\/span>Это окончание множественного числа (cats, dogs) и третьего лица в Present Simple (he works, she plays).\",\"<span class='h'>Три случая<\/span>После глухого — [s]. После звонкого или гласной — [z]. После свистящих и шипящих — <span class='key'>[ɪz]<\/span>, и снова добавляется слог.\",\"<span class='h'>Глухие<\/span>p, t, k, f: stops, cats, books, laughs. Звучит [s].\",\"<span class='h'>Звонкие и гласные<\/span>b, d, g, v, m, n, l, r и гласные: dogs, plays, lives, opens. Звучит [z].\",\"<span class='h'>Когда [ɪz]<\/span>Если слово кончается на s, z, sh, ch, x, ge: buses, watches, washes, boxes, changes. Два свистящих подряд не произнести.\",\"<span class='h'>Подсказка написания<\/span>Там, где слышно [ɪz], обычно и пишется -es.\"],\"examples\":[{\"w\":\"work[s]\",\"ipa\":\"[s]\",\"ru\":\"после глухого k\"},{\"w\":\"play[s]\",\"ipa\":\"[z]\",\"ru\":\"после гласной\"},{\"w\":\"watch[es]\",\"ipa\":\"[ɪz]\",\"ru\":\"после ч — лишний слог\"},{\"w\":\"dog[s]\",\"ipa\":\"[z]\",\"ru\":\"после звонкого g\"}],\"drill\":[{\"word\":\"work[s]\",\"ipa\":\"[s]\",\"ex\":\"после глухого k\",\"wrong\":[[\"[z]\",\"после звонкого\",\"[z] звучит после звонких и гласных: plays, dogs.\"],[\"[ɪz]\",\"после шипящих\",\"[ɪz] бывает после s, sh, ch, x: watches, boxes.\"]],\"why\":\"k — глухой, окончание глухое: [wɜːks].\"},{\"word\":\"play[s]\",\"ipa\":\"[z]\",\"ex\":\"после гласной\",\"wrong\":[[\"[s]\",\"после глухого\",\"[s] звучит после p, t, k, f: stops, cats.\"],[\"[ɪz]\",\"после шипящих\",\"Лишний слог появляется только после свистящих и шипящих.\"]],\"why\":\"После гласной окончание звонкое: [pleɪz].\"},{\"word\":\"watch[es]\",\"ipa\":\"[ɪz]\",\"ex\":\"после ч\",\"wrong\":[[\"[s]\",\"после глухого\",\"После ч окончание без гласной не произнести.\"],[\"[z]\",\"после звонкого\",\"То же самое: нужен лишний слог.\"]],\"why\":\"ch даёт [tʃ], поэтому [ˈwɒtʃɪz] — на слог длиннее.\"},{\"word\":\"dog[s]\",\"ipa\":\"[z]\",\"ex\":\"после звонкого g\",\"wrong\":[[\"[s]\",\"после глухого\",\"g — звонкий. Глухая пара k дала бы [s], как в books.\"],[\"[ɪz]\",\"после шипящих\",\"g — не шипящий.\"]],\"why\":\"g — звонкий: [dɒɡz].\"},{\"word\":\"cat[s]\",\"ipa\":\"[s]\",\"ex\":\"после глухого t\",\"wrong\":[[\"[z]\",\"после звонкого\",\"t — глухой, голос не дрожит.\"],[\"[ɪz]\",\"после шипящих\",\"t — не свистящий, лишний слог не нужен.\"]],\"why\":\"t — глухой: [kæts].\"},{\"word\":\"box[es]\",\"ipa\":\"[ɪz]\",\"ex\":\"после x\",\"wrong\":[[\"[s]\",\"после глухого\",\"x — это уже [ks], ещё один [s] подряд не произнести.\"],[\"[z]\",\"после звонкого\",\"Нужен лишний слог: [ˈbɒksɪz].\"]],\"why\":\"После x всегда [ɪz]: boxes, foxes.\"},{\"word\":\"live[s]\",\"ipa\":\"[z]\",\"ex\":\"после звонкого v\",\"wrong\":[[\"[s]\",\"после глухого\",\"v — звонкий.\"],[\"[ɪz]\",\"после шипящих\",\"v — не шипящий.\"]],\"why\":\"v — звонкий: [lɪvz].\"},{\"word\":\"wash[es]\",\"ipa\":\"[ɪz]\",\"ex\":\"после ш\",\"wrong\":[[\"[s]\",\"после глухого\",\"Два шипящих подряд не произнести.\"],[\"[z]\",\"после звонкого\",\"Нужен слог: [ˈwɒʃɪz].\"]],\"why\":\"sh даёт [ʃ], поэтому окончание [ɪz].\"},{\"word\":\"book[s]\",\"ipa\":\"[s]\",\"ex\":\"после глухого k\",\"wrong\":[[\"[z]\",\"после звонкого\",\"k — глухой.\"],[\"[ɪz]\",\"после шипящих\",\"k — не шипящий.\"]],\"why\":\"k — глухой: [bʊks].\"},{\"word\":\"chang[es]\",\"ipa\":\"[ɪz]\",\"ex\":\"после дж\",\"wrong\":[[\"[z]\",\"после звонкого\",\"Звук дж уже свистящий, после него нужен слог.\"],[\"[s]\",\"после глухого\",\"Дж — звонкий, и окончание всё равно [ɪz].\"]],\"why\":\"После [dʒ] окончание читается [ɪz]: changes, pages.\"}]}]},\"texts\":{\"kind\":\"text\",\"title\":\"Тексты для чтения вслух\",\"sub\":\"На каждое правило: читаешь сам, потом слушаешь и сравниваешь\",\"blocks\":[{\"name\":\"At the Club\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"The Big Match\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"The Lost Cap\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"A Day at the Camp\",\" e\":\"The First Bicycles\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"The Titanic\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Reaching the Moon\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Lake Baikal\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"The World Wide Web\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"A Cat in a Bag\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"A Red Hen\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"A Kite by the Lake\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"My Green Tree\",\"zakryto\":true,\"n\":0,\"drill\":[],\"explain\":[],\"examples\":[]}],\"zakryto\":true},\"past\":{\"kind\":\"gram\",\"title\":\"Past Simple — прошедшее время\",\"sub\":\"was и were, окончание -ed, неправильные глаголы, didn't, вопросы с did, вопрос к подлежащему\",\"blocks\":[{\"name\":\"was и were — «был», «были»\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Правильные глаголы: окончание -ed\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Неправильные глаголы: вторая форма\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Отрицание: didn't\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Вопросы с did и короткие ответы\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Вопросительные слова и вопрос к подлежащему\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]}],\"zakryto\":true},\"egegram\":{\"kind\":\"gram\",\"fullForm\":true,\"title\":\"Грамматика в формате ЕГЭ\",\"sub\":\"Темы кодификатора: множественное число, местоимения, числительные, степени сравнения, времена глагола, пассив, модальные, неличные формы. Задания в формате ЕГЭ\",\"blocks\":[{\"name\":\"Множественное число существительных\",\"explain\":[\"<span class='h'>Как обычно<\/span>Прибавляем <span class='key'>-s<\/span>: tree — trees. После s, sh, ch, x добавляем <span class='key'>-es<\/span>: box — boxes. После o часто тоже -es: potato — potatoes; исключения ниже.\",\"<span class='h'>Изменения<\/span>Согласная + y — ies: city — cities. Гласная + y — просто -s: toy — toys, monkey — monkeys. У некоторых слов на f, fe окончание меняется на -ves: leaf — leaves, life — lives, wife — wives. Но roof — roofs.\",\"<span class='h'>Исключения<\/span>man — men, woman — women, child — children, foot — feet, tooth — teeth, mouse — mice, person — people. Не меняются: sheep, fish, deer. После o только -s: photo — photos, piano — pianos.\",\"<span class='h'>Подсказки<\/span>Глагол are, were, have; слова many, several, two, these, other, a lot of: many children, these women.\",\"<span class='h'>Ловушка<\/span>Не добавляй -s к особым формам: children, а не childrens; women, а не womans.\",\"<span class='h'>В кодификаторе ЕГЭ<\/span>Пункт 2.4.29: множественное число по правилу и исключения.\"],\"examples\":[{\"w\":\"They have three small children.\",\"ru\":\"CHILD → children\"},{\"w\":\"Doctors and nurses save people's lives.\",\"ru\":\"LIFE → lives\"},{\"w\":\"We watched six monkeys.\",\"ru\":\"MONKEY → monkeys\"}],\"drill\":[{\"q\":\"We saw two ___ drinking water from the lake.\",\"hint\":\"DEER\",\"a\":\"deer\",\"wrong\":[\"deers\",\"deeres\"],\"why\":\"Оленей два, но deer во множественном числе не меняется: one deer — two deer.\",\"src\":\"своё\",\"title\":\"A Walk in the Forest\",\"ctx\":\"Last weekend my family went to the national park.\"},{\"q\":\"They have three small ___ and a big friendly dog.\",\"hint\":\"CHILD\",\"a\":\"children\",\"wrong\":[\"childs\",\"childrens\"],\"why\":\"Детей трое — child имеет особую форму множественного числа: children (не childs).\",\"src\":\"своё\",\"title\":\"Our New Neighbours\",\"ctx\":\"A young family moved into the house next to ours.\"},{\"q\":\"The doctor said that two of my ___ needed treatment.\",\"hint\":\"TOOTH\",\"a\":\"teeth\",\"wrong\":[\"tooths\",\"tooth\"],\"why\":\"Зубов два — tooth во множественном числе меняет гласную: teeth.\",\"src\":\"своё\",\"title\":\"At the Dentist\",\"ctx\":\"I hate going to the dentist, but last month I had to.\"},{\"q\":\"I love walking in the park when yellow and red ___ cover the paths.\",\"hint\":\"LEAF\",\"a\":\"leaves\",\"wrong\":[\"leafs\",\"leaf\"],\"why\":\"Листьев много (глагол cover) — f меняется на v: leaf → leaves.\",\"src\":\"своё\",\"title\":\"Autumn in the Park\",\"ctx\":\"Autumn is my favourite season.\"},{\"q\":\"He has over a hundred ___, and every morning I helped him feed them.\",\"hint\":\"SHEEP\",\"a\":\"sheep\",\"wrong\":[\"sheeps\",\"sheepes\"],\"why\":\"Овец больше сотни, но sheep во множественном числе не меняется: one sheep — a hundred sheep.\",\"src\":\"своё\",\"title\":\"A Farm Holiday\",\"ctx\":\"In summer we stayed on my uncle's farm.\"},{\"q\":\"Now there are new ___ full of books along every wall.\",\"hint\":\"SHELF\",\"a\":\"shelves\",\"wrong\":[\"shelfs\",\"shelf\"],\"why\":\"Есть there are — нужно множественное число; f меняется на v: shelf → shelves.\",\"src\":\"своё\",\"title\":\"The School Library\",\"ctx\":\"Our school library has recently been renovated.\"},{\"q\":\"First, we washed and peeled five ___.\",\"hint\":\"POTATO\",\"a\":\"potatoes\",\"wrong\":[\"potatos\",\"potato\"],\"why\":\"Картофелин пять — после o здесь добавляем -es: potato → potatoes.\",\"src\":\"своё\",\"title\":\"A Cooking Lesson\",\"ctx\":\"Yesterday my grandmother taught me to make soup.\"},{\"q\":\"More than forty thousand ___ came to the stadium to watch it.\",\"hint\":\"PERSON\",\"a\":\"people\",\"wrong\":[\"peoples\",\"person\"],\"why\":\"Людей много — множественное число от person: people. Peoples — это «народы».\",\"src\":\"своё\",\"title\":\"Football Fans\",\"ctx\":\"The final match was played on Saturday.\"},{\"q\":\"Last week we found three ___ in the kitchen, and the cat didn't even notice them.\",\"hint\":\"MOUSE\",\"a\":\"mice\",\"wrong\":[\"mouses\",\"mouse\"],\"why\":\"Мышей три — mouse имеет особую форму множественного числа: mice.\",\"src\":\"своё\",\"title\":\"A Lazy Cat\",\"ctx\":\"Our cat is very lazy.\"},{\"q\":\"He says that big ___ are noisy but full of opportunities.\",\"hint\":\"CITY\",\"a\":\"cities\",\"wrong\":[\"citys\",\"city\"],\"why\":\"Речь о больших городах вообще (глагол are) — согласная + y: y меняется на ies: city → cities.\",\"src\":\"своё\",\"title\":\"City Life\",\"ctx\":\"My cousin lives in Moscow.\"},{\"q\":\"Last year more than two hundred ___ took part in it, most of them mothers with children.\",\"hint\":\"WOMAN\",\"a\":\"women\",\"wrong\":[\"womans\",\"woman\"],\"why\":\"Женщин больше двухсот — woman во множественном числе меняет корень: women.\",\"src\":\"своё\",\"title\":\"Volunteers\",\"ctx\":\"Every spring our town organises a clean-up day.\"},{\"q\":\"My room is full of ___ with books and clothes.\",\"hint\":\"BOX\",\"a\":\"boxes\",\"wrong\":[\"boxs\",\"box\"],\"why\":\"Коробок много — после x добавляем -es: box → boxes.\",\"src\":\"своё\",\"title\":\"Moving House\",\"ctx\":\"We are moving to a new flat next week.\"},{\"q\":\"In the evening both my ___ hurt so much that I could hardly stand.\",\"hint\":\"FOOT\",\"a\":\"feet\",\"wrong\":[\"foots\",\"foot\"],\"why\":\"Both означает обе: речь об обеих ступнях. Foot во множественном числе меняет гласную: feet.\",\"src\":\"своё\",\"title\":\"A Long Walk\",\"ctx\":\"Yesterday we walked twenty kilometres in the mountains.\"},{\"q\":\"My mum makes ___ for everyone while my dad looks for his car keys.\",\"hint\":\"SANDWICH\",\"a\":\"sandwiches\",\"wrong\":[\"sandwichs\",\"sandwich\"],\"why\":\"Бутерброды на всех — после ch добавляем -es: sandwich → sandwiches.\",\"src\":\"своё\",\"title\":\"A Busy Morning\",\"ctx\":\"Mornings in our house are always busy.\"},{\"q\":\"I put plates, forks and ___ on the table.\",\"hint\":\"KNIFE\",\"a\":\"knives\",\"wrong\":[\"knifes\",\"knife\"],\"why\":\"Ножей много (как plates, forks) — fe меняется на ves: knife → knives.\",\"src\":\"своё\",\"title\":\"Setting the Table\",\"ctx\":\"My parents invited guests for dinner.\"},{\"q\":\"We watched six ___ swinging from tree to tree.\",\"hint\":\"MONKEY\",\"a\":\"monkeys\",\"wrong\":[\"monkies\",\"monkey\"],\"why\":\"Обезьян шесть. Перед y гласная e, поэтому просто -s: monkey → monkeys (не -ies).\",\"src\":\"своё\",\"title\":\"A Trip to the Zoo\",\"ctx\":\"Last Sunday our class went to the zoo.\"},{\"q\":\"When we came back, I printed our ___ and put them into a big album.\",\"hint\":\"PHOTO\",\"a\":\"photos\",\"wrong\":[\"photoes\",\"photo\"],\"why\":\"Фотографий много (put them). Photo — исключение: после o только -s, photos (не photoes).\",\"src\":\"своё\",\"title\":\"After the Holiday\",\"ctx\":\"We spent two weeks at the seaside and took hundreds of pictures.\"},{\"q\":\"Doctors and nurses save people's ___ every day.\",\"hint\":\"LIFE\",\"a\":\"lives\",\"wrong\":[\"lifes\",\"life\"],\"why\":\"Речь о жизнях многих людей — fe меняется на ves: life → lives.\",\"src\":\"своё\",\"title\":\"A Dream Job\",\"ctx\":\"My sister wants to work in a hospital.\"},{\"q\":\"We have bought small ___ as presents for all the guests.\",\"hint\":\"TOY\",\"a\":\"toys\",\"wrong\":[\"toies\",\"toy\"],\"why\":\"Игрушек много. Перед y гласная o, поэтому просто -s: toy → toys (не -ies).\",\"src\":\"своё\",\"title\":\"A Birthday Party\",\"ctx\":\"We are planning a birthday party for my little sister.\"},{\"q\":\"He and his two best friends were brave young ___ who loved adventures.\",\"hint\":\"MAN\",\"a\":\"men\",\"wrong\":[\"mans\",\"man\"],\"why\":\"Их трое (were) — man во множественном числе меняет гласную: men.\",\"src\":\"своё\",\"title\":\"Old Friends\",\"ctx\":\"My grandfather often tells stories about his youth.\"}]},{\"name\":\"Местоимения\",\"explain\":[\"<span class='h'>Чей? — притяжательные<\/span><span class='key'>my, your, his, her, its, our, their<\/span> перед существительным: their house. Без существительного — <span class='key'>mine, yours, his, hers, ours, theirs<\/span>: The house is theirs.\",\"<span class='h'>Кого? Кому? — объектный падеж<\/span>После глагола и предлога: <span class='key'>me, you, him, her, it, us, them<\/span>: Tell them. Come with us.\",\"<span class='h'>Себя — возвратные<\/span><span class='key'>myself, yourself, himself, herself, itself, ourselves, yourselves, themselves<\/span>: He did it himself. They enjoyed themselves.\",\"<span class='h'>Этот — эти, тот — те<\/span>Во множественном числе <span class='key'>this → these<\/span> (рядом: these toys), <span class='key'>that → those<\/span> (далеко: those coins over there).\",\"<span class='h'>Как решать<\/span>Определи роль местоимения. Кто выполняет действие: I, we, they. Кого или кому: me, us, them. Чей предмет: my, their перед существительным или mine, theirs без него. Действие направлено на самого себя или подчёркиваем «сам»: myself, themselves. By + возвратное означает «самостоятельно».\",\"<span class='h'>Ловушка<\/span>its без апострофа — притяжательное: The city and its parks. it's = it is или it has. И ourselves, themselves — с -ves во множественном.\",\"<span class='h'>В кодификаторе ЕГЭ<\/span>Пункт 2.4.36: личные, притяжательные и возвратные местоимения.\"],\"examples\":[{\"w\":\"They built their own house.\",\"ru\":\"THEY → чей? their\"},{\"w\":\"The teacher helped us.\",\"ru\":\"WE → кому? us\"},{\"w\":\"She did it herself.\",\"ru\":\"SHE → сама, herself\"}],\"drill\":[{\"q\":\"Our teacher took a lot of photos and later showed ___ to us.\",\"hint\":\"THEY\",\"a\":\"them\",\"wrong\":[\"their\",\"they\"],\"why\":\"Кого показал? Фотографии — после глагола нужен объектный падеж: they → them.\",\"src\":\"своё\",\"title\":\"Our School Trip\",\"ctx\":\"Last month our class went to St Petersburg.\"},{\"q\":\"Now he never lets anyone touch ___ phone.\",\"hint\":\"HE\",\"a\":\"his\",\"wrong\":[\"him\",\"he\"],\"why\":\"Чей телефон? Его — перед существительным притяжательное: he → his.\",\"src\":\"своё\",\"title\":\"A New Phone\",\"ctx\":\"My brother saved money for a year to buy a new phone.\"},{\"q\":\"\\\"Excuse me, is this umbrella ___?\\\" I asked the girl behind me.\",\"hint\":\"YOU\",\"a\":\"yours\",\"wrong\":[\"your\",\"you\"],\"why\":\"После пропуска существительного нет — нужна форма без существительного: yours (не your).\",\"src\":\"своё\",\"title\":\"The Lost Umbrella\",\"ctx\":\"After the concert I found a blue umbrella on the seat next to me.\"},{\"q\":\"When it is hungry, it brings ___ bowl to my mum.\",\"hint\":\"IT\",\"a\":\"its\",\"wrong\":[\"it's\",\"it\"],\"why\":\"Чья миска? Собаки — притяжательное its, без апострофа. It's = it is.\",\"src\":\"своё\",\"title\":\"A Clever Dog\",\"ctx\":\"Our dog is very clever.\"},{\"q\":\"Yesterday she made a birthday cake for our mum all by ___.\",\"hint\":\"SHE\",\"a\":\"herself\",\"wrong\":[\"her\",\"hers\"],\"why\":\"By + возвратное = сам, без помощи: she → herself.\",\"src\":\"своё\",\"title\":\"A Surprise for Mum\",\"ctx\":\"My little sister is only ten.\"},{\"q\":\"Every summer they invite my cousins and ___ to stay with them.\",\"hint\":\"I\",\"a\":\"me\",\"wrong\":[\"I\",\"my\"],\"why\":\"Кого приглашают? После глагола объектный падеж: I → me. Проверь: убери cousins — invite me.\",\"src\":\"своё\",\"title\":\"Granny's Garden\",\"ctx\":\"My grandparents live in a village.\"},{\"q\":\"Tom couldn't do the last task, so I helped ___.\",\"hint\":\"HE\",\"a\":\"him\",\"wrong\":[\"his\",\"he\"],\"why\":\"Помог кому? После глагола объектный падеж: he → him.\",\"src\":\"своё\",\"title\":\"A Difficult Test\",\"ctx\":\"The maths test was really hard.\"},{\"q\":\"\\\"___ toys were mine when I was a child,\\\" she told me, opening the box.\",\"hint\":\"THIS\",\"a\":\"These\",\"wrong\":[\"This\",\"Those\"],\"why\":\"Игрушек много (toys, were) и они рядом, в руках — this во множественном числе: these.\",\"src\":\"своё\",\"title\":\"Old Toys\",\"ctx\":\"My mum keeps a box of old toys in the attic.\"},{\"q\":\"___ house is the oldest in our street.\",\"hint\":\"THEY\",\"a\":\"Their\",\"wrong\":[\"Them\",\"Theirs\"],\"why\":\"Чей дом? Их — перед существительным притяжательное: they → their.\",\"src\":\"своё\",\"title\":\"Neighbours\",\"ctx\":\"Mr and Mrs Brown live next door.\"},{\"q\":\"Everyone in town was proud of ___.\",\"hint\":\"WE\",\"a\":\"us\",\"wrong\":[\"our\",\"we\"],\"why\":\"После предлога of объектный падеж: we → us.\",\"src\":\"своё\",\"title\":\"The Champions\",\"ctx\":\"Our school football team won the city cup last year.\"},{\"q\":\"I bought a book and gave it to ___.\",\"hint\":\"SHE\",\"a\":\"her\",\"wrong\":[\"hers\",\"she\"],\"why\":\"После предлога to объектный падеж: she → her.\",\"src\":\"своё\",\"title\":\"A Birthday Present\",\"ctx\":\"It was my friend Kate's birthday on Friday.\"},{\"q\":\"\\\"Help ___ to some food and drinks!\\\" my dad said to them with a smile.\",\"hint\":\"YOU\",\"a\":\"yourselves\",\"wrong\":[\"yourself\",\"yours\"],\"why\":\"Help yourself — угощайся. Гостей много (said to them), поэтому множественное: yourselves.\",\"src\":\"своё\",\"title\":\"Party Time\",\"ctx\":\"The guests arrived at seven.\"},{\"q\":\"\\\"Look at ___ old coins over there,\\\" the guide said.\",\"hint\":\"THAT\",\"a\":\"those\",\"wrong\":[\"that\",\"these\"],\"why\":\"Монет много (coins) и они далеко (over there) — that во множественном числе: those.\",\"src\":\"своё\",\"title\":\"In the Museum\",\"ctx\":\"On Sunday we went to the history museum.\"},{\"q\":\"Anna's room is always tidy, but ___ is a mess.\",\"hint\":\"SHE\",\"a\":\"hers\",\"wrong\":[\"her\",\"she\"],\"why\":\"Её комната (Марии), а существительного после пропуска нет — форма без существительного: hers.\",\"src\":\"своё\",\"title\":\"Twins\",\"ctx\":\"Anna and Maria are twins, but they are very different.\"},{\"q\":\"He was angry with ___ for being so lazy.\",\"hint\":\"HE\",\"a\":\"himself\",\"wrong\":[\"him\",\"his\"],\"why\":\"Злился на самого себя — тот же человек, что и подлежащее: возвратное himself.\",\"src\":\"своё\",\"title\":\"A Lesson Learnt\",\"ctx\":\"Tom forgot to do his homework again.\"},{\"q\":\"The flat is small, but ___ windows look out on the river.\",\"hint\":\"IT\",\"a\":\"its\",\"wrong\":[\"it's\",\"their\"],\"why\":\"Чьи окна? Квартиры (the flat — it) — притяжательное its, без апострофа.\",\"src\":\"своё\",\"title\":\"A Flat by the River\",\"ctx\":\"My parents bought a flat in the city centre last year.\"},{\"q\":\"The children made a fire and cooked dinner by ___.\",\"hint\":\"THEY\",\"a\":\"themselves\",\"wrong\":[\"them\",\"themself\"],\"why\":\"By + возвратное = сами, без помощи. Детей много: they → themselves.\",\"src\":\"своё\",\"title\":\"Summer Camp\",\"ctx\":\"Last summer my brother went to a camp in the forest.\"},{\"q\":\"___ new house is near a big park.\",\"hint\":\"WE\",\"a\":\"Our\",\"wrong\":[\"Ours\",\"Us\"],\"why\":\"Чей дом? Наш — перед существительным притяжательное: we → our.\",\"src\":\"своё\",\"title\":\"A New Home\",\"ctx\":\"We moved to this town two years ago.\"},{\"q\":\"\\\"It isn't ___,\\\" I said. \\\"My pen is red.\\\"\",\"hint\":\"I\",\"a\":\"mine\",\"wrong\":[\"my\",\"me\"],\"why\":\"После пропуска существительного нет — форма без существительного: mine (не my).\",\"src\":\"своё\",\"title\":\"Lost and Found\",\"ctx\":\"Our teacher found a pen on the floor and asked whose it was.\"},{\"q\":\"\\\"___ photos on the far wall were taken in 1975,\\\" she said.\",\"hint\":\"THAT\",\"a\":\"Those\",\"wrong\":[\"That\",\"These\"],\"why\":\"Фотографий много (were) и они далеко (on the far wall) — that во множественном числе: those.\",\"src\":\"своё\",\"title\":\"Grandma's Photos\",\"ctx\":\"There are a lot of old photos in my grandmother's room.\"}]},{\"name\":\"Числительные\",\"zakryto\":true,\"n\":20,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Степени сравнения\",\"explain\":[\"<span class='h'>Сравнительная<\/span>Сравниваем два предмета, рядом <span class='key'>than<\/span>: short — shorter, big — bigger, easy — easier, beautiful — more beautiful.\",\"<span class='h'>Превосходная<\/span>Самый из всех: <span class='key'>the … -est, the most …<\/span>. Подсказки: one of the, in the world, ever, of all: one of the coldest places.\",\"<span class='h'>Особые формы<\/span>good — better — the best, well (хорошо) — better — the best, bad — worse — the worst, many/much — more — the most, little — less — the least, far — farther/further — the farthest/furthest.\",\"<span class='h'>Правописание<\/span>Удвоение: big — bigger, hot — hottest. y на i: happy — happier, busy — busiest. Немое e: large — larger.\",\"<span class='h'>Ловушка<\/span>Если the уже стоит перед пропуском, в ответ его не пиши: one of the ___ → coldest. Не путай «more» с -er: не «more colder».\",\"<span class='h'>В кодификаторе ЕГЭ<\/span>Пункт 2.4.33: прилагательные и наречия в степенях сравнения.\"],\"examples\":[{\"w\":\"one of the coldest parts of Russia\",\"ru\":\"COLD → превосходная, one of the\"},{\"w\":\"It is bigger than London.\",\"ru\":\"BIG → сравнительная, than\"},{\"w\":\"the best time to visit\",\"ru\":\"GOOD → особая форма\"}],\"drill\":[{\"q\":\"The weather there was much ___ than in our city.\",\"hint\":\"COLD\",\"a\":\"colder\",\"wrong\":[\"coldest\",\"more cold\"],\"why\":\"Сравниваем два места, рядом than — сравнительная: cold → colder.\",\"src\":\"своё\",\"title\":\"A Trip to the Mountains\",\"ctx\":\"Last summer we went to the Urals.\"},{\"q\":\"Pete is tall, but Sam is even ___.\",\"hint\":\"TALL\",\"a\":\"taller\",\"wrong\":[\"tallest\",\"more tall\"],\"why\":\"Сравниваем двоих, even = ещё — сравнительная: tall → taller.\",\"src\":\"своё\",\"title\":\"My Two Brothers\",\"ctx\":\"I have two older brothers, Pete and Sam.\"},{\"q\":\"The ___ day of the year was in July, and nobody wanted to go outside.\",\"hint\":\"HOT\",\"a\":\"hottest\",\"wrong\":[\"hotest\",\"hotter\"],\"why\":\"Самый жаркий из всех дней года — превосходная. Короткая гласная + согласная: t удваивается — hottest.\",\"src\":\"своё\",\"title\":\"A Hot Summer\",\"ctx\":\"Last summer was very hot.\"},{\"q\":\"My new one is much ___ and lighter.\",\"hint\":\"FAST\",\"a\":\"faster\",\"wrong\":[\"fastest\",\"more fast\"],\"why\":\"Сравниваем два велосипеда, much = намного — сравнительная: fast → faster.\",\"src\":\"своё\",\"title\":\"A New Bike\",\"ctx\":\"My old bike was slow and heavy.\"},{\"q\":\"Tom is the ___ of them; he weighs almost seven kilos.\",\"hint\":\"BIG\",\"a\":\"biggest\",\"wrong\":[\"bigest\",\"bigger\"],\"why\":\"Самый большой из трёх (of them) — превосходная. g удваивается: biggest.\",\"src\":\"своё\",\"title\":\"Our Cats\",\"ctx\":\"We have three cats at home.\"},{\"q\":\"Monday is the ___ day of my week.\",\"hint\":\"BUSY\",\"a\":\"busiest\",\"wrong\":[\"busyest\",\"busier\"],\"why\":\"Самый загруженный день недели — превосходная. Согласная + y: y меняется на i — busiest.\",\"src\":\"своё\",\"title\":\"My Week\",\"ctx\":\"I always have a lot of lessons on Monday.\"},{\"q\":\"Now, after two years of lessons, it is much ___ for me.\",\"hint\":\"EASY\",\"a\":\"easier\",\"wrong\":[\"easyer\",\"more easy\"],\"why\":\"Сравниваем «тогда» и «сейчас», much = намного — сравнительная. y меняется на i: easier.\",\"src\":\"своё\",\"title\":\"Learning English\",\"ctx\":\"At first English seemed very difficult to me.\"},{\"q\":\"It was the ___ film I have ever seen; we laughed all the time.\",\"hint\":\"FUNNY\",\"a\":\"funniest\",\"wrong\":[\"funnyest\",\"funnier\"],\"why\":\"The … I have ever seen — самый из всех, превосходная. y меняется на i: funniest.\",\"src\":\"своё\",\"title\":\"A Comedy\",\"ctx\":\"Last night we watched a new comedy.\"},{\"q\":\"In the end I chose the ___ one in the shop, with lovely pictures.\",\"hint\":\"BEAUTIFUL\",\"a\":\"most beautiful\",\"wrong\":[\"beautifullest\",\"more beautiful\"],\"why\":\"Самая красивая в магазине — превосходная. Длинное слово — с most: the most beautiful. В бланке ЕГЭ слитно: mostbeautiful.\",\"src\":\"своё\",\"title\":\"Choosing a Present\",\"ctx\":\"I couldn't decide which book to buy for my mum.\",\"alt\":[\"mostbeautiful\"]},{\"q\":\"Our teacher says that this project is ___ than all the others this year.\",\"hint\":\"IMPORTANT\",\"a\":\"more important\",\"wrong\":[\"importanter\",\"most important\"],\"why\":\"Рядом than — сравнительная. Длинное слово — с more: more important. В бланке ЕГЭ слитно: moreimportant.\",\"src\":\"своё\",\"title\":\"The School Project\",\"ctx\":\"We have been working on our history project for a month.\",\"alt\":[\"moreimportant\"]},{\"q\":\"But my result was ___ than I expected; I got a five!\",\"hint\":\"GOOD\",\"a\":\"better\",\"wrong\":[\"gooder\",\"best\"],\"why\":\"Рядом than — сравнительная. Особая форма: good → better.\",\"src\":\"своё\",\"title\":\"Exam Results\",\"ctx\":\"I was worried about the maths exam.\"},{\"q\":\"It was the ___ day of the month.\",\"hint\":\"BAD\",\"a\":\"worst\",\"wrong\":[\"baddest\",\"worse\"],\"why\":\"Самый плохой день месяца — превосходная. Особая форма: bad → the worst.\",\"src\":\"своё\",\"title\":\"A Bad Day\",\"ctx\":\"Everything went wrong yesterday: I missed the bus, lost my keys and got a bad mark.\"},{\"q\":\"On Tuesday I felt even ___, so I stayed in bed.\",\"hint\":\"BAD\",\"a\":\"worse\",\"wrong\":[\"badder\",\"worst\"],\"why\":\"Сравниваем понедельник и вторник, even = ещё — сравнительная. Особая форма: bad → worse.\",\"src\":\"своё\",\"title\":\"Feeling Ill\",\"ctx\":\"On Monday I had a bad cold.\"},{\"q\":\"But this café makes the ___ pizza in town.\",\"hint\":\"GOOD\",\"a\":\"best\",\"wrong\":[\"goodest\",\"better\"],\"why\":\"Самая вкусная в городе (in town) — превосходная. Особая форма: good → the best.\",\"src\":\"своё\",\"title\":\"Our Favourite Café\",\"ctx\":\"There are a lot of cafés in our street.\"},{\"q\":\"I spend much ___ money on clothes than she does.\",\"hint\":\"LITTLE\",\"a\":\"less\",\"wrong\":[\"littler\",\"least\"],\"why\":\"Рядом than — сравнительная. Особая форма: little → less (меньше денег).\",\"src\":\"своё\",\"title\":\"Saving Money\",\"ctx\":\"My sister buys a lot of clothes.\"},{\"q\":\"This year ___ students have joined it than last year.\",\"hint\":\"MANY\",\"a\":\"more\",\"wrong\":[\"manier\",\"most\"],\"why\":\"Than last year явно задаёт сравнение с прошлым годом — нужна сравнительная форма: many → more.\",\"src\":\"своё\",\"title\":\"A Popular Club\",\"ctx\":\"Last year only ten students went to our chess club.\"},{\"q\":\"The village where we stayed was ___ than we thought.\",\"hint\":\"FAR\",\"a\":\"farther\",\"wrong\":[\"farer\",\"farthest\"],\"why\":\"Рядом than — сравнительная. Особая форма: far → farther (или further).\",\"src\":\"своё\",\"title\":\"A Long Journey\",\"ctx\":\"We drove for six hours to get to the sea.\",\"alt\":[\"further\"]},{\"q\":\"It is the ___ mountain in Europe.\",\"hint\":\"HIGH\",\"a\":\"highest\",\"wrong\":[\"higher\",\"most high\"],\"why\":\"Самая высокая в Европе (in Europe) — превосходная: high → the highest.\",\"src\":\"своё\",\"title\":\"Mount Elbrus\",\"ctx\":\"Elbrus is a mountain in the Caucasus.\"},{\"q\":\"He says he feels ___ now than he did at fifty.\",\"hint\":\"HEALTHY\",\"a\":\"healthier\",\"wrong\":[\"healthyer\",\"more healthy\"],\"why\":\"Рядом than — сравнительная. y меняется на i: healthier.\",\"src\":\"своё\",\"title\":\"A Healthy Life\",\"ctx\":\"My grandfather is seventy, but he goes swimming every day.\"},{\"q\":\"The stone bridge in the centre is the ___ of them all; it was built two hundred years ago.\",\"hint\":\"OLD\",\"a\":\"oldest\",\"wrong\":[\"older\",\"most old\"],\"why\":\"Самый старый из всех (of them all) — превосходная: old → the oldest.\",\"src\":\"своё\",\"title\":\"The Old Bridge\",\"ctx\":\"There are many bridges in our city.\"},{\"q\":\"Kate is the ___ of them; she is only two.\",\"hint\":\"YOUNG\",\"a\":\"youngest\",\"wrong\":[\"younger\",\"most young\"],\"why\":\"Самая младшая из пяти (of them) — превосходная: young → the youngest.\",\"src\":\"своё\",\"title\":\"A Big Family\",\"ctx\":\"My uncle has five children.\"},{\"q\":\"In May the weather was much ___.\",\"hint\":\"NICE\",\"a\":\"nicer\",\"wrong\":[\"nicest\",\"niceer\"],\"why\":\"Сравниваем апрель и май, much = намного — сравнительная. Немое e: добавляем только -r — nicer.\",\"src\":\"своё\",\"title\":\"Spring Weather\",\"ctx\":\"In April it was rainy and cold.\"},{\"q\":\"He is one of the ___ Russian poets.\",\"hint\":\"FAMOUS\",\"a\":\"most famous\",\"wrong\":[\"famousest\",\"more famous\"],\"why\":\"One of the … — превосходная. Длинное слово — с most: the most famous. В бланке ЕГЭ слитно: mostfamous.\",\"src\":\"своё\",\"title\":\"A Famous Poet\",\"ctx\":\"Every child in Russia knows Pushkin's poems by heart.\",\"alt\":[\"mostfamous\"]},{\"q\":\"She plays ___ than anyone else in our class.\",\"hint\":\"WELL\",\"a\":\"better\",\"wrong\":[\"weller\",\"best\"],\"why\":\"Рядом than — сравнительная. Well (хорошо) — особая форма, как у good: well → better.\",\"src\":\"своё\",\"title\":\"The Tennis Player\",\"ctx\":\"My friend Ann has been playing tennis since she was six.\"}]},{\"name\":\"Present Simple\",\"zakryto\":true,\"n\":20,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Past Simple\",\"zakryto\":true,\"n\":25,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Будущее: will и would\",\"zakryto\":true,\"n\":20,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Present и Past Continuous\",\"zakryto\":true,\"n\":20,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Present Perfect и Past Perfect\",\"zakryto\":true,\"n\":24,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Страдательный залог\",\"zakryto\":true,\"n\":24,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Модальные глаголы\",\"za
