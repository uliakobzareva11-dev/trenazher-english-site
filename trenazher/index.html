"examples\":[]},{\"name\":\"Порядок прилагательных\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"none, no, nobody, nothing\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"both … and, either … or, neither … nor\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Предлоги в страдательном залоге: by, with, of\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]}],\"zakryto\":true}};\n\n/* ---------------- ЛОГИКА ---------------- */\nconst $ = s => document.querySelector(s);\nlet setKey=null, blockIdx=0, items=[], idx=0, missed=[], answered=false, totalAnswered=0;\n/* Прогресс живёт в браузере: закрыл вкладку — пройденное на месте.\n   У каждого ученика свой профиль, внутри пометки вида \"types-0\" и счёт ошибок по темам. */\nconst STORE_KEY = \"trenazher-english-v2\";\nconst PROGRESS_KEY = \"trenazher-english-progress-v1\";   // как хранили до появления профилей\n\nfunction segodnya(){\n  const d = new Date();\n  return (\"0\"+d.getDate()).slice(-2) + \".\" + (\"0\"+(d.getMonth()+1)).slice(-2) + \".\" + d.getFullYear();\n}\n\nfunction loadStore(){\n  try {\n    const raw = localStorage.getItem(STORE_KEY);\n    if(raw){\n      const s = JSON.parse(raw);\n      if(s && s.users) return s;\n    }\n  } catch(e){}\n  let staroe = null;                       // прогресс, записанный до профилей, не теряем\n  try { staroe = JSON.parse(localStorage.getItem(PROGRESS_KEY) || \"null\"); } catch(e){}\n  if(staroe && Object.keys(staroe).length)\n    return {active:\"Ученик\", users:{\"Ученик\":{passed:staroe, errors:{}, created:segodnya()}}};\n  return {active:null, users:{}};\n}\n\nlet store = loadStore();\nlet passed = {};                 // ссылка на прогресс активного ученика\n\n/* 21.10.2026: темы вставляли, объединяли и удаляли, а прогресс хранится по номеру темы —\n   один раз переносим отметки на новые номера. Ошибки переносим по названию темы. */\n(function perenosTem(){\n  if(store.perenos1021) return;\n  const novyNomer = {\n    apr:   i => i >= 3 ? i + 1 : i,                    // вставлена «Меняют смысл» после герундия\n    kodif: i => i === 2 ? null : (i > 2 ? i - 1 : i),  // убран Complex Subject\n    feb:   i => i === 4 ? 5 : i                        // согласование + Reported Speech = «Косвенная речь»\n  };\n  const staroeImya = {\"Согласование времён\":\"Косвенная речь\", \"Reported Speech\":\"Косвенная речь\"};\n  Object.values(store.users).forEach(u => {\n    const p = {};\n    Object.keys(u.passed || {}).forEach(k => {\n      const m = k.match(/^(\\w+)-(\\d+)$/);\n      if(!m || !novyNomer[m[1]]){ p[k] = u.passed[k]; return; }\n      const n = novyNomer[m[1]](+m[2]);\n      if(n !== null) p[m[1] + \"-\" + n] = true;\n    });\n    u.passed = p;\n    const e = {};\n    Object.keys(u.errors || {}).forEach(k => {\n      const st = u.errors[k], set = SETS[st.set];\n      const imya = staroeImya[st.name] || st.name;\n      const n = set ? set.blocks.findIndex(b => b.name === imya) : -1;\n      if(n < 0){ if(!set || st.set === \"kodif\" && /Complex Subject/.test(st.name)) return; e[k] = st; return; }\n      const key = st.set + \"-\" + n;\n      if(e[key]){ e[key].wrong += st.wrong; e[key].total += st.total; }\n      else { st.name = imya; e[key] = st; }\n    });\n    u.errors = e;\n  });\n  store.perenos1021 = true;\n  saveStore();\n})();\n\nfunction saveStore(){\n  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){}\n}\nfunction saveProgress(){ saveStore(); }    // имя оставлено: его зовёт остальной код\n\nfunction uchenik(){ return store.users[store.active] || null; }\n\nfunction vybrat(name){\n  if(!store.users[name]) store.users[name] = {passed:{}, errors:{}, created:segodnya()};\n  store.active = name;\n  passed = store.users[name].passed;\n  if(!store.users[name].errors) store.users[name].errors = {};\n  saveStore();\n}\n\n/* Счёт по темам: сколько заданий сделано и сколько из них с ошибкой.\n   Считаем и в повторении: забыл прошлую тему — это тоже сигнал репетитору. */\n/* цели Метрики: где уходят новые люди. Имена в Метрику не отправляем */\nconst cel = id => { try{ ym(113733723, 'reachGoal', id); }catch(e){} };\nlet otvetPoslan = false;\n\nfunction noteResult(verno){\n  if(!otvetPoslan){ otvetPoslan = true; cel(\"otvet\"); }   // один раз за заход\n  const u = uchenik(); if(!u || !setKey) return;\n  const key = setKey + \"-\" + (revising ? reviseIdx : blockIdx);\n  const st = u.errors[key] || (u.errors[key] = {set:setKey, setTitle:SETS[setKey].title, name:curBlock().name, wrong:0, total:0});\n  st.name = curBlock().name;\n  st.total++;\n  if(!verno) st.wrong++;\n  const q = items[idx] && items[idx].q;          // какие задания с ошибкой — для повторения\n  if(q){\n    st.miss = st.miss || [];\n    if(!verno && !st.miss.includes(q)) st.miss.push(q);\n    if(verno && revising) st.miss = st.miss.filter(x => x !== q);   // в повторении исправил — снимаем\n  }\n  st.last = segodnya();\n  saveStore();\n}\nfunction snyatOshibku(){                    // ученик доказал, что его вариант тоже верный\n  const u = uchenik(); if(!u || !setKey) return;\n  const st = u.errors[setKey + \"-\" + (revising ? reviseIdx : blockIdx)];\n  if(st && st.wrong > 0){\n    st.wrong--;\n    const q = items[idx] && items[idx].q;\n    if(st.miss && q) st.miss = st.miss.filter(x => x !== q);\n    saveStore();\n  }\n}\n\n/* Повторение: перед новой темой возвращаемся к предыдущей на три задания —\n   только новые предложения из REVISE, которых не было в упражнении (так решила Юля 20.10).\n   Ответы в повторении не идут в итог раздела. */\nconst REVISE_COUNT = 3;\nconst REVISE = {};\nlet revising = false, reviseIdx = 0;\nconst curBlock = () => SETS[setKey].blocks[revising ? reviseIdx : blockIdx];\nconst countAnswer = () => { if(!revising) totalAnswered++; };\nconst noteMiss = w => { if(!revising) missed.push({word:w, group:curBlock().name}); };\n\nconst plain = w => w.replace(/[\\[\\]]/g,\"\");\nconst marked = w => w.replace(/\\[(.+?)\\]/,\"<em>$1<\/em>\");\nconst isGram = () => SETS[setKey].kind===\"gram\";\nconst rightOf = it => isGram() ? it.a : it.ipa;\nconst spoken  = it => isGram()\n  ? (it.a2 ? it.q.replace(\"___\", it.a).replace(\"___\", it.a2) : (it.q.includes(\"___\") ? it.q.replace(\"___\", it.a===\"-\" ? \"\" : it.a) : it.a))\n  : plain(it.word);\n/* задания на выбор слова: варианты по алфавиту, чтобы порядок не выдавал ответ */\nconst choiceOf = it => (it.hint || it.q.trim().endsWith(\")\")) ? \"\" :\n  [it.a, ...it.wrong].map(x => x===\"-\" ? \"—\" : x)\n    .sort((x,y) => x.localeCompare(y, \"en\", {sensitivity:\"base\"})).join(\" / \");\n\n/* --- проверка того, что ученик вписал руками ---\n   Сокращения разворачиваются, чтобы don't и do not считались одним ответом.\n   Порядок замен важен: won't и can't разбираются до общего n't. */\nconst CONTRACTIONS = [\n  [/won't/g, \"will not\"], [/can't/g, \"can not\"], [/cannot/g, \"can not\"],\n  [/shan't/g, \"shall not\"], [/n't/g, \" not\"],\n  [/'re/g, \" are\"], [/'ve/g, \" have\"], [/'ll/g, \" will\"], [/'m/g, \" am\"]\n];\nfunction canon(s){\n  s = (s||\"\").toLowerCase().trim()\n    .replace(/[’‘`´]/g, \"'\")   // кривые апострофы к прямому\n    .replace(/[—–]/g, \"-\")          // тире к дефису\n    .replace(/[.!?,;]+$/, \"\")\n    .replace(/\\s+/g, \" \");\n  CONTRACTIONS.forEach(([re, to]) => { s = s.replace(re, to); });\n  return s.replace(/\\s+/g, \" \").trim();\n}\n/* раздел ЕГЭ: краткую форму (doesn't) не засчитываем, если в ответе полная — так в образце ФИПИ: DO NOT KNOW */\nconst shortForm = (it, typed) => !!(SETS[setKey] && SETS[setKey].fullForm) && /n['’‘`´]t\\b/i.test(typed) && !/n't\\b/i.test(it.a);\nfunction isRight(it, typed){\n  if(shortForm(it, typed)) return false;\n  const t = canon(typed);\n  return [it.a, ...(it.alt||[])].some(a => canon(a) === t || noComma(a) === noComma(typed));\n}\n/* запятые: ответ засчитываем, но показываем, где запятая нужна по правилам */\nconst noComma = s => canon(s).replace(/\\s*,\\s*/g, \" \").replace(/\\s+/g, \" \").trim();\nconst commaOff = (it, typed) => ![it.a, ...(it.alt||[])].some(a => canon(a) === canon(typed));\n/* расстояние редактирования — чтобы отличить опечатку от незнания */\nfunction dist(a,b){\n  const m=a.length, n=b.length;\n  const d=Array.from({length:m+1},(_,i)=>{const r=Array(n+1).fill(0); r[0]=i; return r;});\n  for(let j=0;j<=n;j++) d[0][j]=j;\n  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)\n    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));\n  return d[m][n];\n}\nfunction shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}\nconst show = id => [\"users\",\"podpiska\",\"report\",\"menu\",\"blocks\",\"ruleScreen\",\"card\",\"done\",\"reader\"].forEach(s => $(\"#\"+s).classList.toggle(\"hidden\", s!==id));\n\n/* ---- кто занимается ---- */\nfunction pokazatUchenikov(){\n  const box = $(\"#userList\"); box.innerHTML = \"\";\n  const imena = Object.keys(store.users);\n  imena.forEach(name => {\n    const u = store.users[name];\n    const sdelano = Object.keys(u.passed || {}).length;\n    const row = document.createElement(\"div\"); row.className = \"user-row\";\n    const btn = document.createElement(\"button\"); btn.className = \"menu-item\";\n    btn.style.flex = \"1\";\n    btn.innerHTML = \"<b>\" + name + \"<\/b><span>\" +\n      (sdelano ? \"пройдено тем: \" + sdelano : \"ещё не начинал\") +\n      (name === store.active ? \" · сейчас выбран\" : \"\") + \"<\/span>\";\n    btn.onclick = () => { vybrat(name); pokazatPosleVhoda(); };\n    const del = document.createElement(\"button\"); del.className = \"link\"; del.textContent = \"удалить\";\n    del.onclick = () => {\n      if(!confirm(\"Удалить профиль «\" + name + \"» вместе с его прогрессом?\")) return;\n      delete store.users[name];\n      if(store.active === name){ store.active = null; passed = {}; }\n      saveStore(); pokazatUchenikov();\n    };\n    row.appendChild(btn); row.appendChild(del);\n    box.appendChild(row);\n  });\n  $(\"#newName\").value = \"\";\n  show(\"users\");\n}\n\nfunction dobavitUchenika(){\n  const name = $(\"#newName\").value.trim();\n  if(!name) return;\n  cel(\"nachal\");\n  vybrat(name); pokazatPosleVhoda();\n}\n\n/* ---- работа над ошибками ----\n   Берём темы, где ученик ошибался, и собираем из них общий набор: из самых слабых —\n   больше заданий. Темы перемешаны, подсказки «это такое-то правило» нет. */\nlet trening = false;\nlet mix = [];                       // [{k: раздел, bi: номер темы, it: задание}]\nconst MIX_SIZE = 12;\n\nfunction slabyeTemy(){\n  const u = uchenik(); if(!u) return [];\n  return Object.keys(u.errors || {})\n    .map(key => {\n      const e = u.errors[key];\n      const bi = Number(key.slice(String(e.set).length + 1));\n      return {k:e.set, bi:bi, e:e, dolya: e.total ? e.wrong / e.total : 0};\n    })\n    .filter(t => t.e.wrong > 0 && SETS[t.k] && SETS[t.k].blocks[t.bi] &&\n                 SETS[t.k].blocks[t.bi].drill && SETS[t.k].blocks[t.bi].drill.length)\n    .sort((a, b) => b.dolya - a.dolya || b.e.wrong - a.e.wrong);\n}\n\nfunction sobratSlaboe(){\n  const temy = slabyeTemy();\n  if(!temy.length) return [];\n  const zapas = temy.map(t => shuffle(SETS[t.k].blocks[t.bi].drill));\n  const out = [];\n  let i = 0, pusto = 0;\n  while(out.length < MIX_SIZE && pusto < temy.length){\n    const n = i % temy.length;\n    if(zapas[n].length){\n      out.push({k:temy[n].k, bi:temy[n].bi, it:zapas[n].pop()});\n      pusto = 0;\n    }else{\n      pusto++;\n    }\n    i++;\n  }\n  return shuffle(out);\n}\n\nfunction startTrening(){\n  stopSpeech();\n  mix = sobratSlaboe();\n  if(!mix.length) return;\n  trening = true; revising = false;\n  missed = []; totalAnswered = 0;\n  items = mix.map(m => m.it);\n  idx = 0;\n  render();\n  show(\"card\");\n}\n\n/* ---- отчёт для репетитора ---- */\nfunction sobratOtchet(){\n  const u = uchenik();\n  if(!u) return \"Ученик не выбран.\";\n  let temVsego = 0, temSdelano = 0;\n  const razdely = [];\n  Object.keys(SETS).forEach(k => {\n    const s = SETS[k];\n    let n = 0;\n    s.blocks.forEach((_, i) => { if(u.passed[k+\"-\"+i]) n++; });\n    temVsego += s.blocks.length;\n    temSdelano += n;\n    if(n) razdely.push(\"• \" + s.title + \": \" + n + \" из \" + s.blocks.length);\n  });\n  const temy = Object.values(u.errors || {}).filter(e => e.total);\n  const zadaniy = temy.reduce((s, e) => s + e.total, 0);\n  const oshibok = temy.reduce((s, e) => s + e.wrong, 0);\n  const slabye = temy.filter(e => e.wrong)\n    .sort((a, b) => (b.wrong / b.total) - (a.wrong / a.total) || b.wrong - a.wrong)\n    .slice(0, 10);\n\n  const L = [];\n  L.push(\"Тренажёр английского — отчёт\");\n  L.push(\"Ученик: \" + store.active);\n  L.push(\"Дата: \" + segodnya());\n  L.push(\"\");\n  L.push(\"Пройдено тем: \" + temSdelano + \" из \" + temVsego);\n  L.push(\"Выполнено заданий: \" + zadaniy + \", из них с ошибкой: \" + oshibok +\n         (zadaniy ? \" (\" + Math.round(oshibok / zadaniy * 100) + \"%)\" : \"\"));\n  L.push(\"\");\n  if(slabye.length){\n    L.push(\"Где чаще всего ошибается:\");\n    slabye.forEach(e => L.push(\"• \" + e.setTitle + \" → \" + e.name + \": \" +\n      e.wrong + \" из \" + e.total + \", последний раз \" + (e.last || \"—\")));\n  }else{\n    L.push(\"Ошибок пока не записано.\");\n  }\n  L.push(\"\");\n  if(razdely.length){\n    L.push(\"Что пройдено по разделам:\");\n    razdely.forEach(r => L.push(r));\n  }else{\n    L.push(\"Ни одна тема ещё не закрыта до конца.\");\n  }\n  return L.join(\"\\n\");\n}\n\nfunction pokazatOtchet(){\n  $(\"#reportName\").textContent = \"Отчёт: \" + store.active;\n  $(\"#reportText\").value = sobratOtchet();\n  show(\"report\");\n}\n\n/* Раздел → список правил. Видно все, можно зайти в любое. */\n// В открытой версии выделяем доступные бесплатно темы грамматики.\n// При полном доступе все темы показываются обычным списком.\nfunction estProbnayaGrammatika(){\n  const s = SETS.egegram;\n  return !!(s && !s.zakryto && s.blocks.some(b => !b.zakryto && b.drill.length) &&\n    s.blocks.some(b => b.zakryto));\n}\n\nfunction startSet(key){\n  stopSpeech();\n  trening = false;\n  setKey=key; missed=[]; totalAnswered=0;\n  const set=SETS[key];\n  $(\"#crumbSet\").textContent = \"Раздел\";\n  $(\"#setTitle\").textContent = set.title;\n  const list=$(\"#blockList\"); list.innerHTML=\"\";\n  if(set.kind===\"text\"){                          // список текстов для чтения вслух\n    $(\"#setSub\").textContent = \"Текстов: \" + set.blocks.length + \". Читай вслух сам, потом слушай и сравнивай.\";\n    set.blocks.forEach((t,i) => {\n      const btn=document.createElement(\"button\"); btn.className=\"menu-item\";\n      const done = passed[key+\"-\"+i] ? \" · прочитано\" : \"\";\n      btn.innerHTML = \"<b>\" + (i+1) + \". \" + t.name + \"<\/b><span>\" + t.rule + \" · \" +\n        plural(wordCount(t.text), \"слово\", \"слова\", \"слов\") + done + \"<\/span>\";\n      btn.onclick = () => showText(i);\n      list.appendChild(btn);\n    });\n    show(\"blocks\");\n    return;\n  }\n  $(\"#setSub\").textContent = \"Правил в разделе: \" + set.blocks.length + \". Каждое — объяснение и отработка.\";\n  set.blocks.forEach((b,i) => {\n    const btn=document.createElement(\"button\");\n    const probnaya = key === \"egegram\" && !b.zakryto && estProbnayaGrammatika();\n    btn.className=\"menu-item\" + (b.zakryto ? \" zakryto\" : \"\") + (probnaya ? \" probnaya\" : \"\");\n    const done = passed[key+\"-\"+i] ? \" · пройдено\" : \"\";\n    btn.innerHTML = \"<b>\" + ((b.zakryto ? \"🔒 \" : \"\") + (i+1) + \". \" + b.name) + \"<\/b><span>\" +\n      (probnaya ? \"Бесплатно · \" : \"\") + plural(b.zakryto ? b.n : b.drill.length, \"упражнение\", \"упражнения\", \"упражнений\") + done +\n      (b.zakryto ? ' · <span class=\"zamok\">по подписке<\/span>' : \"\") + \"<\/span>\";\n    btn.onclick = () => b.zakryto ? pokazatPodpisku() : openBlock(i);\n    list.appendChild(btn);\n  });\n  show(\"blocks\");\n}\n\n/* Вход в тему: сначала короткое повторение прошлой, потом правило новой.\n   В первой теме раздела повторять нечего — идём сразу к правилу. */\nfunction openBlock(i){\n  cel(\"tema\");\n  blockIdx = i;\n  const prev = i > 0 ? SETS[setKey].blocks[i-1] : null;\n  const novye = prev ? (REVISE[setKey + \"|\" + prev.name] || []) : [];   // свои предложения для повторения\n  const povtor = shuffle(novye).slice(0, REVISE_COUNT);   // ошибки из упражнения сюда не берём — они в «Работе над ошибками»\n  if(povtor.length){\n    revising = true; reviseIdx = i-1;\n    items = povtor;\n    idx = 0;\n    render();\n    show(\"card\");\n    return;\n  }\n  revising = false;\n  showRule();\n}\n\nfunction showRule(){\n  const set=SETS[setKey], b=set.blocks[blockIdx];\n  $(\"#crumb1\").textContent = set.title + \" · правило \" + (blockIdx+1) + \" из \" + set.blocks.length;\n  $(\"#ruleName\").textContent = b.name;\n  $(\"#explain\").innerHTML = b.explain.map(p => \"<p>\"+p+\"<\/p>\").join(\"\");\n  const list=$(\"#exList\"); list.innerHTML=\"\";\n  b.examples.forEach(e => {\n    const row=document.createElement(\"div\"); row.className=\"ex-row\";\n    if(set.kind===\"gram\"){\n      row.className=\"ex-row gram\";\n      row.innerHTML = '<span class=\"g-txt\"><span class=\"g-en\">'+e.w+'<\/span><span class=\"ru\">'+e.ru+'<\/span><\/span>';\n    }else{\n      row.innerHTML = '<span class=\"w\">'+marked(e.w)+'<\/span><span class=\"ipa\">'+e.ipa+'<\/span><span class=\"ru\">'+e.ru+'<\/span>';\n    }\n    const btn=document.createElement(\"button\"); btn.className=\"play\"; btn.textContent=\"звук\";\n    btn.onclick = () => say(plain(e.w));\n    row.appendChild(btn); list.appendChild(row);\n  });\n  show(\"ruleScreen\");\n}\n\nfunction startDrill(){\n  revising = false;\n  items = shuffle(SETS[setKey].blocks[blockIdx].drill);\n  idx = 0; render();\n  show(\"card\");\n}\n\nfunction render(){\n  answered=false;\n  if(trening && mix[idx]){ setKey = mix[idx].k; blockIdx = mix[idx].bi; }   // у каждого задания своя тема\n  const set=SETS[setKey], b=curBlock(), it=items[idx];\n  $(\"#crumb2\").textContent = (trening ? \"Работа над ошибками · \" : revising ? \"Повторение · \" : \"\") +\n    b.name + \" · \" + (idx+1) + \" из \" + items.length;\n  $(\"#prog\").style.width = (idx/items.length*100)+\"%\";\n  const gram = set.kind===\"gram\";\n  const w=$(\"#word\");\n  w.classList.toggle(\"sent\", gram);\n  const two = gram && !!it.a2;                    // вопрос: вспомогательный глагол и смысловой\n  w.innerHTML = gram                              // исходное слово справа, как в заданиях ЕГЭ\n    ? (revising ? \"<span class='povtor'>Повторение прошлой темы: <b>\" + b.name + \"<\/b><br>Потом откроется правило «\"\n                  + SETS[setKey].blocks[blockIdx].name + \"»<\/span>\" : \"\")   // чтобы повторение не приняли за сбой\n      + (it.title ? \"<span class='fipi-t'>\" + it.title + \"<\/span>\" : \"\")   // формат ФИПИ: заголовок текста\n      + (it.ctx ? \"<span class='fipi-ctx'>\" + it.ctx + \"<\/span>\" : \"\")   // и предыдущие строки текста\n      + (two ? it.q.replace(\"___\", \"<input class='gap' id='g1' type='text' autocomplete='off' autocapitalize='off' spellcheck='false'>\").replace(\"___\", \"<input class='gap' id='g2' type='text' autocomplete='off' autocapitalize='off' spellcheck='false'>\")\n           : it.q.replace(\"___\",\"<em>___<\/em>\"))\n      + (it.hint ? \" <span class='base'>\" + it.hint.toUpperCase() + \"<\/span>\" : \"\")\n      + (choiceOf(it) ? \" <span class='base choice'>\" + choiceOf(it) + \"<\/span>\" : \"\")\n    : marked(it.word);\n  $(\"#ask\").textContent = gram\n    ? (two ? \"Заполни оба пропуска: вспомогательный глагол и слово справа в нужной форме\"\n           : b.ask || (it.hint ? \"Поставь слово справа в нужную форму\" : choiceOf(it) ? \"Впиши одно из слов справа\" : \"Впиши подходя from(atob(VOICE_RECORDINGS.key), c=>c.charCodeAt(0));\n    audioKeyPromise=crypto.subtle.importKey(\"raw\", bytes, \"AES-GCM\", false, [\"decrypt\"]);\n  }\n  return audioKeyPromise;\n}\nasync function say(text, wholeText=false){\n  stopSpeech();\n  const my=speechId;\n  const notice=document.getElementById(\"voiceNotice\");\n  notice.classList.add(\"hidden\");\n  try{\n    if(!audioContext) audioContext=new AudioContext();\n    const resumed=audioContext.resume(); // Called in the click handler, before the first await.\n    if(wholeText) $(\"#tListen\").textContent=\"Остановить\";\n    await resumed;\n    if(my!==speechId) return;\n    const phrase=normalizeVoiceText(text);\n    const clips=VOICE_RECORDINGS?.clips;\n    if(!clips || !Object.hasOwn(clips, phrase)) throw new Error(\"Recording unavailable\");\n    const clip=clips[phrase];\n    audioFetch=new AbortController();\n    const response=await fetch(\"audio/\"+clip[0]+(clip[1]?\".bin\":\".mp3\")+\n      \"?v=\"+encodeURIComponent(VOICE_RECORDINGS.version),\n      {signal:audioFetch.signal, cache:clip[1]?\"no-store\":\"default\"});\n    if(my!==speechId) return;\n    if(!response.ok) throw new Error(\"Audio HTTP \"+response.status);\n    let bytes=await response.arrayBuffer();\n    if(my!==speechId) return;\n    if(clip[1]){\n      const key=await recordingKey();\n      if(my!==speechId) return;\n      bytes=await crypto.subtle.decrypt({name:\"AES-GCM\", iv:bytes.slice(0,12)}, key, bytes.slice(12));\n      if(my!==speechId) return;\n    }\n    const buffer=await audioContext.decodeAudioData(bytes);\n    if(my!==speechId) return;\n    audioFetch=null;\n    const source=audioContext.createBufferSource();\n    source.buffer=buffer;\n    source.connect(audioContext.destination);\n    source.onended=()=>{\n      source.disconnect();\n      if(my!==speechId) return;\n      audioSource=null;\n      $(\"#tListen\").textContent=\"Послушать\";\n    };\n    audioSource=source;\n    source.start();\n  }catch(error){\n    if(my!==speechId) return;\n    stopSpeech();\n    notice.textContent=\"Не удалось загрузить озвучку. Попробуйте ещё раз.\";\n    notice.classList.remove(\"hidden\");\n  }\n}\n\n/* ---------------- ТЕКСТЫ ДЛЯ ЧТЕНИЯ ВСЛУХ ---------------- */\nlet textIdx=0, speechId=0;\nconst markAll = w => w.replace(/\\[(.+?)\\]/g, \"<em>$1<\/em>\");\nconst NUM_RE = /\\{([^|}]+)\\|([^}]+)\\}/g;              // число в тексте: {как написано|как читается}\nconst wordCount = t => plain(t.replace(NUM_RE, \"$1\")).split(/\\s+/).filter(Boolean).length;\nconst spokenText = t => plain(t.replace(NUM_RE, \"$2\"));\nconst plural = (n, one, few, many) => {\n  const a=n%10, b=n%100;\n  return n + \" \" + (a===1 && b!==11 ? one : (a>=2 && a<=4 && (b<10 || b>=20) ? few : many));\n};\n\nfunction stopSpeech(){\n  speechId++;\n  if(audioFetch){ audioFetch.abort(); audioFetch=null; }\n  if(audioSource){\n    audioSource.onended=null;\n    audioSource.stop(); audioSource.disconnect(); audioSource=null;\n  }\n  const b=$(\"#tListen\"); if(b) b.textContent=\"Послушать\";\n}\n\nfunction showText(i){\n  const set=SETS[setKey], t=set.blocks[i];\n  stopSpeech(); textIdx=i;\n  $(\"#crumbT\").textContent = set.title + \" · \" + (i+1) + \" из \" + set.blocks.length;\n  $(\"#tTitle\").textContent = t.name;\n  $(\"#tRule\").innerHTML = \"<b>\" + t.rule + \".<\/b> \" + markAll(t.tip);\n  const body=$(\"#tBody\"); body.innerHTML=\"\"; body.classList.remove(\"marked\");\n  const nums=[];                                  // числа текста: [как написано, как читается]\n  const src=t.text.replace(NUM_RE, (m, shown, said) => \"\u0001\" + (nums.push([shown, said])-1) + \"\u0001\");\n  src.split(/\\s+/).forEach((tok, k, arr) => {\n    const sp=document.createElement(\"span\"); sp.className=\"tw\";\n    let w;\n    const nm=tok.match(/\u0001(\\d+)\u0001/);\n    if(nm){                                       // число: на экране цифры, чтение — по кнопке\n      const [shown, said]=nums[+nm[1]];\n      const [pre, post]=tok.split(nm[0]);\n      sp.innerHTML = pre + \"<span class='n'>\" + shown + \"<\/span><span class='rd'>\" + said + \"<\/span>\" + post;\n      w = said;\n    }else{\n      sp.innerHTML=markAll(tok);\n      w=plain(tok).replace(/^[^\\p{L}]+|[^\\p{L}]+$/gu, \"\");   // слово без кавычек и точек\n    }\n    if(w) sp.onclick = () => {\n      stopSpeech(); say(w);\n      sp.classList.add(\"on\"); setTimeout(() => sp.classList.remove(\"on\"), 900);\n    };\n    body.appendChild(sp);\n    if(k<arr.length-1) body.appendChild(document.createTextNode(\" \"));\n  });\n  $(\"#tMark\").textContent = t.text.includes(\"|\") ? \"Как читать числа\" : \"Показать правило\";\n  $(\"#tRu\").textContent=t.ru; $(\"#tRu\").classList.add(\"hidden\");\n  $(\"#tTrans\").textContent=\"Перевод\";\n  $(\"#tNext\").textContent = i<set.blocks.length-1 ? \"Следующий текст\" : \"К списку текстов\";\n  show(\"reader\"); window.scrollTo(0,0);\n}\n\n/* Рассказ звучит одной готовой записью. */\nfunction listenText(){\n  if($(\"#tListen\").textContent===\"Остановить\"){ stopSpeech(); return; }\n  return say(spokenText(SETS[setKey].blocks[textIdx].text), true);\n}\n\n$(\"#tListen\").onclick = listenText;\n$(\"#tMark\").onclick = () => {\n  const on=$(\"#tBody\").classList.toggle(\"marked\");\n  const nums=SETS[setKey].blocks[textIdx].text.includes(\"|\");\n  $(\"#tMark\").textContent = on ? (nums ? \"Скрыть чтение\" : \"Скрыть правило\")\n                               : (nums ? \"Как читать числа\" : \"Показать правило\");\n};\n$(\"#tTrans\").onclick = () => {\n  const hid=$(\"#tRu\").classList.toggle(\"hidden\");\n  $(\"#tTrans\").textContent = hid ? \"Перевод\" : \"Скрыть перевод\";\n};\n$(\"#tNext\").onclick = () => {\n  passed[setKey+\"-\"+textIdx] = true;            // текст прочитан\n  saveProgress();\n  if(textIdx < SETS[setKey].blocks.length-1) showText(textIdx+1); else startSet(setKey);\n};\n$(\"#tBack\").onclick = () => startSet(setKey);\n\n$(\"#say\").onclick = () => say(spoken(items[idx]));\n$(\"# buildMenu(); show(\"menu\"); return; }\n  startSet(setKey);\n};\n\n/* Меню собирается из SETS: звуки, тексты для чтения, грамматика */\nconst MENU = [\n  [\"Чтение и звуки\", [\"types\",\"diph\",\"cons\",\"ege\",\"endings\",\"texts\"]],\n  [\"Школьная программа\", [\"past\"]],\n  [\"Грамматика — по кодификатору ЕГЭ\", [\"sep\",\"oct\",\"nov\",\"dec\",\"jan\",\"feb\",\"mar\",\"apr\",\"kodif\",\"egegram\",\"slovo\"]]\n];\nfunction buildMenu(){\n  const box=$(\"#menuList\"); box.innerHTML=\"\";\n  if(store.active){                      // кто занимается и куда нажать, чтобы сменить\n    const bar=document.createElement(\"div\"); bar.className=\"userbar\";\n    const kto=document.createElement(\"span\");\n    kto.innerHTML = \"Занимается: <b>\" + store.active + \"<\/b>\";\n    const sm=document.createElement(\"button\"); sm.className=\"link\"; sm.textContent=\"сменить ученика\";\n    sm.onclick = pokazatUchenikov;\n    const ot=document.createElement(\"button\"); ot.className=\"link\"; ot.textContent=\"отчёт для репетитора\";\n    ot.onclick = pokazatOtchet;\n    bar.appendChild(kto); bar.appendChild(sm); bar.appendChild(ot);\n    box.appendChild(bar);\n\n    const temy = slabyeTemy();\n    const oshibok = temy.reduce((s, t) => s + t.e.wrong, 0);\n    if(temy.length){                   // пока ошибок нет, повторять нечего\n      const sl = document.createElement(\"button\");\n      sl.className = \"menu-item slaboe\";\n      sl.innerHTML = \"<b>Повторить слабое<\/b><span>Задания из тем, где чаще всего ошибки · \" +\n        plural(temy.length, \"тема\", \"темы\", \"тем\") + \", \" +\n        plural(oshibok, \"ошибка\", \"ошибки\", \"ошибок\") + \"<\/span>\";\n      sl.onclick = startTrening;\n      box.appendChild(sl);\n    }\n  }\n  MENU.forEach(([label, keys]) => {\n    const shown = keys.filter(k => SETS[k]);\n    if(!shown.length) return;\n    const h=document.createElement(\"div\"); h.className=\"menu-group\"; h.textContent=label;\n    box.appendChild(h);\n    if(shown.includes(\"egegram\") && estProbnayaGrammatika()){\n      const start = document.createElement(\"button\");\n      start.className = \"menu-item probnaya\";\n      start.innerHTML = \"<b>Попробовать грамматику бесплатно<\/b><span>Множественное число, местоимения и степени сравнения. Правила и упражнения с разбором ошибок.<\/span>\";\n      start.onclick = () => startSet(\"egegram\");\n      box.appendChild(start);\n    }\n    shown.forEach(k => {\n      const s=SETS[k];\n      const count = s.kind===\"text\"\n        ? plural(s.blocks.length, \"текст\", \"текста\", \"текстов\")\n        : plural(s.blocks.reduce((sum,b)=>sum+(b.zakryto ? b.n : b.drill.length),0), \"упражнение\", \"упражнения\", \"упражнений\");\n      const doneN = s.blocks.filter((_, i) => passed[k+\"-\"+i]).length;   // сколько тем закрыто\n      const doneTxt = doneN\n        ? ' · <span class=\"done\">' + (s.kind===\"text\" ? \"прочитано \" : \"пройдено \") + doneN + \" из \" + s.blocks.length + \"<\/span>\"\n        : \"\";\n      const btn=document.createElement(\"button\"); btn.className=\"menu-item\" + (s.zakryto ? \" zakryto\" : \"\");\n      btn.innerHTML=\"<b>\"+(s.zakryto ? \"🔒 \" : \"\")+s.title+\"<\/b><span>\"+(s.sub||\"\")+\" · \"+count+doneTxt+\n        (s.zakryto ? ' · <span class=\"zamok\">по подписке<\/span>' : \"\")+\"<\/span>\";\n      btn.onclick=()=> s.zakryto ? pokazatPodpisku() : startSet(k);\n      box.appendChild(btn);\n    });\n  });\n  if(Object.keys(passed).length){            // сбрасывать нечего, пока ничего не пройдено\n    const reset=document.createElement(\"button\");\n    reset.className=\"menu-reset\";\n    reset.textContent=\"Начать сначала — убрать отметки о пройденном\";\n    reset.onclick=()=>{\n      if(!confirm(\"Отметки о пройденном будут стёрты. Сами упражнения останутся.\")) return;\n      Object.keys(passed).forEach(key => delete passed[key]);\n      saveProgress();\n      buildMenu();\n    };\n    box.appendChild(reset);\n  }\n}\n/* Открытая версия сайта: платные темы без заданий, вместо них экран подписки.\n   В полной версии (по личной ссылке) закрытых тем нет, и этот экран не показывается. */\nconst KONTAKT = {tg:\"https://t.me/Julia_2624\", max:\"https://max.ru/u/f9LHodD0cOIni4VD9GPPebr2TL49Ddd1BnD9yRRjR-DYDKCC7k2M3nYzqPA\"};\nlet podpiskaOtkuda = \"menu\";\nfunction pokazatPodpisku(){\n  stopSpeech();\n  podpiskaOtkuda = $(\"#blocks\").classList.contains(\"hidden\") ? \"menu\" : \"blocks\";\n  $(\"#podpiskaBack\").textContent = podpiskaOtkuda === \"menu\" ? \"К разделам\" : \"К списку тем\";\n  $(\"#kontaktTg\").href = KONTAKT.tg;\n  $(\"#kontaktMax\").href = KONTAKT.max;\n  cel(\"podpiska\");\n  show(\"podpiska\");\n}\n$(\"#podpiskaBack\").onclick = () => { if(podpiskaOtkuda === \"menu\") buildMenu(); show(podpiskaOtkuda); };\n$(\"#kontaktTg\").onclick = () => cel(\"napisat\");\n$(\"#kontaktMax\").onclick = () => cel(\"napisat\");\n$(\"#kodOtkryt\").onclick = () => {\n  const kod = ($(\"#kodVvod\").value || \"\").toLowerCase().replace(/[^a-z0-9]/g, \"\");\n  if(!kod) return;\n  try{ localStorage.setItem(\"trenazher-dostup\", kod); }catch(e){}\n  location.reload();\n};\n$(\"#addUser\").onclick = dobavitUchenika;\n$(\"#newName\").onkeydown = e => { if(e.key === \"Enter\") dobavitUchenika(); };\n$(\"#reportBack\").onclick = () => { buildMenu(); show(\"menu\"); };\n$(\"#copyReport\").onclick = () => {\n  const ta = $(\"#reportText\");\n  ta.removeAttribute(\"readonly\"); ta.select(); ta.setSelectionRange(0, 99999);\n  let got = false;\n  try { got = document.execCommand(\"copy\"); } catch(e){}\n  if(navigator.clipboard && !got){\n    navigator.clipboard.writeText(ta.value).then(()=>{ $(\"#copyReport\").textContent = \"Скопировано\"; }).catch(()=>{});\n  }\n  ta.setAttribute(\"readonly\", \"readonly\");\n  $(\"#copyReport\").textContent = got ? \"Скопировано\" : \"Выделено — нажми Ctrl+C\";\n  setTimeout(()=>{ $(\"#copyReport\").textContent = \"Скопировать\"; }, 2500);\n};\n\n// Ссылка с учебной страницы открывает тему после выбора ученика.\n// Фрагмент #код остаётся только для существующих личных ссылок доступа.\nlet temaPoSsylke = new URLSearchParams(location.search).get(\"tema\");\nfunction pokazatPosleVhoda(){\n  buildMenu(); show(\"menu\");\n  if(!temaPoSsylke) return;\n  const match = /^([a-z][a-z0-9_]*)-(\\d+)$/.exec(temaPoSsylke);\n  temaPoSsylke = null;\n  if(!match) return;\n  const key = match[1], index = Number(match[2]);\n  if(!Object.prototype.hasOwnProperty.call(SETS, key)) return;\n  const set = SETS[key], block = set.blocks[index];\n  if(!block || set.kind === \"text\") return;\n  if(set.zakryto){ pokazatPodpisku(); return; }\n  startSet(key);\n  if(block.zakryto) pokazatPodpisku(); else openBlock(index);\n}\n\nif(store.active && store.users[store.active]){\n  vybrat(store.active);\n  pokazatPosleVhoda();\n}else{\n  pokazatUchenikov();                 // первый вход: сначала спрашиваем, кто занимается\n}\n<\/script>\n<\/body>\n<\/html>\n";

  try{
    const P = await (await fetch("polny.txt?" + D.sb, {cache:"no-store"})).json();
    const base = await crypto.subtle.importKey("raw", enc.encode(kod), "PBKDF2", false, ["deriveKey"]);
    const kk = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(v[0]), iterations:D.it, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const syroy = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(v[1])}, kk, b(v[2]));
    const kluch = await crypto.subtle.importKey("raw", syroy, "AES-GCM", false, ["decrypt"]);
    let html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.iv)}, kluch, b(P.s)));
    // метка ученика в Метрике: одна ссылка на многих устройствах = ссылку передали
    const m = hex(await sha("metka:" + kod), 4);
    return html.replace("</body>", "<script>try{ym(" + D.m + ",'userParams',{dostup:'" + m + "'})}catch(e){}<\/script></body>");
  }catch(e){ return null; }
}

// document.write заменяет страницу, только когда браузер её дочитал, иначе дописывает снизу — ждём DOMContentLoaded
async function start(){
  let kod = chist(decodeURIComponent(location.hash.slice(1)));
  let izPamyati = false;
  if(!kod){ try{ kod = chist(localStorage.getItem(LS)); izPamyati = true; }catch(e){} }
  if(kod){
    const html = await polnaya(kod);
    if(html){
      try{ localStorage.setItem(LS, kod); }catch(e){}
      if(location.hash) history.replaceState(null, "", location.pathname + location.search);
      return napisat(html);
    }
    try{ localStorage.removeItem(LS); }catch(e){}
    if(location.hash) history.replaceState(null, "", location.pathname + location.search);
    const t = izPamyati ? "Ваша ссылка больше не открывает полный тренажёр, возможно, закончилась подписка. Открыта бесплатная часть."
                        : "Код не подходит, проверьте ссылку. Открыта бесплатная часть.";
    return napisat(OTKRYTO.replace("<body>", "<body><div onclick=\"this.remove()\" style=\"background:#8c3b2f;color:#fff;" +
      "padding:12px 16px;font:15px/1.4 system-ui,sans-serif;cursor:pointer\">" + t + " ✕</div>"));
  }
  napisat(OTKRYTO);
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
