bT\"><\/div>\n    <h2 class=\"rule-name\" id=\"tTitle\"><\/h2>\n    <p class=\"t-rule\" id=\"tRule\"><\/p>\n    <p class=\"quiet\">Сначала прочитай вслух сам. Потом нажми «Послушать» и сравни. Если сомневаешься в слове — нажми на него, оно прозвучит отдельно.<\/p>\n    <div class=\"t-body\" id=\"tBody\"><\/div>\n    <p class=\"t-ru hidden\" id=\"tRu\"><\/p>\n    <div class=\"row\">\n      <button class=\"btn main\" id=\"tListen\">Послушать<\/button>\n      <button class=\"btn\" id=\"tMark\">Показать правило<\/button>\n    <\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"tTrans\">Перевод<\/button>\n      <button class=\"btn\" id=\"tNext\">Следующий текст<\/button>\n    <\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"tBack\">К списку текстов<\/button>\n    <\/div>\n  <\/section>\n\n  <footer>Звуки — по перечню ФИПИ. Грамматика — по кодификатору ЕГЭ ФИПИ.<\/footer>\n<\/div>\n\n<script>\n/* ============================================================\n   СТРУКТУРА: раздел → блоки. Блок = ПРАВИЛО + отработка.\n   Сначала объяснение, потом упражнения на него.\n   ============================================================\n   В explain: <span class=\"key\">…<\/span> подсвечивает главное.\n   В словах квадратные скобки выделяют нужную часть: c[u]p\n   ru — опора на русский звук (как объясняет Юля)\n*/\n/* Звуки: wrong — [звук, пример, почему этот вариант неверный]; why — почему верен правильный звук.\n   При ошибке подсказка = заметка к выбранному варианту + why. */\nconst SETS = {\"types\":{\"kind\":\"phon\",\"title\":\"Четыре типа чтения\",\"sub\":\"Открытый слог, закрытый, гласная + r + согласная, гласная + r + гласная\",\"blocks\":[{\"name\":\"Закрытый слог\",\"explain\":[\"<span class='h'>Что это<\/span>Закрытый слог <span class='key'>заканчивается на согласную<\/span>: после гласной стоит согласная, и слог на ней обрывается. cat, pen, big, box, cup — всё это закрытые слоги.\",\"<span class='h'>Как читается<\/span>Гласная звучит <span class='key'>кратко<\/span>, не так, как она называется в алфавите: a — [æ] как в cat, e — [e] как в pen, i — [ɪ] как в big, o — [ɒ] как в box, u — [ʌ] как в cup, y — [ɪ] как в gym: y читается так же, как i.\",\"<span class='h'>Как звучат по-русски<\/span>[æ] — между «а» и «э», рот открыт шире, чем для «э». [e] — почти «э». [ɪ] — между «и» и «ы». [ɒ] — короткое открытое «о». [ʌ] — короткое «а».\",\"<span class='h'>Как узнать на письме<\/span>После гласной одна или несколько согласных, и в конце нет немой e: hat, but, stop, lamp. Удвоенная согласная тоже держит слог закрытым: apple, happy, dinner.\",\"<span class='h'>Ловушка<\/span>Стоит добавить к слову немую e, и слог становится открытым, а звук меняется: hat — hate, pin — pine, hop — hope. Всегда смотри, есть ли e на конце.\",\"<span class='h'>Как тренировать<\/span>Читай пары подряд: cap — cape, kit — kite, not — note, cut — cute. Первое слово — закрытый слог, второе — открытый.\"],\"examples\":[{\"w\":\"c[u]p\",\"ipa\":\"[ʌ]\",\"ru\":\"близко к русскому а\"},{\"w\":\"c[a]t\",\"ipa\":\"[æ]\",\"ru\":\"между а и э\"},{\"w\":\"p[e]n\",\"ipa\":\"[e]\",\"ru\":\"как э\"},{\"w\":\"b[i]g\",\"ipa\":\"[ɪ]\",\"ru\":\"короткое и\"},{\"w\":\"b[o]x\",\"ipa\":\"[ɒ]\",\"ru\":\"короткое о\"},{\"w\":\"g[y]m\",\"ipa\":\"[ɪ]\",\"ru\":\"короткое и — y читается как i\"}],\"drill\":[{\"word\":\"c[u]p\",\"ipa\":\"[ʌ]\",\"ex\":\"как в but\",\"wrong\":[[\"[juː]\",\"как в tune\",\"[juː] — так u читается в открытом слоге, когда на конце немая e: tune, cute.\"],[\"[ʊ]\",\"как в book\",\"[ʊ] — короткое «у»: его дают oo перед k (book) и u в нескольких словах вроде put, pull.\"]],\"why\":\"В cup после u стоит согласная p, немой e на конце нет: слог закрытый, u читается кратко — [ʌ].\"},{\"word\":\"c[a]t\",\"ipa\":\"[æ]\",\"ex\":\"как в bad\",\"wrong\":[[\"[eɪ]\",\"как в name\",\"[eɪ] — так a читается в открытом слоге, с немой e на конце: name, late.\"],[\"[ɑː]\",\"как в car\",\"[ɑː] — долгое «а», его даёт ar: car, park. Здесь после a нет r.\"]],\"why\":\"В cat после a стоит согласная t, немой e нет: слог закрытый, a читается кратко — [æ].\"},{\"word\":\"p[e]n\",\"ipa\":\"[e]\",\"ex\":\"как в bed\",\"wrong\":[[\"[iː]\",\"как в see\",\"[iː] — долгое «и»: его дают ee (see) и e в открытом слоге (he, Pete).\"],[\"[ɜː]\",\"как в her\",\"[ɜː] дают er, ir, ur — гласная с r после неё. Здесь после e нет r.\"]],\"why\":\"В pen после e стоит согласная n: слог закрытый, e читается кратко — [e].\"},{\"word\":\"b[i]g\",\"ipa\":\"[ɪ]\",\"ex\":\"как в sit\",\"wrong\":[[\"[aɪ]\",\"как в nine\",\"[aɪ] — так i читается в открытом слоге, с немой e на конце: nine, time.\"],[\"[iː]\",\"как в see\",\"[iː] — долгое «и» из ee и ea: see, sea.\"]],\"why\":\"В big после i стоит согласная g: слог закрытый, i читается кратко — [ɪ].\"},{\"word\":\"b[o]x\",\"ipa\":\"[ɒ]\",\"ex\":\"как в hot\",\"wrong\":[[\"[əʊ]\",\"как в note\",\"[əʊ] — так o читается в открытом слоге, с немой e на конце: note, home.\"],[\"[uː]\",\"как в too\",\"[uː] — долгое «у», его даёт двойная oo: too, food. Здесь o одна.\"]],\"why\":\"В box после o стоит согласная x: слог закрытый, o читается кратко — [ɒ].\"},{\"word\":\"r[u]n\",\"ipa\":\"[ʌ]\",\"ex\":\"как в cup\",\"wrong\":[[\"[uː]\",\"как в too\",\"[uː] — долгое «у», его даёт двойная oo: too, food.\"],[\"[juː]\",\"как в tune\",\"[juː] — так u читается в открытом слоге, с немой e на конце: tune, cute.\"]],\"why\":\"В run после u стоит согласная n: слог закрытый, u читается кратко — [ʌ].\"},{\"word\":\"h[a]t\",\"ipa\":\"[æ]\",\"ex\":\"как в cat\",\"wrong\":[[\"[eɪ]\",\"как в name\",\"[eɪ] — так a читается в открытом слоге, с немой e на конце: hate, name.\"],[\"[ɑː]\",\"как в car\",\"[ɑː] — долгое «а», его даёт ar: car, park. Здесь после a нет r.\"]],\"why\":\"В hat после a стоит согласная t, немой e нет: слог закрытый — [æ]. С немой e получится hate, и звук станет [eɪ].\"},{\"word\":\"s[i]t\",\"ipa\":\"[ɪ]\",\"ex\":\"как в big\",\"wrong\":[[\"[aɪ]\",\"как в nine\",\"[aɪ] — так i читается в открытом слоге, с немой e: с ним получится site «сайт».\"],[\"[iː]\",\"как в see\",\"[iː] — долгое «и» из ee и ea: с ним получится seat «сиденье».\"]],\"why\":\"В sit после i стоит согласная t: слог закрытый, i читается кратко — [ɪ].\"},{\"word\":\"b[e]d\",\"ipa\":\"[e]\",\"ex\":\"как в pen\",\"wrong\":[[\"[iː]\",\"как в see\",\"[iː] — долгое «и» из ee: с ним получится bead «бусина».\"],[\"[ɪ]\",\"как в big\",\"[ɪ] — так в закрытом слоге читается i, а не e: с ним получится другое слово — bid.\"]],\"why\":\"В bed после e стоит согласная d: слог закрытый, e читается кратко — [e].\"},{\"word\":\"st[o]p\",\"ipa\":\"[ɒ]\",\"ex\":\"как в box\",\"wrong\":[[\"[əʊ]\",\"как в note\",\"[əʊ] — так o читается в открытом слоге, с немой e на конце: note, hope.\"],[\"[ɔː]\",\"как в for\",\"[ɔː] — долгое «о», его даёт or: for, fork. Здесь после o нет r.\"]],\"why\":\"В stop после o стоит согласная p: слог закрытый, o читается кратко — [ɒ].\"},{\"word\":\"b[u]s\",\"ipa\":\"[ʌ]\",\"ex\":\"как в cup\",\"wrong\":[[\"[ʊ]\",\"как в book\",\"[ʊ] — короткое «у»: его дают oo перед k (book) и u в нескольких словах вроде put, pull. bus к ним не относится.\"],[\"[uː]\",\"как в too\",\"[uː] — долгое «у», его даёт двойная oo: too, food.\"]],\"why\":\"В bus после u стоит согласная s: слог закрытый, u читается кратко — [ʌ].\"},{\"word\":\"m[a]p\",\"ipa\":\"[æ]\",\"ex\":\"как в cat\",\"wrong\":[[\"[eɪ]\",\"как в name\",\"[eɪ] — так a читается в открытом слоге, с немой e на конце: name, cape.\"],[\"[e]\",\"как в pen\",\"[e] — так в закрытом слоге читается e: pen, bed. У a звук шире — [æ], рот открыт больше.\"]],\"why\":\"В map после a стоит согласная p: слог закрытый, a читается кратко — [æ].\"},{\"word\":\"s[y]mbol\",\"ipa\":\"[ɪ]\",\"ex\":\"как в big\",\"wrong\":[[\"[aɪ]\",\"как в my\",\"[aɪ] — так y звучит в открытом слоге: my, type. Здесь после y согласная, слог закрытый.\"],[\"[j]\",\"как в yes\",\"[j] — так y читается в начале слова перед гласной: yes, you. Здесь y между согласными.\"]],\"why\":\"В sym- после y согласная m: слог закрытый, y читается как i в big — [ɪ].\"},{\"word\":\"cr[y]stal\",\"ipa\":\"[ɪ]\",\"ex\":\"как в big\",\"wrong\":[[\"[aɪ]\",\"как в my\",\"[aɪ] — так y звучит в открытом слоге: my, type. Здесь после y согласная, слог закрытый.\"],[\"[i]\",\"как в happy\",\"[i] — короткое «и» на конце длинного слова без ударения: happy, city.\"]],\"why\":\"В crys- после y согласная s: слог закрытый — [ɪ].\"}]},{\"name\":\"Открытый слог\",\"explain\":[\"<span class='h'>Что это<\/span>Открытый слог <span class='key'>кончается на гласную<\/span>: he, go, me. Или за гласной стоит одна согласная и немая e: name, nine, note.\",\"<span class='h'>Как читается<\/span>Гласная звучит <span class='key'>так, как называется в алфавите<\/span>: a — [eɪ] как в name, e — [iː] как в Pete, i — [aɪ] как в nine, o — [əʊ] как в note, u — [juː] как в tune, y — [aɪ] как в my и type: y читается так же, как i.\",\"<span class='h'>Немая e<\/span>Буква e в конце слова <span class='key'>сама не читается<\/span>. Её задача — открыть слог, чтобы гласная звучала «по алфавиту». Сравни: rat — rate, bit — bite.\",\"<span class='h'>В длинных словах<\/span>Если после гласной одна согласная, а дальше снова гласная, слог обычно тоже открытый: pa-per, ti-ger, mu-sic, ho-tel.\",\"<span class='h'>Ловушка<\/span>После r, l и j буква u часто читается [uː], без «й»: June, rule. И есть частые слова-исключения, где e на конце, а гласная краткая: have, give, come, done. Их проще запомнить.\",\"<span class='h'>Как тренировать<\/span>Читай пары: hat — hate, pin — pine, hop — hope, us — use. Во втором слове немая e открывает слог.\"],\"examples\":[{\"w\":\"n[a]me\",\"ipa\":\"[eɪ]\",\"ru\":\"эй — как буква A\"},{\"w\":\"P[e]te\",\"ipa\":\"[iː]\",\"ru\":\"долгое и — как буква E\"},{\"w\":\"n[i]ne\",\"ipa\":\"[aɪ]\",\"ru\":\"ай — как буква I\"},{\"w\":\"n[o]te\",\"ipa\":\"[əʊ]\",\"ru\":\"оу — как буква O\"},{\"w\":\"t[u]ne\",\"ipa\":\"[juː]\",\"ru\":\"ю — как буква U\"},{\"w\":\"m[y]\",\"ipa\":\"[aɪ]\",\"ru\":\"ай — y как буква I\"}],\"drill\":[{\"word\":\"n[a]me\",\"ipa\":\"[eɪ]\",\"ex\":\"как в day\",\"wrong\":[[\"[æ]\",\"как в cat\",\"[æ] — так a читается в закрытом слоге, без немой e на конце: cat, man.\"],[\"[ɑː]\",\"как в car\",\"[ɑː] даёт ar: car, park. Здесь после a нет r.\"]],\"why\":\"В name за a одна согласная m и немая e: слог открытый, a читается как в алфавите — [eɪ].\"},{\"word\":\"P[e]te\",\"ipa\":\"[iː]\",\"ex\":\"как в see\",\"wrong\":[[\"[e]\",\"как в pen\",\"[e] — так e читается в закрытом слоге, без немой e на конце: pen, pet.\"],[\"[ɜː]\",\"как в her\",\"[ɜː] дают er, ir, ur. Здесь после e нет r.\"]],\"why\":\"В Pete за e одна согласная t и немая e: слог открытый, e читается как в алфавите — [iː].\"},{\"word\":\"n[i]ne\",\"ipa\":\"[aɪ]\",\"ex\":\"как в my\",\"wrong\":[[\"[ɪ]\",\"как в big\",\"[ɪ] — так i читается в закрытом слоге, без немой e на конце: big, pin.\"],[\"[iː]\",\"как в see\",\"[iː] — так в алфавите называется буква e, а не i.\"]],\"why\":\"В nine за i одна согласная n и немая e: слог открытый, i читается как в алфавите — [aɪ].\"},{\"word\":\"n[o]te\",\"ipa\":\"[əʊ]\",\"ex\":\"как в go\",\"wrong\":[[\"[ɒ]\",\"как в box\",\"[ɒ] — так o читается в закрытом слоге, без немой e: box, not.\"],[\"[ɔː]\",\"как в for\",\"[ɔː] — долгое «о», его даёт or: for, fork. Здесь после o нет r.\"]],\"why\":\"В note за o одна согласная t и немая e: слог открытый, o читается как в алфавите — [əʊ].\"},{\"word\":\"t[u]ne\",\"ipa\":\"[juː]\",\"ex\":\"как в music\",\"wrong\":[[\"[ʌ]\",\"как в cup\",\"[ʌ] — так u читается в закрытом слоге, без немой e на конце: cup, but.\"],[\"[ʊ]\",\"как в book\",\"[ʊ] — короткое «у» из oo перед k: book, look.\"]],\"why\":\"В tune за u одна согласная n и немая e: слог открытый, u читается как в алфавите — [juː].\"},{\"word\":\"h[o]me\",\"ipa\":\"[əʊ]\",\"ex\":\"как в note\",\"wrong\":[[\"[ɒ]\",\"как в box\",\"[ɒ] — так o читается в закрытом слоге, без немой e: box, hot.\"],[\"[uː]\",\"как в too\",\"[uː] — долгое «у» из двойной oo: too, foo сского «о», звук долгий: walk, form, more, four.\",\"<span class='h'>Как произносить [ɜː]<\/span>Губы не округляй — они спокойные, чуть растянуты. Язык лежит посередине рта. Звук средний между «э» и «ё», но без округления губ: work, firm, bird, learn.\",\"<span class='h'>Как узнать на письме<\/span>[ɔː] дают or и ore (form, more), al перед k (walk, talk), aw (saw), our в слове four. [ɜː] дают er, ir, ur перед согласной (term, bird, turn) и чаще всего ear перед согласной (learn, early).\",\"Почему work читается не как fork: после <span class='key'>w<\/span> сочетание <span class='key'>or<\/span> обычно даёт [ɜː] — work, word, world, worse. А в walk и talk буквы <span class='key'>al<\/span> читаются [ɔː], l не произносится.\",\"<span class='h'>Как поймать ошибку у себя<\/span>Если округлить губы и на [ɜː], work прозвучит как walk. Посмотри в зеркало: на [ɜː] губы в лёгкой улыбке, на [ɔː] вытянуты вперёд. Читай пары подряд: walk — work, form — firm, short — shirt, born — burn.\"],\"examples\":[{\"w\":\"w[al]k\",\"ipa\":\"[ɔː]\",\"ru\":\"о · «идти пешком»\"},{\"w\":\"w[or]k\",\"ipa\":\"[ɜː]\",\"ru\":\"ё · «работа»\"},{\"w\":\"f[or]m\",\"ipa\":\"[ɔː]\",\"ru\":\"о · «форма»\"},{\"w\":\"f[ir]m\",\"ipa\":\"[ɜː]\",\"ru\":\"ё · «фирма»\"},{\"w\":\"b[or]n\",\"ipa\":\"[ɔː]\",\"ru\":\"о · «родился»\"},{\"w\":\"b[ur]n\",\"ipa\":\"[ɜː]\",\"ru\":\"ё · «гореть»\"}],\"drill\":[{\"word\":\"w[al]k\",\"ipa\":\"[ɔː]\",\"ex\":\"как в more\",\"wrong\":[[\"[ɜː]\",\"получится work\",\"Губы не округлились — вышло work «работа». Это ошибка, искажающая смысл.\"],[\"[æ]\",\"как в cat\",\"[æ] — одна a в закрытом слоге: cat.\"]],\"why\":\"al перед k читается [ɔː], l молчит: walk, talk.\"},{\"word\":\"w[or]k\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"получится walk\",\"Губы округлились — вышло walk «идти пешком».\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — одна o в закрытом слоге без r: box.\"]],\"why\":\"После w сочетание or читается [ɜː]: work, word, world.\"},{\"word\":\"f[or]m\",\"ipa\":\"[ɔː]\",\"ex\":\"как в more\",\"wrong\":[[\"[ɜː]\",\"получится firm\",\"Губы не округлились — вышло firm «фирма». Это ошибка, искажающая смысл.\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — краткое, одна o без r: box.\"]],\"why\":\"or перед согласной — долгое [ɔː], губы округлены: form «форма».\"},{\"word\":\"f[ir]m\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"получится form\",\"Губы округлились — вышло form «форма». Это ошибка, искажающая смысл.\"],[\"[ɪ]\",\"как в big\",\"[ɪ] — краткое, одна i без r: big.\"]],\"why\":\"ir перед согласной — долгое [ɜː], губы спокойные: firm «фирма».\"},{\"word\":\"sh[ir]t\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"как в short\",\"С [ɔː] получится short «короткий» — ошибка, искажающая смысл.\"],[\"[ɪ]\",\"как в big\",\"[ɪ] — краткое, одна i без r: big, sit.\"]],\"why\":\"ir перед согласной — долгое [ɜː]: shirt «рубашка».\"},{\"word\":\"t[al]k\",\"ipa\":\"[ɔː]\",\"ex\":\"как в walk\",\"wrong\":[[\"[ɜː]\",\"как в work\",\"Губы не округлились — звук ушёл в сторону work.\"],[\"[æ]\",\"как в cat\",\"[æ] — одна a в закрытом слоге. В сочетании al перед k буква l молчит, а a даёт [ɔː].\"]],\"why\":\"talk, walk, chalk: l не читается, гласная долгая и округлая [ɔː].\"},{\"word\":\"sp[or]t\",\"ipa\":\"[ɔː]\",\"ex\":\"как в more\",\"wrong\":[[\"[ɜː]\",\"как в her\",\"[ɜː] дают er, ir, ur: her, firm, turn.\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — краткое, одна o без r: box, got.\"]],\"why\":\"or под ударением — долгое округлое [ɔː]: sport, form, short.\"},{\"word\":\"w[or]d\",\"ipa\":\"[ɜː]\",\"ex\":\"после w\",\"wrong\":[[\"[ɔː]\",\"как в more\",\"[ɔː] — обычное чтение or: form, sport. Но после w сочетание or даёт [ɜː].\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — одна o без r: box, got.\"]],\"why\":\"После w сочетание or читается [ɜː]: word, work, world, worse.\"},{\"word\":\"b[ir]d\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"как в more\",\"[ɔː] даёт or: form, sport. Губы здесь не округляются.\"],[\"[aɪ]\",\"как в my\",\"[aɪ] — i в открытом слоге: five, time. Здесь после i стоит r.\"]],\"why\":\"ir под ударением — [ɜː]: bird, firm, shirt.\"},{\"word\":\"t[ur]n\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"как в more\",\"С округлыми губами получится torn «порванный» — другое слово.\"],[\"[ʌ]\",\"как в cup\",\"[ʌ] — одна u в закрытом слоге без r: cup, but.\"]],\"why\":\"ur под ударением — [ɜː]: turn, nurse, hurt.\"}]},{\"name\":\"Связующее r (linking r)\",\"explain\":[\"<span class='h'>Чем грозит на ЕГЭ<\/span>ФИПИ требует <span class='key'>владеть связующим r<\/span>. Без него слова отрываются друг от друга, и чтение звучит рублено.\",\"<span class='h'>Правило<\/span>В британском произношении r в конце слова <span class='key'>не читается<\/span>: car, more, where. Но если следующее слово начинается с гласного звука, r <span class='key'>появляется<\/span> и связывает слова: car is, more and more, where is.\",\"<span class='h'>Когда r молчит<\/span>Перед согласной и в конце фразы: car park, more time, «Where?». Смотри на начало следующего слова: в far away дальше гласная — r звучит, в far from home — согласная, r нет.\",\"<span class='h'>Как произносить<\/span>Это не русское раскатистое «р». Кончик языка приподнят к нёбу, но не касается его и не дрожит. Звук короткий, как мостик между словами: where is — почти «уэ-риз».\",\"<span class='h'>Как тренировать<\/span>Прежде чем читать текст, найди в нём все места «слово на r или re + слово на гласную» и соедини их карандашом дугой. Потом читай эти пары, не отрывая одно слово от другого: there are, for a walk, after all, here and there.\"],\"examples\":[{\"w\":\"whe[r]e is\",\"ipa\":\"[r]\",\"ru\":\"r звучит — дальше гласная\"},{\"w\":\"the[r]e are\",\"ipa\":\"[r]\",\"ru\":\"r звучит\"},{\"w\":\"fa[r] away\",\"ipa\":\"[r]\",\"ru\":\"r звучит\"},{\"w\":\"afte[r] all\",\"ipa\":\"[r]\",\"ru\":\"r звучит\"},{\"w\":\"whe[r]e\",\"ipa\":\"—\",\"ru\":\"отдельно — r не читается\"},{\"w\":\"fa[r] from\",\"ipa\":\"—\",\"ru\":\"дальше согласная — r не читается\"}],\"drill\":[{\"word\":\"whe[r]e is\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ɹə]\",\"с гласной\",\"Лишняя гласная после r не нужна: r — короткий мостик прямо к is.\"]],\"why\":\"Следующее слово is начинается с гласной — r появляется и связывает слова: «уэ-риз».\"},{\"word\":\"the[r]e are\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ə]\",\"только призвук\",\"Одного призвука мало: без r слова отрываются друг от друга.\"]],\"why\":\"Следующее слово are начинается с гласной — r появляется и связывает слова.\"},{\"word\":\"fa[r] away\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ɑː]\",\"только долгая гласная\",\"Одной долгой гласной мало: без r слова отрываются друг от друга.\"]],\"why\":\"Следующее слово away начинается с гласной — r появляется и связывает слова.\"},{\"word\":\"ca[r]\",\"ipa\":\"—\",\"ex\":\"отдельное слово — не звучит\",\"wrong\":[[\"[r]\",\"звучит\",\"r звучит, только если следующее слово начинается с гласной: car is.\"],[\"[ɹ]\",\"звучит слабо\",\"Даже слабого r здесь нет: в конце фразы r молчит полностью.\"]],\"why\":\"car отдельно, дальше ничего нет — в британском произношении r не читается: [kɑː].\"},{\"word\":\"mo[r]e and more\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ɔː]\",\"только гласная\",\"Одной гласной мало: без r слова отрываются друг от друга.\"]],\"why\":\"Следующее слово and начинается с гласной — r появляется и связывает слова.\"},{\"word\":\"fo[r] example\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"Следующее слово начинается с гласной — r оживает и связывает слова.\"],[\"[ɔː]\",\"только гласная\",\"Одной гласной мало: без r между словами появится пауза.\"]],\"why\":\"r в конце слова звучит, если дальше гласная: for example, for us.\"},{\"word\":\"fo[r] me\",\"ipa\":\"—\",\"ex\":\"не звучит\",\"wrong\":[[\"[r]\",\"звучит\",\"r звучит только перед гласной: for example. Перед согласной он молчит.\"],[\"[ɹ]\",\"слабое r\",\"Даже слабого r здесь нет: дальше идёт согласный.\"]],\"why\":\"Перед согласной конечное r молчит: for me, for you.\"},{\"word\":\"yea[r] ago\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"Дальше гласная — r произносится и соединяет слова.\"],[\"[ə]\",\"только призвук\",\"Призвука мало: нужен сам согласный [r].\"]],\"why\":\"year ago звучит слитно, через [r] — без паузы между словами.\"},{\"word\":\"he[r] eyes\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"Следующее слово начинается с гласной — r звучит.\"],[\"[ɜː]\",\"только долгая гласная\",\"Долгая гласная остаётся, но к ней добавляется мостик [r].\"]],\"why\":\"her eyes — классический случай связующего r.\"},{\"word\":\"ou[r] house\",\"ipa\":\"—\",\"ex\":\"не звучит\",\"wrong\":[[\"[r]\",\"звучит\",\"House начинается с согласного — r молчит.\"],[\"[ʊə]\",\"дифтонг с призвуком\",\"Дифтонг здесь есть, но согласный [r] не произносится.\"]],\"why\":\"Перед согласной r не звучит: our house. Зато our idea — уже со звуком.\"}]},{\"name\":\"Слабые формы служебных слов\",\"explain\":[\"<span class='h'>Чем грозит на ЕГЭ<\/span>ФИПИ требует <span class='key'>правильно использовать сильную и слабую формы<\/span> местоимений и служебных слов.\",\"<span class='h'>Что такое слабая форма<\/span>Служебные слова — артикли, предлоги, союзы, вспомогательные глаголы — в потоке речи обычно без ударения. Гласная в них сжимается до короткого нейтрального звука <span class='key'>[ə]<\/span>, похожего на безударное «а» в конце слова «мама»: to school [tə skuːl], a cup of tea [ə kʌp əv tiː].\",\"<span class='h'>Основные слабые формы<\/span>a [ə], the [ðə], and [ən], to [tə], for [fə], of [əv], at [ət], from [frəm], can [kən], was [wəz], were [wə], have [həv], some [səm].\",\"<span class='h'>Когда нужна сильная форма<\/span>Слово читается полностью, с ударением, в конце фразы и когда на нём смысл: Where are you <span class='key'>from<\/span>? [frɒm], Yes, I <span class='key'>can<\/span>. [kæn]. Перед гласным звуком the читается [ði], а to — [tu]: the apple, to eat.\",\"<span class='h'>Как поймать ошибку у себя<\/span>Если каждое служебное слово читать полностью — «ту скул», «фор ю», — речь звучит как по слогам. Прочитай фразу «I want to go for a walk», произнося полностью только слова со смыслом: want, go, walk. Служебные проговаривай быстро и тихо, будто они приклеены к соседнему слову.\"],\"examples\":[{\"w\":\"[to] school\",\"ipa\":\"[tə]\",\"ru\":\"не «ту», а слабое [tə]\"},{\"w\":\"[for] you\",\"ipa\":\"[fə]\",\"ru\":\"не «фо», а [fə]\"},{\"w\":\"[of] them\",\"ipa\":\"[əv]\",\"ru\":\"слабое [əv]\"},{\"w\":\"[can] swim\",\"ipa\":\"[kən]\",\"ru\":\"слабое [kən], не «кэн»\"},{\"w\":\"[the] apple\",\"ipa\":\"[ði]\",\"ru\":\"перед гласной the читается [ði]\"},{\"w\":\"Yes, I [can].\",\"ipa\":\"[kæn]\",\"ru\":\"в конце фразы — сильная форма\"}],\"drill\":[{\"word\":\"[to] school\",\"ipa\":\"[tə]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[tuː]\",\"сильная — под ударением\",\"Сильная форма [tuː] — под ударением или в конце фразы.\"],[\"[tɒ]\",\"то\",\"«то» — русское чтение буквы o.\"]],\"why\":\"to без ударения, дальше согласная — слабая форма [tə].\"},{\"word\":\"[for] you\",\"ipa\":\"[fə]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[fɔː]\",\"сильная\",\"Сильная [fɔː] — под ударением или в конце фразы: What for?\"],[\"[fɜː]\",\"как в fur\",\"[ɜː] — долгий звук из er, ir, ur, а в слабой форме гласная короткая.\"]],\"why\":\"for без ударения — слабая форма [fə].\"},{\"word\":\"[of] them\",\"ipa\":\"[əv]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[ɒv]\",\"сильная\",\"Сильная [ɒv] — под ударением или в конце фразы: What is it made of?\"],[\"[ɒf]\",\"как в off\",\"[ɒf] — это off «выключено, прочь».\"]],\"why\":\"of без ударения — слабая форма [əv]. Буква f в of читается [v].\"},{\"word\":\"[can] swim\",\"ipa\":\"[kən]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[kæn]\",\"сильная — в конце фразы\",\"Сильная [kæn] — в конце фразы или под ударением: Yes, I can.\"],[\"[kɑːn]\",\"долгая\",\"Долгое [ɑː] звучит в can't [kɑːnt]. Если прочитать can долго, могут услышать «не могу».\"]],\"why\":\"can перед глаголом, без ударения — слабая форма [kən].\"},{\"word\":\"[at] home\",\"ipa\":\"[ət]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[æt]\",\"сильная\",\"Сильная [æt] — под ударением или в конце фразы: What are you looking at?\"],[\"[ɑːt]\",\"долгая\",\"Долгой гласной в at не бывает.\"]],\"why\":\"at без ударения — слабая форма [ət].\"},{\"word\":\"[and] you\",\"ipa\":\"[ən]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[ænd]\",\"сильная\",\"Сильная [ænd] — под ударением или когда слова перечисляют раздельно.\"],[\"[end]\",\"энд\",\"«энд» — русское чтение буквы a.\"]],\"why\":\"В беглой речи and звучит [ən] или [ənd]: fish and chips.\"},{\"word\":\"[was] late\",\"ipa\":\"[wəz]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[wɒz]\",\"сильная\",\"Сильная [wɒz] — под ударением и в конце фразы: Yes, he was.\"],[\"[wɑːz]\",\"долгая\",\"Долгой гласной в was не бывает.\"]],\"why\":\"Безударный вспомогательный глагол ослабляется: was late — [wəz].\"},{\"word\":\"[are] going\",\"ipa\":\"[ə]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[ɑː]\",\"сильная\",\"Сильная [ɑː] — под ударением или в конце фразы: Yes, they are.\"],[\"[eə]\",\"как в care\",\"[eə] — так are читается внутри слов: care, share. Само слово are так не читается: сильная форма [ɑː], слабая [ə].\"]],\"why\":\"В связке they are going глагол ослаблен до [ə].\"},{\"word\":\"[have] seen\",\"ipa\":\"[həv]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[hæv]\",\"сильная\",\"Сильная [hæv] — когда have значит «иметь» и стоит под ударением.\"],[\"[heɪv]\",\"хэйв\",\"Долгого [eɪ] в have не бывает.\"]],\"why\":\"Во временах Perfect have безударный: I have seen часто сливается в одно слово.\"},{\"word\":\"[some] water\",\"ipa\":\"[səm]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[sʌm]\",\"сильная\",\"Сильная [sʌm] — под ударением: Some people like it.\"],[\"[səʊm]\",\"соум\",\"Такого чтения у some нет.\"]],\"why\":\"Перед существительным some ослабляется до [səm]: some water, some time.\"}]}]},\"endings\":{\"kind\":\"phon\",\"title\":\"Окончания -ed и -s: как читаются\",\"sub\":\"worked — [t], played — [d], wanted — [ɪd]; works — [s], plays — [z], watches — [ɪz]\",\"blocks\":[{\"name\":\"Окончание -ed: [t], [d] или [ɪd]\",\"explain\":[\"<span class='h'>Зачем это знать<\/span>Пишется всегда одинаково — <span class='key'>-ed<\/span>, а звучит по-разному. При чтении вслух это слышно сразу.\",\"<span class='h'>Три случая<\/span>После глухого звука — [t]. После звонкого звука или гласной — [d]. После t и d — <span class='key'>[ɪd]<\/span>, и только здесь появляется лишний слог.\",\"<span class='h'>Глухие звуки<\/span>p, k, f, s, ʃ (sh), tʃ (ch): helped, worked, laughed, missed, washed, watched. Всё это звучит с [t].\",\"<span class='h'>Звонкие и гласные<\/span>b, g, v, z, m, n, l, r и любая гласная: played, opened, lived, called, cleaned. Здесь [d].\",\"<span class='h'>Главный признак [ɪd]<\/span>Если глагол уже кончается на t или d, два одинаковых звука подряд не произнести — появляется [ɪd]: wanted, needed, started, decided.\",\"<span class='h'>Проверка на слух<\/span>Скажи слово без окончания и послушай последний звук. Дрожит голос — [d], нет — [t], а если это t или d — [ɪd].\"],\"examples\":[{\"w\":\"work[ed]\",\"ipa\":\"[t]\",\"ru\":\"после глухого k\"},{\"w\":\"play[ed]\",\"ipa\":\"[d]\",\"ru\":\"после гласной\"},{\"w\":\"want[ed]\",\"ipa\":\"[ɪd]\",\"ru\":\"после t — лишний слог\"},{\"w\":\"open[ed]\",\"ipa\":\"[d]\",\"ru\":\"после звонкого n\"}],\"drill\":[{\"word\":\"work[ed]\",\"ipa\":\"[t]\",\"ex\":\"после глухого k\",\"wrong\":[[\"[d]\",\"после звонкого\",\"[d] звучит после звонких и гласных: played, opened.\"],[\"[ɪd]\",\"после t и d\",\"[ɪd] появляется только после t и d: wanted, needed.\"]],\"why\":\"k — глухой звук, поэтому окончание глухое: [wɜːkt].\"},{\"word\":\"play[ed]\",\"ipa\":\"[d]\",\"ex\":\"после гласной\",\"wrong\":[[\"[t]\",\"после глухого\",\"[t] звучит после глухих: worked, helped.\"],[\"[ɪd]\",\"после t и d\",\"Лишний слог бывает только после t и d.\"]],\"why\":\"После гласной окончание звонкое: [pleɪd].\"},{\"word\":\"want[ed]\",\"ipa\":\"[ɪd]\",\"ex\":\"после t\",\"wrong\":[[\"[t]\",\"после глухого\",\"Два звука t подряд не произнести — между ними появляется гласная.\"],[\"[d]\",\"после звонкого\",\"То же самое: после t нужен [ɪd], иначе окончание не слышно.\"]],\"why\":\"Глагол кончается на t, поэтому [ˈwɒntɪd] — на слог длиннее.\"},{\"word\":\"help[ed]\",\"ipa\":\"[t]\",\"ex\":\"после глухого p\",\"wrong\":[[\"[d]\",\"после звонкого\",\"p — глухой, голос не дрожит, значит и окончание глухое.\"],[\"[ɪd]\",\"после t и d\",\"В конце helped нет ни t, ни d перед окончанием.\"]],\"why\":\"p — глухой звук: [helpt].\"},{\"word\":\"open[ed]\",\"ipa\":\"[d]\",\"ex\":\"после звонкого n\",\"wrong\":[[\"[t]\",\"после глухого\",\"n — звонкий: приложи руку к горлу, голос дрожит.\"],[\"[ɪd]\",\"после t и d\",\"Лишний слог тут не нужен.\"]],\"why\":\"n — звонкий, окончание тоже звонкое: [ˈəʊpənd].\"},{\"word\":\"need[ed]\",\"ipa\":\"[ɪd]\",\"ex\":\"после d\",\"wrong\":[[\"[d]\",\"после звонкого\",\"Два d подряд сливаются, поэтому и появляется [ɪd].\"],[\"[t]\",\"после глухого\",\"d — звонкий, глухого окончания здесь быть не может.\"]],\"why\":\"Глагол кончается на d: [ˈniːdɪd], лишний слог.\"},{\"word\":\"wash[ed]\",\"ipa\":\"[t]\",\"ex\":\"после глухого ш\",\"wrong\":[[\"[d]\",\"после звонкого\",\"Звук ш глухой, значит окончание тоже глухое.\"],[\"[ɪd]\",\"после t и d\",\"sh — это не t и не d.\"]],\"why\":\"sh даёт глухой [ʃ], поэтому [wɒʃt].\"},{\"word\":\"liv[ed]\",\"ipa\":\"[d]\",\"ex\":\"после звонкого v\",\"wrong\":[[\"[t]\",\"после глухого\",\"v — звонкий. Глухой вариант f дал бы [t], как в laughed.\"],[\"[ɪd]\",\"после t и d\",\"Перед окончанием стоит v.\"]],\"why\":\"v — звонкий: [lɪvd].\"},{\"word\":\"start[ed]\",\"ipa\":\"[ɪd]\",\"ex\":\"после t\",\"wrong\":[[\"[t]\",\"после глухого\",\"После t окончание не слышно без гласной, поэтому [ɪd].\"],[\"[d]\",\"после звонкого\",\"То же самое.\"]],\"why\":\"Кончается на t: [ˈstɑːtɪd].\"},{\"word\":\"watch[ed]\",\"ipa\":\"[t]\",\"ex\":\"после глухого ч\",\"wrong\":[[\"[d]\",\"после звонкого\",\"Звук ч глухой.\"],[\"[ɪd]\",\"после t и d\",\"ch — это не t, хотя t в написании есть.\"]],\"why\":\"ch даёт глухой [tʃ]: [wɒtʃt].\"}]},{\"name\":\"Окончание -s: [s], [z] или [ɪz]\",\"explain\":[\"<span class='h'>Где встречается<\/span>Это окончание множественного числа (cats, dogs) и третьего лица в Present Simple (he works, she plays).\",\"<span class='h'>Три случая<\/span>После глухого — [s]. После звонкого или гласной — [z]. После свистящих и шипящих — <span class='key'>[ɪz]<\/span>, и снова добавляется слог.\",\"<span class='h'>Глухие<\/span>p, t, k, f: stops, cats, books, laughs. Звучит [s].\",\"<span class='h'>Звонкие и гласные<\/span>b, d, g, v, m, n, l, r и гласные: dogs, plays, lives, opens. Звучит [z].\",\"<span class='h'>Когда [ɪz]<\/span>Если слово кончается на s, z, sh, ch, x, ge: buses, watches, washes, boxes, changes. Два свистящих подряд не произнести.\",\"<span class='h'>Подсказка написания<\/span>Там, где слышно [ɪz], обычно и пишется -es.\"],\"examples\":[{\"w\":\"work[s]\",\"ipa\":\"[s]\",\"ru\":\"после глухого k\"},{\"w\":\"play[s]\",\"ipa\":\"[z]\",\"ru\":\"после гласной\"},{\"w\":\"watch[es]\",\"ipa\":\"[ɪz]\",\"ru\":\"после ч — лишний слог\"},{\"w\":\"dog[s]\",\"ipa\":\"[z]\",\"ru\":\"после звонкого g\"}],\"drill\":[{\"word\":\"work[s]\",\"ipa\":\"[s]\",\"ex\":\"после глухого k\",\"wrong\":[[\"[z]\",\"после звонкого\",\"[z] звучит после звонких и гласных: plays, dogs.\"],[\"[ɪz]\",\"после шипящих\",\"[ɪz] бывает после s, sh, ch, x: watches, boxes.\"]],\"why\":\"k — глухо me\":\"Порядок слов, It и There is\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Определительные придаточные: who, which, that\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"whoever, whatever, however, whenever\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"I prefer, I'd rather, You'd better\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Инверсия: hardly … when, no sooner … than\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Future Continuous и будущее в прошедшем\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"shall, would, need, ought to\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Модальные глаголы в косвенной речи\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"stop, remember, forget и love, hate + -ing\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Существительные только во множественном числе и собирательные\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Порядок прилагательных\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"none, no, nobody, nothing\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"both … and, either … or, neither … nor\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Предлоги в страдательном залоге: by, with, of\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]}],\"zakryto\":true}};\n\n/* ---------------- ЛОГИКА ---------------- */\nconst $ = s => document.querySelector(s);\nlet setKey=null, blockIdx=0, items=[], idx=0, missed=[], answered=false, totalAnswered=0;\n/* Прогресс живёт в браузере: закрыл вкладку — пройденное на месте.\n   У каждого ученика свой профиль, внутри пометки вида \"types-0\" и счёт ошибок по темам. */\nconst STORE_KEY = \"trenazher-english-v2\";\nconst PROGRESS_KEY = \"trenazher-english-progress-v1\";   // как хранили до появления профилей\n\nfunction segodnya(){\n  const d = new Date();\n  return (\"0\"+d.getDate()).slice(-2) + \".\" + (\"0\"+(d.getMonth()+1)).slice(-2) + \".\" + d.getFullYear();\n}\n\nfunction loadStore(){\n  try {\n    const raw = localStorage.getItem(STORE_KEY);\n    if(raw){\n      const s = JSON.parse(raw);\n      if(s && s.users) return s;\n    }\n  } catch(e){}\n  let staroe = null;                       // прогресс, записанный до профилей, не теряем\n  try { staroe = JSON.parse(localStorage.getItem(PROGRESS_KEY) || \"null\"); } catch(e){}\n  if(staroe && Object.keys(staroe).length)\n    return {active:\"Ученик\", users:{\"Ученик\":{passed:staroe, errors:{}, created:segodnya()}}};\n  return {active:null, users:{}};\n}\n\nlet store = loadStore();\nlet passed = {};                 // ссылка на прогресс активного ученика\n\n/* 21.10.2026: темы вставляли, объединяли и удаляли, а прогресс хранится по номеру темы —\n   один раз переносим отметки на новые номера. Ошибки переносим по названию темы. */\n(function perenosTem(){\n  if(store.perenos1021) return;\n  const novyNomer = {\n    apr:   i => i >= 3 ? i + 1 : i,                    // вставлена «Меняют смысл» после герундия\n    kodif: i => i === 2 ? null : (i > 2 ? i - 1 : i),  // убран Complex Subject\n    feb:   i => i === 4 ? 5 : i                        // согласование + Reported Speech = «Косвенная речь»\n  };\n  const staroeImya = {\"Согласование времён\":\"Косвенная речь\", \"Reported Speech\":\"Косвенная речь\"};\n  Object.values(store.users).forEach(u => {\n    const p = {};\n    Object.keys(u.passed || {}).forEach(k => {\n      const m = k.match(/^(\\w+)-(\\d+)$/);\n      if(!m || !novyNomer[m[1]]){ p[k] = u.passed[k]; return; }\n      const n = novyNomer[m[1]](+m[2]);\n      if(n !== null) p[m[1] + \"-\" + n] = true;\n    });\n    u.passed = p;\n    const e = {};\n    Object.keys(u.errors || {}).forEach(k => {\n      const st = u.errors[k], set = SETS[st.set];\n      const imya = staroeImya[st.name] || st.name;\n      const n = set ? set.blocks.findIndex(b => b.name === imya) : -1;\n      if(n < 0){ if(!set || st.set === \"kodif\" && /Complex Subject/.test(st.name)) return; e[k] = st; return; }\n      const key = st.set + \"-\" + n;\n      if(e[key]){ e[key].wrong += st.wrong; e[key].total += st.total; }\n      else { st.name = imya; e[key] = st; }\n    });\n    u.errors = e;\n  });\n  store.perenos1021 = true;\n  saveStore();\n})();\n\nfunction saveStore(){\n  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){}\n}\nfunction saveProgress(){ saveStore(); }    // имя оставлено: его зовёт остальной код\n\nfunction uchenik(){ return store.users[store.active] || null; }\n\nfunction vybrat(name){\n  if(!store.users[name]) store.users[name] = {passed:{}, errors:{}, created:segodnya()};\n  store.active = name;\n  passed = store.users[name].passed;\n  if(!store.users[name].errors) store.users[name].errors = {};\n  saveStore();\n}\n\n/* Счёт по темам: сколько заданий сделано и сколько из них с ошибкой.\n   Считаем и в повторении: забыл прошлую тему — это тоже сигнал репетитору. */\n/* цели Метрики: где уходят новые люди. Имена в Метрику не отправляем */\nconst cel = id => { try{ ym(113733723, 'reachGoal', id); }catch(e){} };\nlet otvetPoslan = false;\n\nfunction noteResult(verno){\n  if(!otvetPoslan){ otvetPoslan = true; cel(\"otvet\"); }   // один раз за заход\n  const u = uchenik(); if(!u || !setKey) return;\n  const key = setKey + \"-\" + (revising ? reviseIdx : blockIdx);\n  const st = u.errors[key] || (u.errors[key] = {set:setKey, setTitle:SETS[setKey].title, name:curBlock().name, wrong:0, total:0});\n  st.name = curBlock().name;\n  st.total++;\n  if(!verno) st.wrong++;\n  const q = items[idx] && items[idx].q;          // какие задания с ошибкой — для повторения\n  if(q){\n    st.miss = st.miss || [];\n    if(!verno && !st.miss.includes(q)) st.miss.push(q);\n    if(verno && revising) st.miss = st.miss.filter(x => x !== q);   // в повторении исправил — снимаем\n  }\n  st.last = segodnya();\n  saveStore();\n}\nfunction snyatOshibku(){                    // ученик доказал, что его вариант тоже верный\n  const u = uchenik(); if(!u || !setKey) return;\n  const st = u.errors[setKey + \"-\" + (revising ? reviseIdx : blockIdx)];\n  if(st && st.wrong > 0){\n    st.wrong--;\n    const q = items[idx] && items[idx].q;\n    if(st.miss && q) st.miss = st.miss.filter(x => x !== q);\n    saveStore();\n  }\n}\n\n/* Повторение: перед новой темой возвращаемся к предыдущей на три задания —\n   только новые предложения из REVISE, которых не было в упражнении (так решила Юля 20.10).\n   Ответы в повторении не идут в итог раздела. */\nconst REVISE_COUNT = 3;\nconst REVISE = {};\nlet revising = false, reviseIdx = 0;\nconst curBlock = () => SETS[setKey].blocks[revising ? reviseIdx : blockIdx];\nconst countAnswer = () => { if(!revising) totalAnswered++; };\nconst noteMiss = w => { if(!revising) missed.push({word:w, group:curBlock().name}); };\n\nconst plain = w => w.replace(/[\\[\\]]/g,\"\");\nconst marked = w => w.replace(/\\[(.+?)\\]/,\"<em>$1<\/em>\");\nconst isGram = () => SETS[setKey].kind===\"gram\";\nconst rightOf = it => isGram() ? it.a : it.ipa;\nconst spoken  = it => isGram()\n  ? (it.a2 ? it.q.replace(\"___\", it.a).replace(\"___\", it.a2) : (it.q.includes(\"___\") ? it.q.replace(\"___\", it.a===\"-\" ? \"\" : it.a) : it.a))\n  : plain(it.word);\n/* задания на выбор слова: варианты по алфавиту, чтобы порядок не выдавал ответ */\nconst choiceOf = it => (it.hint || it.q.trim().endsWith(\")\")) ? \"\" :\n  [it.a, ...it.wrong].map(x => x===\"-\" ? \"—\" : x)\n    .sort((x,y) => x.localeCompare(y, \"en\", {sensitivity:\"base\"})).join(\" / \");\n\n/* --- проверка того, что ученик вписал руками ---\n   Сокращения разворачиваются, чтобы don't и do not считались одним ответом.\n   Порядок замен важен: won't и can't разбираются до общего n't. */\nconst CONTRACTIONS = [\n  [/won't/g, \"will not\"], [/can't/g, \"can not\"], [/cannot/g, \"can not\"],\n  [/shan't/g, \"shall not\"], [/n't/g, \" not\"],\n  [/'re/g, \" are\"], [/'ve/g, \" have\"], [/'ll/g, \" will\"], [/'m/g, \" am\"]\n];\nfunction canon(s){\n  s = (s||\"\").toLowerCase().trim()\n    .replace(/[’‘`´]/g, \"'\")   // кривые апострофы к прямому\n    .replace(/[—–]/g, \"-\")          // тире к дефису\n    .replace(/[.!?,;]+$/, \"\")\n    .replace(/\\s+/g, \" \");\n  CONTRACTIONS.forEach(([re, to]) => { s = s.replace(re, to); });\n  return s.replace(/\\s+/g, \" \").trim();\n}\n/* раздел ЕГЭ: краткую форму (doesn't) не засчитываем, если в ответе полная — так в образце ФИПИ: DO NOT KNOW */\nconst shortForm = (it, typed) => !!(SETS[setKey] && SETS[setKey].fullForm) && /n['’‘`´]t\\b/i.test(typed) && !/n't\\b/i.test(it.a);\nfunction isRight(it, typed){\n  if(shortForm(it, typed)) return false;\n  const t = canon(typed);\n  return [it.a, ...(it.alt||[])].some(a => canon(a) === t || noComma(a) === noComma(typed));\n}\n/* запятые: ответ засчитываем, но показываем, где запятая нужна по правилам */\nconst noComma = s => canon(s).replace(/\\s*,\\s*/g, \" \").replace(/\\s+/g, \" \").trim();\nconst commaOff = (it, typed) => ![it.a, ...(it.alt||[])].some(a => canon(a) === canon(typed));\n/* расстояние редактирования — чтобы отличить опечатку от незнания */\nfunction dist(a,b){\n  const m=a.length, n=b.length;\n  const d=Array.from({length:m+1},(_,i)=>{const r=Array(n+1).fill(0); r[0]=i; return r;});\n  for(let j=0;j<=n;j++) d[0][j]=j;\n  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)\n    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));\n  return d[m][n];\n}\nfunction shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}\nconst show = id => [\"users\",\"podpiska\",\"report\",\"menu\",\"blocks\",\"ruleScreen\",\"card\",\"done\",\"reader\"].forEach(s => $(\"#\"+s).classList.toggle(\"hidden\", s!==id));\n\n/* ---- кто занимается ---- */\nfunction pokazatUchenikov(){\n  const box = $(\"#userList\"); box.innerHTML = \"\";\n  const imena = Object.keys(store.users);\n  imena.forEach(name => {\n    const u = store.users[name];\n    const sdelano = Object.keys(u.passed || {}).length;\n    const row = document.createElement(\"div\"); row.className = \"user-row\";\n    const btn = document.createElement(\"button\"); btn.className = \"menu-item\";\n    btn.style.flex = \"1\";\n    btn.innerHTML = \"<b>\" + name + \"<\/b><span>\" +\n      (sdelano ? \"пройдено тем: \" + sdelano : \"ещё не начинал\") +\n      (name === store.active ? \" · сейчас выбран\" : \"\") + \"<\/span>\";\n    btn.onclick = () => { vybrat(name); buildMenu(); show(\"menu\"); };\n    const del = document.createElement(\"button\"); del.className = \"link\"; del.textContent = \"удалить\";\n    del.onclick = () => {\n      if(!confirm(\"Удалить профиль «\" + name + \"» вместе с его прогрессом?\")) return;\n      delete store.users[name];\n      if(store.active === name){ store.active = null; passed = {}; }\n      saveStore(); pokazatUchenikov();\n    };\n    row.appendChild(btn); row.appendChild(del);\n    box.appendChild(row);\n  });\n  $(\"#newName\").value = \"\";\n  show(\"users\");\n}\n\nfunction dobavitUchenika(){\n  const name = $(\"#newName\").value.trim();\n  if(!name) return;\n  cel(\"nachal\");\n  if(store.users[name]){ vybrat(name); buildMenu(); show(\"menu\"); return; }\n  vybrat(name); buildMenu(); show(\"menu\");\n}\n\n/* ---- работа над ошибками ----\n   Берём темы, где ученик ошибался, и собираем из них общий набор: из самых слабых —\n   больше заданий. Темы перемешаны, подсказки «это такое-то правило» нет. */\nlet trening = false;\nlet mix = [];                       // [{k: раздел, bi: номер темы, it: задание}]\nconst MIX_SIZE = 12;\n\nfunction slabyeTemy(){\n  const u = uchenik(); if(!u) return [];\n  return Object.keys(u.errors || {})\n    .map(key => {\n      const e = u.errors[key];\n      const bi = Number(key.slice(String(e.set).length + 1));\n      return {k:e.set, bi:bi, e:e, dolya: e.total ? e.wrong / e.total : 0};\n    })\n    .filter(t => t.e.wrong > 0 && SETS[t.k] && SETS[t.k].blocks[t.bi] &&\n                 SETS[t.k].blocks[t.bi].drill && SETS[t.k].blocks[t.bi].drill.length)\n    .sort((a, b) => b.dolya - a.dolya || b.e.wrong - a.e.wrong);\n}\n\nfunction sobratSlaboe(){\n  const temy = slabyeTemy();\n  if(!temy.length) return [];\n  const zapas = temy.map(t => shuffle(SETS[t.k].blocks[t.bi].drill));\n  const out = [];\n  let i = 0, pusto = 0;\n  while(out.length < MIX_SIZE && pusto < temy.length){\n    const n = i % temy.length;\n    if(zapas[n].length){\n      out.push({k:temy[n].k, bi:temy[n].bi, it:zapas[n].pop()});\n      pusto = 0;\n    }else{\n      pusto++;\n    }\n    i++;\n  }\n  return shuffle(out);\n}\n\nfunction startTrening(){\n  stopSpeech();\n  mix = sobratSlaboe();\n  if(!mix.length) return;\n  trening = true; revising = false;\n  missed = []; totalAnswered = 0;\n  items = mix.map(m => m.it);\n  idx = 0;\n  render();\n  show(\"card\");\n}\n\n/* ---- отчёт для репетитора ---- */\nfunction sobratOtchet(){\n  const u = uchenik();\n  if(!u) return \"Ученик не выбран.\";\n  let temVsego = 0, temSdelano = 0;\n  const razdely = [];\n  Object.keys(SETS).forEach(k => {\n    const s = SETS[k];\n    let n = 0;\n    s.blocks.forEach((_, i) => { if(u.passed[k+\"-\"+i]) n++; });\n    temVsego += s.blocks.length;\n    temSdelano += n;\n    if(n) razdely.push(\"• \" + s.title + \": \" + n + \" из \" + s.blocks.length);\n  });\n  const temy = Object.values(u.errors || {}).filter(e => e.total);\n  const zadaniy = temy.reduce((s, e) => s + e.total, 0);\n  const oshibok = temy.reduce((s, e) => s + e.wrong, 0);\n  const slabye = temy.filter(e => e.wrong)\n    .sort((a, b) => (b.wrong / b.total) - (a.wrong / a.total) || b.wrong - a.wrong)\n    .slice(0, 10);\n\n  const L = [];\n  L.push(\"Тренажёр английского — отчёт\");\n  L.push(\"Ученик: \" + store.active);\n  L.push(\"Дата: \" + segodnya());\n  L.push(\"\");\n  L.push(\"Пройдено тем: \" + temSdelano + \" из \" + temVsego);\n  L.push(\"Выполнено заданий: \" + zadaniy + \", из них с ошибкой: \" + oshibok +\n         (zadaniy ? \" (\" + Math.round(oshibok / zadaniy * 100) + \"%)\" : \"\"));\n  L.push(\"\");\n  if(slabye.length){\n    L.push(\"Где чаще всего ошибается:\");\n    slabye.forEach(e => L.push(\"• \" + e.setTitle + \" → \" + e.name + \": \" +\n      e.wrong + \" из \" + e.total + \", последний раз \" + (e.last || \"—\")));\n  }else{\n    L.push(\"Ошибок пока не записано.\");\n  }\n  L.push(\"\");\n  if(razdely.length){\n    L.push(\"Что пройдено по разделам:\");\n    razdely.forEach(r => L.push(r));\n  }else{\n    L.push(\"Ни одна тема ещё не закрыта до конца.\");\n  }\n  return L.join(\"\\n\");\n}\n\nfunction pokazatOtchet(){\n  $(\"#reportName\").textContent = \"Отчёт: \" + store.active;\n  $(\"#reportText\").value = sobratOtchet();\n  show(\"report\");\n}\n\n/* Раздел → список правил. Видно все, можно зайти в любое. */\nfunction startSet(key){\n  stopSpeech();\n  trening = false;\n  setKey=key; missed=[]; totalAnswered=0;\n  const set=SETS[key];\n  $(\"#crumbSet\").textContent = \"Раздел\";\n  $(\"#setTitle\").textContent = set.title;\n  const list=$(\"#blockList\"); list.innerHTML=\"\";\n  if(set.kind===\"text\"){                          // список текстов для чтения вслух\n    $(\"#setSub\").textContent = \"Текстов: \" + set.blocks.length + \". Читай вслух сам, потом слушай и сравнивай.\";\n    set.blocks.forEach((t,i) => {\n      const btn=document.createElement(\"button\"); btn.className=\"menu-item\";\n      const done = passed[key+\"-\"+i] ? \" · прочитано\" : \"\";\n      btn.innerHTML = \"<b>\" + (i+1) + \". \" + t.name + \"<\/b><span>\" + t.rule + \" · \" +\n        plural(wordCount(t.text), \"слово\", \"слова\", \"слов\") + done + \"<\/span>\";\n      btn.onclick = () => showText(i);\n      list.appendChild(btn);\n    });\n    show(\"blocks\");\n    return;\n  }\n  $(\"#setSub\").textContent = \"Правил в разделе: \" + set.blocks.length + \". Каждое — объяснение и отработка.\";\n  set.blocks.forEach((b,i) => {\n    const btn=document.createElement(\"button\");\n    btn.className=\"menu-item\" + (b.zakryto ? \" zakryto\" : \"\");\n    const done = passed[key+\"-\"+i] ? \" · пройдено\" : \"\";\n    btn.innerHTML = \"<b>\" + (b.zakryto ? \"🔒 \" : \"\") + (i+1) + \". \" + b.name + \"<\/b><span>\" +\n      plural(b.zakryto ? b.n : b.drill.length, \"упражнение\", \"упражнения\", \"упражнений\") + done +\n      (b.zakryto ? ' · <span class=\"zamok\">по подписке<\/span>' : \"\") + \"<\/span>\";\n    btn.onclick = () => b.zakryto ? pokazatPodpisku() : openBlock(i);\n    list.appendChild(btn);\n  });\n  show(\"blocks\");\n}\n\n/* Вход в тему: сначала короткое повторение прошлой, потом правило новой.\n   В первой теме раздела повторять нечего — идём сразу к правилу. */\nfunction openBlock(i){\n  cel(\"tema\");\n  blockIdx = i;\n  const prev = i > 0 ? SETS[setKey].blocks[i-1] : null;\n  const novye = prev ? (REVISE[setKey + \"|\" + prev.name] || []) : [];   // свои предложения для повторения\n  const povtor = shuffle(novye).slice(0, REVISE_COUNT);   // ошибки из упражнения сюда не берём — они в «Работе над ошибками»\n  if(povtor.length){\n    revising = true; reviseIdx = i-1;\n    items = povtor;\n    idx = 0;\n    render();\n    show(\"card\");\n    return;\n  }\n  revising = false;\n  showRule();\n}\n\nfunction showRule(){\n  const set=SETS[setKey], b=set.blocks[blockIdx];\n  $(\"#crumb1\").textContent = set.title + \" · правило \" + (blockIdx+1) + \" из \" + set.blocks.length;\n  $(\"#ruleName\").textContent = b.name;\n  $(\"#explain\").innerHTML = b.explain.map(p => \"<p>\"+p+\"<\/p>\").join(\"\");\n  const list=$(\"#exList\"); list.innerHTML=\"\";\n  b.examples.forEach(e => {\n    const row=document.createElement(\"div\"); row.className=\"ex-row\";\n    if(set.kind===\"gram\"){\n      row.className=\"ex-row gram\";\n      row.innerHTML = '<span class=\"g-txt\"><span class=\"g-en\">'+e.w+'<\/span><span class=\"ru\">'+e.ru+'<\/span><\/span>';\n    }else{\n      row.innerHTML = '<span class=\"w\">'+marked(e.w)+'<\/span><span class=\"ipa\">'+e.ipa+'<\/span><span class=\"ru\">'+e.ru+'<\/span>';\n    }\n    const btn=document.createElement(\"button\"); btn.className=\"play\"; btn.textContent=\"звук\";\n    btn.onclick = () => say(plain(e.w));\n    row.appendChild(btn); list.appendChild(row);\n  });\n  show(\"ruleScreen\");\n}\n\nfunction startDrill(){\n  revising = false;\n  items = shuffle(SETS[setKey].blocks[blockIdx].drill);\n  idx = 0; render();\n  show(\"card\");\n}\n\nfunction render(){\n  answered=false;\n  if(trening && mix[idx]){ setKey = mix[idx].k; blockIdx = mix[idx].bi; }   // у каждого задания своя тема\n  const set=SETS[setKey], b=curBlock(), it=items[idx];\n  $(\"#crumb2\").textContent = (trening ? \"Работа над ошибками · \" : revising ? \"Повторение · \" : \"\") +\n    b.name + \" · \" + (idx+1) + \" из \" + items.length;\n  $(\"#prog\").style.width = (idx/items.length*100)+\"%\";\n  const gram = set.kind===\"gram\";\n  const w=$(\"#word\");\n  w.classList.toggle(\"sent\", gram);\n  const two = gram && !!it.a2;                    // вопрос: вспомогательный глагол и смысловой\n  w.innerHTML = gram                              // исходное слово справа, как в заданиях ЕГЭ\n    ? (revising ? \"<span class='povtor'>Повторение прошлой темы: <b>\" + b.name + \"<\/b><br>Потом откроется правило «\"\n                  + SETS[setKey].blocks[blockIdx].name + \"»<\/span>\" : \"\")   // чтобы повторение не приняли за сбой\n      + (it.title ? \"<span class='fipi-t'>\" + it.title + \"<\/span>\" : \"\")   // формат ФИПИ: заголовок текста\n      + (it.ctx ? \"<span class='fipi-ctx'>\" + it.ctx + \"<\/span>\" : \"\")   // и предыдущие строки текста\n      + (two ? it.q.replace(\"___\", \"<input class='gap' id='g1' type='text' autocomplete='off' autocapitalize='off' spellcheck='false'>\").replace(\"___\", \"<input class='gap' id='g2' type='text' autocomplete='off' autocapitalize='off' spellcheck='false'>\")\n           : it.q.replace(\"___\",\"<em>___<\/em>\"))\n      + (it.hint ? \" <span class='base'>\" + it.hint.toUpperCase() + \"<\/span>\" : \"\")\n      + (choiceOf(it) ? \" <span class='base choice'>\" + choiceOf(it) + \"<\/span>\" : \"\")\n    : marked(it.word);\n  $(\"#ask\").textContent = gram\n    ? (two ? \"Заполни оба пропуска: вспомогательный глагол и слово справа в нужной форме\"\n           : b.ask || (it.hint ? \"Поставь слово справа в нужную форму\" : choiceOf(it) ? \"Впиши одно из слов справа\" : \"Впиши подходящее слово\"))\n    : \"Как читается выделенная часть?\";\n  $(\"#say\").classList.toggle(\"hidden\", gram);   // в грамматике озвучка только после ответа\n  $(\"#hint\").classList.add(\"hidden\");\n  $(\"#next\").classList.add(\"hidden\");\n  $(\"#accept\").classList.add(\"hidden\");\n  $(\"#chips\").classList.add(\"hidden\");\n  $(\"#opts\").classList.toggle(\"hidden\", gram);\n  $(\"#typeBox\").classList.toggle(\"hidden\", !gram);\n\n  if(gram){                                    // ученик вписывает ответ сам\n    $(\"#opts\").innerHTML=\"\";\n    $(\"#tiprow\").classList.remove(\"hidden\");\n    $(\"#hintBtn\").classList.toggle(\"hidden\", !!choiceOf(it) || two);   // варианты уже на экране\n    const inp=$(\"#typed\");\n    inp.value=\"\"; inp.disabled=false; inp.classList.remove(\"ok\",\"no\");\n    inp.classList.toggle(\"hidden\", two);         // в вопросе пишут прямо в пропуски\n    if(two){\n      [$(\"#g1\"), $(\"#g2\")].forEach(g => g.onkeydown = e => { if(e.key===\"Enter\") checkTyped(); });\n      setTimeout(()=>$(\"#g1\").focus(), 0);\n    }else setTimeout(()=>inp.focus(), 0);\n    return;\n  }\n  const opts = shuffle([[it.ipa,it.ex,true,\"\"], ...it.wrong.map(x=>[x[0],x[1],false,x[2]||\"\"])]);   // x[2] — почему этот вариант неверный\n  const box=$(\"#opts\"); box.innerHTML=\"\";\n  opts.forEach(o => {\n    const btn=document.createElement(\"button\"); btn.className=\"opt\";\n    btn.innerHTML='<span class=\"ipa\">'+o[0]+'<\/span><span class=\"ex\">'+o[1]+'<\/span>';\n    btn.onclick = () => answer(btn,o[2],it,o[3]);\n    box.appendChild(btn);\n  });\n}\n\n/* Вопрос с двумя пропусками: слева вспомогательный глагол, справа смысловой */\nfunction checkTwo(it){\n  const g1=$(\"#g1\"), g2=$(\"#g2\");\n  if(!g1.value.trim() || !g2.value.trim()) return;\n  answered=true; countAnswer();\n  g1.disabled=true; g2.disabled=true;\n  $(\"#tiprow\").classList.add(\"hidden\");\n  const ok1=isRight({a:it.a, alt:it.alt}, g1.value), ok2=isRight({a:it.a2, alt:it.alt2}, g2.value);\n  g1.classList.add(ok1?\"ok\":\"no\"); g2.classList.add(ok2?\"ok\":\"no\");\n  const pair = it.a + \" … \" + it.a2;\n  noteResult(ok1 && ok2);\n  if(ok1 && ok2){\n    $(\"#hint\").textContent = \"Верно. \" + (it.why||\"\");\n  }else{\n    noteMiss(pair);\n    $(\"#hint\").textContent = \"Правильно: \" + pair + \". \" + (it.why||\"\");\n    $(\"#accept\").classList.remove(\"hidden\");\n  }\n  $(\"#hint\").classList.remove(\"hidden\");\n  $(\"#say\").classList.remove(\"hidden\");\n  $(\"#next\").classList.remove(\"hidden\");\n  say(spoken(it));\n}\n\n/* Проверка вписанного ответа */\nfunction checkTyped(){\n  if(answered) return;\n  const it=items[idx];\n  if(it.a2) return checkTwo(it);\n  const inp=$(\"#typed\"), typed=inp.value;\n  if(!typed.trim()) return;\n  answered=true; countAnswer();\n  inp.disabled=true;\n  $(\"#tiprow\").classList.add(\"hidden\");\n  const ok=isRight(it,typed);\n  inp.classList.add(ok?\"ok\":\"no\");\n  const shown = it.a===\"-\" ? \"ничего не нужно, дефис\" : it.a;\n  noteResult(ok);\n  if(ok){\n    $(\"#hint\").textContent = \"Верно. \" + (commaOff(it, typed) ? \"Проверь запятые, по правилам пишется так: \" + it.a + \" \" : \"\") + (it.why||\"\");\n  }else{\n    noteMiss(it.a);\n    const near = dist(canon(typed), canon(it.a)) <= 1;\n    $(\"#hint\").textContent =\n      (shortForm(it, typed) ? \"На ЕГЭ краткую форму не пишут, только полную. \" : near ? \"Почти — проверь написание. \" : \"\") +\n      \"Правильно: \" + shown + \". \" + (it.why||\"\");\n    $(\"#accept\").classList.remove(\"hidden\");\n  }\n  $(\"#hint\").classList.remove(\"hidden\");\n  $(\"#say\").classList.remove(\"hidden\");\n  $(\"#next\").classList.remove(\"hidden\");\n  say(spoken(it));\n}\n\n/* Ученик считает, что его вариант тоже верный — снимаем ошибку */\nfunction acceptMine(){\n  const it=items[idx];\n  const shown = it.a2 ? it.a + \" … \" + it.a2 : it.a;\n  if(missed.length && missed[missed.length-1].word===shown) missed.pop();\n  snyatOshibku();\n  (it.a2 ? [$(\"#g1\"), $(\"#g2\")] : [$(\"#typed\")]).forEach(el => { el.classList.remove(\"no\"); el.classList.add(\"ok\"); });\n  $(\"#accept\").classList.add(\"hidden\");\n  $(\"#hint\").textContent = \"Засчитано. Ожидался вариант: \" + shown + \". \" + (it.why||\"\");\n}\n\n/* Подсказка: те же три варианта, но не как задание, а как помощь */\nfunction showChips(){\n  if(answered) return;\n  const it=items[idx], box=$(\"#chips\");\n  box.innerHTML=\"\";\n  shuffle([it.a, ...it.wrong]).forEach(v => {\n    const b=document.createElement(\"button\"); b.className=\"chip\"; b.textContent=v;\n    b.onclick = () => { if(!answered){ $(\"#typed\").value=v; $(\"#typed\").focus(); } };\n    box.appendChild(b);\n  });\n  box.classList.remove(\"hidden\");\n}\n\nfunction answer(btn, correct, it, note){\n  if(answered) return; answered=true; countAnswer();\n  const right = rightOf(it);\n  noteResult(correct);\n  document.querySelectorAll(\".opt\").forEach(b=>{\n    b.disabled=true;\n    if(b.querySelector(\".ipa\").textContent===right) b.classList.add(\"ok\");\n  });\n  if(!correct){\n    btn.classList.add(\"no\");\n    noteMiss(isGram() ? it.a : plain(it.word));\n    $(\"#hint\").textContent = isGram()\n      ? (it.why || (\"Правило: \" + curBlock().name))\n      : note                                   // звуки: какой звук выбран и почему здесь другой\n        ? note + \" \" + (it.why||\"\")\n        : (\"Правило: \" + curBlock().name + \". Вернись к нему, если пошло не так.\");\n    $(\"#hint\").classList.remove(\"hidden\");\n  }\n  $(\"#say\").classList.remove(\"hidden\");\n  $(\"#next\").classList.remove(\"hidden\");\n  say(spoken(it));\n}\n\nfunction voiceUp(u){\n  u.lang=\"en-GB\"; u.rate=.85;\n  const v=speechSynthesis.getVoices().find(v=>/en[-_]/i.test(v.lang));\n  if(v) u.voice=v;\n  return u;\n}\nfunction say(text){\n  if(!(\"speechSynthesis\" in window)) return;\n  speechSynthesis.cancel();\n  speechSynthesis.speak(voiceUp(new SpeechSynthesisUtterance(text)));\n}\n\n/* ---------------- ТЕКСТЫ ДЛЯ ЧТЕНИЯ ВСЛУХ ---------------- */\nlet textIdx=0, speechId=0;\nconst markAll = w => w.replace(/\\[(.+?)\\]/g, \"<em>$1<\/em>\");\nconst NUM_RE = /\\{([^|}]+)\\|([^}]+)\\}/g;              // число в тексте: {как написано|как читается}\nconst wordCount = t => plain(t.replace(NUM_RE, \"$1\")).split(/\\s+/).filter(Boolean).length;\nconst spokenText = t => plain(t.replace(NUM_RE, \"$2\"));\nconst plural = (n, one, few, many) => {\n  const a=n%10, b=n%100;\n  return n + \" \" + (a===1 && b!==11 ? one : (a>=2 && a<=4 && (b<10 || b>=20) ? few : many));\n};\n\nfunction stopSpeech(){\n  speechId++;                                   // старые фразы больше не трогают кнопку\n  if(\"speechSynthesis\" in window) speechSynthesis.cancel();\n  const b=$(\"#tListen\"); if(b) b.textContent=\"Послушать\";\n}\n\nfunction showText(i){\n  const set=SETS[setKey], t=set.blocks[i];\n  stopSpeech(); textIdx=i;\n  $(\"#crumbT\").textContent = set.title + \" · \" + (i+1) + \" из \" + set.blocks.length;\n  $(\"#tTitle\").textContent = t.name;\n  $(\"#tRule\").innerHTML = \"<b>\" + t.rule + \".<\/b> \" + markAll(t.tip);\n  const body=$(\"#tBody\"); body.innerHTML=\"\"; body.classList.remove(\"marked\");\n  const nums=[];                                  // числа текста: [как написано, как читается]\n  const src=t.text.replace(NUM_RE, (m, shown, said) => \"\u0001\" + (nums.push([shown, said])-1) + \"\u0001\");\n  src.split(/\\s+/).forEach((tok, k, arr) => {\n    const sp=document.createElement(\"span\"); sp.className=\"tw\";\n    let w;\n    const nm=tok.match(/\u0001(\\d+)\u0001/);\n    if(nm){                                       // число: на экране цифры, чтение — по кнопке\n      const [shown, said]=nums[+nm[1]];\n      const [pre, post]=tok.split(nm[0]);\n      sp.innerHTML = pre + \"<span class='n'>\" + shown + \"<\/span><span class='rd'>\" + said + \"<\/span>\" + post;\n      w = said;\n    }else{\n      sp.innerHTML=markAll(tok);\n      w=plain(tok).replace(/^[^\\p{L}]+|[^\\p{L}]+$/gu, \"\");   // слово без кавычек и точек\n    }\n    if(w) sp.onclick = () => {\n      stopSpeech(); say(w);\n      sp.classList.add(\"on\"); setTimeout(() => sp.classList.remove(\"on\"), 900);\n    };\n    body.appendChild(sp);\n    if(k<arr.length-1) body.appendChild(document.createTextNode(\" \"));\n  });\n  $(\"#tMark\").textContent = t.text.includes(\"|\") ? \"Как читать числа\" : \"Показать правило\";\n  $(\"#tRu\").textContent=t.ru; $(\"#tRu\").classList.add(\"hidden\");\n  $(\"#tTrans\").textContent=\"Перевод\";\n  $(\"#tNext\").textContent = i<set.blocks.length-1 ? \"Следующий текст\" : \"К списку текстов\";\n  show(\"reader\"); window.scrollTo(0,0);\n}\n\n/* Весь текст звучит по предложениям: длинную фразу Chrome иногда обрывает на середине */\nfunction listenText(){\n  if(!(\"speechSynthesis\" in window)) return;\n  const btn=$(\"#tListen\");\n  if(btn.textContent===\"Остановить\"){ stopSpeech(); return; }\n  stopSpeech();\n  const my=speechId;\n  const parts=spokenText(SETS[setKey].blocks[textIdx].text).split(/(?<=[.!?…])\\s+/).filter(Boolean);\n  btn.textContent=\"Остановить\";\n  parts.forEach((p, k) => {\n    const u=voiceUp(new SpeechSynthesisUtterance(p));\n    if(k===parts.length-1) u.onend = u.onerror = () => { if(my===speechId) btn.textContent=\"Послушать\"; };\n    speechSynthesis.speak(u);\n  });\n}\n\n$(\"#tListen\").onclick = listenText;\n$(\"#tMark\").onclick = () => {\n  const on=$(\"#tBody\").classList.toggle(\"marked\");\n  const nums=SETS[setKey].blocks[textIdx].text.includes(\"|\");\n  $(\"#tMark\").textContent = on ? (nums ? \"Скрыть чтение\" : \"Скрыть правило\")\n                               : (nums ? \"Как читать числа\" : \"Показать правило\");\n};\n$(\"#tTrans\").onclick = () => {\n  const hid=$(\"#tRu\").classList.toggle(\"hidden\");\n  $(\"#tTrans\").textContent = hid ? \"Перевод\" : \"Скрыть перевод\";\n};\n$(\"#tNext\").onclick = () => {\n  passed[setKey+\"-\"+textIdx] = true;            // текст прочитан\n  saveProgress();\n  if(textIdx < SETS[setKey].blocks.length-1) showText(textIdx+1); else startSet(setKey);\n};\n$(\"#tBack\").onclick = () => startSet(setKey);\n\n$(\"#say\").onclick = () => say(spoken(items[idx]));\n$(\"#check\").onclick = checkTyped;\n$(\"#hintBtn\").onclick = showChips;\n$(\"#accept\").onclick = acceptMine;\n$(\"#typed\").addEventListener(\"keydown\", e => {\n  if(e.key!==\"Enter\") return;\n  e.preventDefault();\n  if(answered) $(\"#next\").click(); else checkTyped();\n});\n$(\"#toDrill\").onclick = startDrill;\n$(\"#ruleBack\").onclick = () => startSet(setKey);\n$(\"#blocksBack\").onclick = () => show(\"menu\");\n\n$(\"#next\").onclick = () => {\n  idx++;\n  if(idx < items.length){ render(); return; }\n  if(trening){ finish(); return; }                      // набор закончился — показываем итог\n  if(revising){ revising=false; showRule(); return; }   // прошлое вспомнили — теперь новая тема\n  passed[setKey+\"-\"+blockIdx] = true;          // правило отработано\n  saveProgress();\n  blockIdx++;\n  if(blockIdx < SETS[setKey].blocks.length) openBlock(blockIdx); else finish();\n};\n\nfunction finish(){\n  const set=SETS[setKey];\n  const total = totalAnswered;\n  $(\"#doneTitle\").textContent = (trening ? \"Работа над ошибками\" : set.title) +\n    \": \" + (total-missed.length) + \" из \" + total;\n  const groups={};\n  missed.forEach(m => { (groups[m.group]=groups[m.group]||[]).push(m.word); });\n  const keys=Object.keys(groups);\n  $(\"#doneSub\").textContent = keys.length\n    ? \"Разбирать не каждое слово по отдельности, а вот эти правила:\"\n    : \"Все правила раздела отработаны.\";\n  const box=$(\"#groups\"); box.innerHTML=\"\";\n  keys.forEach(k=>{\n    const d=document.createElement(\"div\"); d.className=\"group\";\n    d.innerHTML='<div class=\"g-rule\">'+k+'<\/div><div class=\"g-words\">'+groups[k].join(\" · \")+'<\/div>';\n    box.appendChild(d);\n  });\n  show(\"done\");\n}\n\n$(\"#again\").onclick = () => trening ? startTrening() : startSet(setKey);\n$(\"#back\").onclick = () => {\n  if(trening){ trening = false; buildMenu(); show(\"menu\"); return; }\n  startSet(setKey);\n};\n\n/* Меню собирается из SETS: звуки, тексты для чтения, грамматика */\nconst MENU = [\n  [\"Чтение и звуки\", [\"types\",\"diph\",\"cons\",\"ege\",\"endings\",\"texts\"]],\n  [\"Школьная программа\", [\"past\"]],\n  [\"Грамматика — по кодификатору ЕГЭ\", [\"sep\",\"oct\",\"nov\",\"dec\",\"jan\",\"feb\",\"mar\",\"apr\",\"kodif\",\"egegram\",\"slovo\"]]\n];\nfunction buildMenu(){\n  const box=$(\"#menuList\"); box.innerHTML=\"\";\n  if(store.active){                      // кто занимается и куда нажать, чтобы сменить\n    const bar=document.createElement(\"div\"); bar.className=\"userbar\";\n    const kto=document.createElement(\"span\");\n    kto.innerHTML = \"Занимается: <b>\" + store.active + \"<\/b>\";\n    const sm=document.createElement(\"button\"); sm.className=\"link\"; sm.textContent=\"сменить ученика\";\n    sm.onclick = pokazatUchenikov;\n    const ot=document.createElement(\"button\"); ot.className=\"link\"; ot.textContent=\"отчёт для репетитора\";\n    ot.onclick = pokazatOtchet;\n    bar.appendChild(kto); bar.appendChild(sm); bar.appendChild(ot);\n    box.appendChild(bar);\n\n    const temy = slabyeTemy();\n    const oshibok = temy.reduce((s, t) => s + t.e.wrong, 0);\n    if(temy.length){                   // пока ошибок нет, повторять нечего\n      const sl = document.createElement(\"button\");\n      sl.className = \"menu-item slaboe\";\n      sl.innerHTML = \"<b>Повторить слабое<\/b><span>Задания из тем, где чаще всего ошибки · \" +\n        plural(temy.length, \"тема\", \"темы\", \"тем\") + \", \" +\n        plural(oshibok, \"ошибка\", \"ошибки\", \"ошибок\") + \"<\/span>\";\n      sl.onclick = startTrening;\n      box.appendChild(sl);\n    }\n  }\n  MENU.forEach(([label, keys]) => {\n    const shown = keys.filter(k => SETS[k]);\n    if(!shown.length) return;\n    const h=document.createElement(\"div\"); h.className=\"menu-group\"; h.textContent=label;\n    box.appendChild(h);\n    shown.forEach(k => {\n      const s=SETS[k];\n      const count = s.kind===\"text\"\n        ? plural(s.blocks.length, \"текст\", \"текста\", \"текстов\")\n        : plural(s.blocks.reduce((sum,b)=>sum+(b.zakryto ? b.n : b.drill.length),0), \"упражнение\", \"упражнения\", \"упражнений\");\n      const doneN = s.blocks.filter((_, i) => passed[k+\"-\"+i]).length;   // сколько тем закрыто\n      const doneTxt = doneN\n        ? ' · <span class=\"done\">' + (s.kind===\"text\" ? \"прочитано \" : \"пройдено \") + doneN + \" из \" + s.blocks.length + \"<\/span>\"\n        : \"\";\n      const btn=document.createElement(\"button\"); btn.className=\"menu-item\" + (s.zakryto ? \" zakryto\" : \"\");\n      btn.innerHTML=\"<b>\"+(s.zakryto ? \"🔒 \" : \"\")+s.title+\"<\/b><span>\"+(s.sub||\"\")+\" · \"+count+doneTxt+\n        (s.zakryto ? ' · <span class=\"zamok\">по подписке<\/span>' : \"\")+\"<\/span>\";\n      btn.onclick=()=> s.zakryto ? pokazatPodpisku() : startSet(k);\n      box.appendChild(btn);\n    });\n  });\n  if(Object.keys(passed).length){            // сбрасывать нечего, пока ничего не пройдено\n    const reset=document.createElement(\"button\");\n    reset.className=\"menu-reset\";\n    reset.textContent=\"Начать сначала — убрать отметки о пройденном\";\n    reset.onclick=()=>{\n      if(!confirm(\"Отметки о пройденном будут стёрты. Сами упражнения останутся.\")) return;\n      Object.keys(passed).forEach(key => delete passed[key]);\n      saveProgress();\n      buildMenu();\n    };\n    box.appendChild(reset);\n  }\n}\n/* Открытая версия сайта: платные темы без заданий, вместо них экран подписки.\n   В полной версии (по личной ссылке) закрытых тем нет, и этот экран не показывается. */\nconst KONTAKT = {tg:\"https://t.me/Julia_2624\", max:\"https://max.ru/u/f9LHodD0cOIni4VD9GPPebr2TL49Ddd1BnD9yRRjR-DYDKCC7k2M3nYzqPA\"};\nlet podpiskaOtkuda = \"menu\";\nfunction pokazatPodpisku(){\n  stopSpeech();\n  podpiskaOtkuda = $(\"#blocks\").classList.contains(\"hidden\") ? \"menu\" : \"blocks\";\n  $(\"#kontaktTg\").href = KONTAKT.tg;\n  $(\"#kontaktMax\").href = KONTAKT.max;\n  cel(\"podpiska\");\n  show(\"podpiska\");\n}\n$(\"#podpiskaBack\").onclick = () => { if(podpiskaOtkuda === \"menu\") buildMenu(); show(podpiskaOtkuda); };\n$(\"#kontaktTg\").onclick = () => cel(\"napisat\");\n$(\"#kontaktMax\").onclick = () => cel(\"napisat\");\n$(\"#kodOtkryt\").onclick = () => {\n  const kod = ($(\"#kodVvod\").value || \"\").toLowerCase().replace(/[^a-z0-9]/g, \"\");\n  if(!kod) return;\n  try{ localStorage.setItem(\"trenazher-dostup\", kod); }catch(e){}\n  location.reload();\n};\n$(\"#addUser\").onclick = dobavitUchenika;\n$(\"#newName\").onkeydown = e => { if(e.key === \"Enter\") dobavitUchenika(); };\n$(\"#reportBack\").onclick = () => { buildMenu(); show(\"menu\"); };\n$(\"#copyReport\").onclick = () => {\n  const ta = $(\"#reportText\");\n  ta.removeAttribute(\"readonly\"); ta.select(); ta.setSelectionRange(0, 99999);\n  let got = false;\n  try { got = document.execCommand(\"copy\"); } catch(e){}\n  if(navigator.clipboard && !got){\n    navigator.clipboard.writeText(ta.value).then(()=>{ $(\"#copyReport\").textContent = \"Скопировано\"; }).catch(()=>{});\n  }\n  ta.setAttribute(\"readonly\", \"readonly\");\n  $(\"#copyReport\").textContent = got ? \"Скопировано\" : \"Выделено — нажми Ctrl+C\";\n  setTimeout(()=>{ $(\"#copyReport\").textContent = \"Скопировать\"; }, 2500);\n};\n\nif(store.active && store.users[store.active]){\n  vybrat(store.active);\n  buildMenu();\n  show(\"menu\");\n}else{\n  pokazatUchenikov();                 // первый вход: сначала спрашиваем, кто занимается\n}\nif(\"speechSynthesis\" in window) speechSynthesis.getVoices();\n<\/script>\n<\/body>\n<\/html>\n";
const LS = "trenazher-dostup";
const enc = new TextEncoder();
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = (u, n) => Array.from(u.slice(0, n), x => x.toString(16).padStart(2, "0")).join("");
const sha = async s => new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(s)));
const chist = k => (k || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const napisat = html => { document.open(); document.write(html); document.close(); };

async function polnaya(kod){
  const v = D.v[hex(await sha("id:" + kod), 8)];
  if(!v) return null;
  try{
    const P = await (await fetch("polny.txt?" + D.sb, {cache:"no-store"})).json();
    const base = await crypto.subtle.importKey("raw", enc.encode(kod), "PBKDF2", false, ["deriveKey"]);
    const kk = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(v[0]), iterations:D.it, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const syroy = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(v[1])}, kk, b(v[2]));
    const kluch = await crypto.subtle.importKey("raw", syroy, "AES-GCM", false, ["decrypt"]);
    let html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.iv)}, kluch, b(P.s)));
    // метка ученика в Метрике: одна ссылка на многих устройствах = ссылку передали
    const m = hex(await sha("metka:" + kod), 4);
    return html.replace("</body>", "<script>try{ym(" + D.m + ",'userParams',{dostup:'" + m + "'})}catch(e){}<\/script></body>");
  }catch(e){ return null; }
}

// document.write заменяет страницу, только когда браузер её дочитал, иначе дописывает снизу — ждём DOMContentLoaded
async function start(){
  let kod = chist(decodeURIComponent(location.hash.slice(1)));
  let izPamyati = false;
  if(!kod){ try{ kod = chist(localStorage.getItem(LS)); izPamyati = true; }catch(e){} }
  if(kod){
    const html = await polnaya(kod);
    if(html){
      try{ localStorage.setItem(LS, kod); }catch(e){}
      if(location.hash) history.replaceState(null, "", location.pathname + location.search);
      return napisat(html);
    }
    try{ localStorage.removeItem(LS); }catch(e){}
    if(location.hash) history.replaceState(null, "", location.pathname + location.search);
    const t = izPamyati ? "Ваша ссылка больше не открывает полный тренажёр, возможно, закончилась подписка. Открыта бесплатная часть."
                        : "Код не подходит, проверьте ссылку. Открыта бесплатная часть.";
    return napisat(OTKRYTO.replace("<body>", "<body><div onclick=\"this.remove()\" style=\"background:#8c3b2f;color:#fff;" +
      "padding:12px 16px;font:15px/1.4 system-ui,sans-serif;cursor:pointer\">" + t + " ✕</div>"));
  }
  napisat(OTKRYTO);
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
