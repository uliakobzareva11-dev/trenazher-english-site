УПРАЖНЕНИЕ -->\n  <section id=\"card\" class=\"hidden\">\n    <div class=\"crumb\" id=\"crumb2\"><\/div>\n    <div class=\"bar\"><i id=\"prog\"><\/i><\/div>\n    <div class=\"word\" id=\"word\"><\/div>\n    <p class=\"ask\" id=\"ask\">Как читается выделенная часть?<\/p>\n    <div id=\"opts\"><\/div>\n    <div id=\"typeBox\" class=\"hidden\">\n      <input id=\"typed\" type=\"text\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"впиши слово\">\n      <div class=\"tiprow\" id=\"tiprow\">\n        <button class=\"btn main\" id=\"check\">Проверить<\/button>\n        <button class=\"btn\" id=\"hintBtn\">Подсказка<\/button>\n      <\/div>\n      <div id=\"chips\" class=\"chips hidden\"><\/div>\n      <p class=\"note\">Enter тоже проверяет. Если слово не нужно — поставь дефис.<\/p>\n    <\/div>\n    <div id=\"hint\" class=\"hint hidden\"><\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"say\">Послушать<\/button>\n      <button class=\"btn hidden\" id=\"accept\">Мой ответ тоже верный<\/button>\n      <button class=\"btn main hidden\" id=\"next\">Дальше<\/button>\n    <\/div>\n  <\/section>\n\n  <!-- ЭКРАН 4: ИТОГ -->\n  <section id=\"done\" class=\"hidden done\">\n    <h2 id=\"doneTitle\"><\/h2>\n    <p class=\"quiet\" id=\"doneSub\"><\/p>\n    <div id=\"groups\"><\/div>\n    <div class=\"row\">\n      <button class=\"btn main\" id=\"again\">Пройти раздел ещё раз<\/button>\n    <\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"back\">К списку правил<\/button>\n    <\/div>\n  <\/section>\n\n  <!-- ЭКРАН 5: ТЕКСТ ДЛЯ ЧТЕНИЯ ВСЛУХ -->\n  <section id=\"reader\" class=\"hidden\">\n    <div class=\"crumb\" id=\"crumbT\"><\/div>\n    <h2 class=\"rule-name\" id=\"tTitle\"><\/h2>\n    <p class=\"t-rule\" id=\"tRule\"><\/p>\n    <p class=\"quiet\">Сначала прочитай вслух сам. Потом нажми «Послушать» и сравни. Если сомневаешься в слове — нажми на него, оно прозвучит отдельно.<\/p>\n    <div class=\"t-body\" id=\"tBody\"><\/div>\n    <p class=\"t-ru hidden\" id=\"tRu\"><\/p>\n    <div class=\"row\">\n      <button class=\"btn main\" id=\"tListen\">Послушать<\/button>\n      <button class=\"btn\" id=\"tMark\">Показать правило<\/button>\n    <\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"tTrans\">Перевод<\/button>\n      <button class=\"btn\" id=\"tNext\">Следующий текст<\/button>\n    <\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"tBack\">К списку текстов<\/button>\n    <\/div>\n  <\/section>\n\n  <footer>Звуки — по перечню ФИПИ. Грамматика — по кодификатору ЕГЭ ФИПИ.<\/footer>\n<\/div>\n\n<script>\n/* ============================================================\n   СТРУКТУРА: раздел → блоки. Блок = ПРАВИЛО + отработка.\n   Сначала объяснение, потом упражнения на него.\n   ============================================================\n   В explain: <span class=\"key\">…<\/span> подсвечивает главное.\n   В словах квадратные скобки выделяют нужную часть: c[u]p\n   ru — опора на русский звук (как объясняет Юля)\n*/\n/* Звуки: wrong — [звук, пример, почему этот вариант неверный]; why — почему верен правильный звук.\n   При ошибке подсказка = заметка к выбранному варианту + why. */\nconst SETS = {\"types\":{\"kind\":\"phon\",\"title\":\"Четыре типа чтения\",\"sub\":\"Открытый слог, закрытый, гласная + r + согласная, гласная + r + гласная\",\"blocks\":[{\"name\":\"Закрытый слог\",\"explain\":[\"<span class='h'>Что это<\/span>Закрытый слог <span class='key'>заканчивается на согласную<\/span>: после гласной стоит согласная, и слог на ней обрывается. cat, pen, big, box, cup — всё это закрытые слоги.\",\"<span class='h'>Как читается<\/span>Гласная звучит <span class='key'>кратко<\/span>, не так, как она называется в алфавите: a — [æ] как в cat, e — [e] как в pen, i — [ɪ] как в big, o — [ɒ] как в box, u — [ʌ] как в cup, y — [ɪ] как в gym: y читается так же, как i.\",\"<span class='h'>Как звучат по-русски<\/span>[æ] — между «а» и «э», рот открыт шире, чем для «э». [e] — почти «э». [ɪ] — между «и» и «ы». [ɒ] — короткое открытое «о». [ʌ] — короткое «а».\",\"<span class='h'>Как узнать на письме<\/span>После гласной одна или несколько согласных, и в конце нет немой e: hat, but, stop, lamp. Удвоенная согласная тоже держит слог закрытым: apple, happy, dinner.\",\"<span class='h'>Ловушка<\/span>Стоит добавить к слову немую e, и слог становится открытым, а звук меняется: hat — hate, pin — pine, hop — hope. Всегда смотри, есть ли e на конце.\",\"<span class='h'>Как тренировать<\/span>Читай пары подряд: cap — cape, kit — kite, not — note, cut — cute. Первое слово — закрытый слог, второе — открытый.\"],\"examples\":[{\"w\":\"c[u]p\",\"ipa\":\"[ʌ]\",\"ru\":\"близко к русскому а\"},{\"w\":\"c[a]t\",\"ipa\":\"[æ]\",\"ru\":\"между а и э\"},{\"w\":\"p[e]n\",\"ipa\":\"[e]\",\"ru\":\"как э\"},{\"w\":\"b[i]g\",\"ipa\":\"[ɪ]\",\"ru\":\"короткое и\"},{\"w\":\"b[o]x\",\"ipa\":\"[ɒ]\",\"ru\":\"короткое о\"},{\"w\":\"g[y]m\",\"ipa\":\"[ɪ]\",\"ru\":\"короткое и — y читается как i\"}],\"drill\":[{\"word\":\"c[u]p\",\"ipa\":\"[ʌ]\",\"ex\":\"как в but\",\"wrong\":[[\"[juː]\",\"как в tune\",\"[juː] — так u читается в открытом слоге, когда на конце немая e: tune, cute.\"],[\"[ʊ]\",\"как в book\",\"[ʊ] — короткое «у»: его дают oo перед k (book) и u в нескольких словах вроде put, pull.\"]],\"why\":\"В cup после u стоит согласная p, немой e на конце нет: слог закрытый, u читается кратко — [ʌ].\"},{\"word\":\"c[a]t\",\"ipa\":\"[æ]\",\"ex\":\"как в bad\",\"wrong\":[[\"[eɪ]\",\"как в name\",\"[eɪ] — так a читается в открытом слоге, с немой e на конце: name, late.\"],[\"[ɑː]\",\"как в car\",\"[ɑː] — долгое «а», его даёт ar: car, park. Здесь после a нет r.\"]],\"why\":\"В cat после a стоит согласная t, немой e нет: слог закрытый, a читается кратко — [æ].\"},{\"word\":\"p[e]n\",\"ipa\":\"[e]\",\"ex\":\"как в bed\",\"wrong\":[[\"[iː]\",\"как в see\",\"[iː] — долгое «и»: его дают ee (see) и e в открытом слоге (he, Pete).\"],[\"[ɜː]\",\"как в her\",\"[ɜː] дают er, ir, ur — гласная с r после неё. Здесь после e нет r.\"]],\"why\":\"В pen после e стоит согласная n: слог закрытый, e читается кратко — [e].\"},{\"word\":\"b[i]g\",\"ipa\":\"[ɪ]\",\"ex\":\"как в sit\",\"wrong\":[[\"[aɪ]\",\"как в nine\",\"[aɪ] — так i читается в открытом слоге, с немой e на конце: nine, time.\"],[\"[iː]\",\"как в see\",\"[iː] — долгое «и» из ee и ea: see, sea.\"]],\"why\":\"В big после i стоит согласная g: слог закрытый, i читается кратко — [ɪ].\"},{\"word\":\"b[o]x\",\"ipa\":\"[ɒ]\",\"ex\":\"как в hot\",\"wrong\":[[\"[əʊ]\",\"как в note\",\"[əʊ] — так o читается в открытом слоге, с немой e на конце: note, home.\"],[\"[uː]\",\"как в too\",\"[uː] — долгое «у», его даёт двойная oo: too, food. Здесь o одна.\"]],\"why\":\"В box после o стоит согласная x: слог закрытый, o читается кратко — [ɒ].\"},{\"word\":\"r[u]n\",\"ipa\":\"[ʌ]\",\"ex\":\"как в cup\",\"wrong\":[[\"[uː]\",\"как в too\",\"[uː] — долгое «у», его даёт двойная oo: too, food.\"],[\"[juː]\",\"как в tune\",\"[juː] — так u читается в открытом слоге, с немой e на конце: tune, cute.\"]],\"why\":\"В run после u стоит согласная n: слог закрытый, u читается кратко — [ʌ].\"},{\"word\":\"h[a]t\",\"ipa\":\"[æ]\",\"ex\":\"как в cat\",\"wrong\":[[\"[eɪ]\",\"как в name\",\"[eɪ] — так a читается в открытом слоге, с немой e на конце: hate, name.\"],[\"[ɑː]\",\"как в car\",\"[ɑː] — долгое «а», его даёт ar: car, park. Здесь после a нет r.\"]],\"why\":\"В hat после a стоит согласная t, немой e нет: слог закрытый — [æ]. С немой e получится hate, и звук станет [eɪ].\"},{\"word\":\"s[i]t\",\"ipa\":\"[ɪ]\",\"ex\":\"как в big\",\"wrong\":[[\"[aɪ]\",\"как в nine\",\"[aɪ] — так i читается в открытом слоге, с немой e: с ним получится site «сайт».\"],[\"[iː]\",\"как в see\",\"[iː] — долгое «и» из ee и ea: с ним получится seat «сиденье».\"]],\"why\":\"В sit после i стоит согласная t: слог закрытый, i читается кратко — [ɪ].\"},{\"word\":\"b[e]d\",\"ipa\":\"[e]\",\"ex\":\"как в pen\",\"wrong\":[[\"[iː]\",\"как в see\",\"[iː] — долгое «и» из ee: с ним получится bead «бусина».\"],[\"[ɪ]\",\"как в big\",\"[ɪ] — так в закрытом слоге читается i, а не e: с ним получится другое слово — bid.\"]],\"why\":\"В bed после e стоит согласная d: слог закрытый, e читается кратко — [e].\"},{\"word\":\"st[o]p\",\"ipa\":\"[ɒ]\",\"ex\":\"как в box\",\"wrong\":[[\"[əʊ]\",\"как в note\",\"[əʊ] — так o читается в открытом слоге, с немой e на конце: note, hope.\"],[\"[ɔː]\",\"как в for\",\"[ɔː] — долгое «о», его даёт or: for, fork. Здесь после o нет r.\"]],\"why\":\"В stop после o стоит согласная p: слог закрытый, o читается кратко — [ɒ].\"},{\"word\":\"b[u]s\",\"ipa\":\"[ʌ]\",\"ex\":\"как в cup\",\"wrong\":[[\"[ʊ]\",\"как в book\",\"[ʊ] — короткое «у»: его дают oo перед k (book) и u в нескольких словах вроде put, pull. bus к ним не относится.\"],[\"[uː]\",\"как в too\",\"[uː] — долгое «у», его даёт двойная oo: too, food.\"]],\"why\":\"В bus после u стоит согласная s: слог закрытый, u читается кратко — [ʌ].\"},{\"word\":\"m[a]p\",\"ipa\":\"[æ]\",\"ex\":\"как в cat\",\"wrong\":[[\"[eɪ]\",\"как в name\",\"[eɪ] — так a читается в открытом слоге, с немой e на конце: name, cape.\"],[\"[e]\",\"как в pen\",\"[e] — так в закрытом слоге читается e: pen, bed. У a звук шире — [æ], рот открыт больше.\"]],\"why\":\"В map после a стоит согласная p: слог закрытый, a читается кратко — [æ].\"},{\"word\":\"s[y]mbol\",\"ipa\":\"[ɪ]\",\"ex\":\"как в big\",\"wrong\":[[\"[aɪ]\",\"как в my\",\"[aɪ] — так y звучит в открытом слоге: my, type. Здесь после y согласная, слог закрытый.\"],[\"[j]\",\"как в yes\",\"[j] — так y читается в начале слова перед гласной: yes, you. Здесь y между согласными.\"]],\"why\":\"В sym- после y согласная m: слог закрытый, y читается как i в big — [ɪ].\"},{\"word\":\"cr[y]stal\",\"ipa\":\"[ɪ]\",\"ex\":\"как в big\",\"wrong\":[[\"[aɪ]\",\"как в my\",\"[aɪ] — так y звучит в открытом слоге: my, type. Здесь после y согласная, слог закрытый.\"],[\"[i]\",\"как в happy\",\"[i] — короткое «и» на конце длинного слова без ударения: happy, city.\"]],\"why\":\"В crys- после y согласная s: слог закрытый — [ɪ].\"}]},{\"name\":\"Открытый слог\",\"explain\":[\"<span class='h'>Что это<\/span>Открытый слог <span class='key'>кончается на гласную<\/span>: he, go, me. Или за гласной стоит одна согласная и немая e: name, nine, note.\",\"<span class='h'>Как читается<\/span>Гласная звучит <span class='key'>так, как называется в алфавите<\/span>: a — [eɪ] как в name, e — [iː] как в Pete, i — [aɪ] как в nine, o — [əʊ] как в note, u — [juː] как в tune, y — [aɪ] как в my и type: y читается так же, как i.\",\"<span class='h'>Немая e<\/span>Буква e в конце слова <span class='key'>сама не читается<\/span>. Её задача — открыть слог, чтобы гласная звучала «по алфавиту». Сравни: rat — rate, bit — bite.\",\"<span class='h'>В длинных словах<\/span>Если после гласной одна согласная, а дальше снова гласная, слог обычно тоже открытый: pa-per, ti-ger, mu-sic, ho-tel.\",\"<span class='h'>Ловушка<\/span>После r, l и j буква u часто читается [uː], без «й»: June, rule. И есть частые слова-исключения, где e на конце, а гласная краткая: have, give, come, done. Их проще запомнить.\",\"<span class='h'>Как тренировать<\/span>Читай пары: hat — hate, pin — pine, hop — hope, us — use. Во втором слове немая e открывает слог.\"],\"examples\":[{\"w\":\"n[a]me\",\"ipa\":\"[eɪ]\",\"ru\":\"эй — как буква A\"},{\"w\":\"P[e]te\",\"ipa\":\"[iː]\",\"ru\":\"долгое и — как буква E\"},{\"w\":\"n[i]ne\",\"ipa\":\"[aɪ]\",\"ru\":\"ай — как буква I\"},{\"w\":\"n[o]te\",\"ipa\":\"[əʊ]\",\"ru\":\"оу — как буква O\"},{\"w\":\"t[u]ne\",\"ipa\":\"[juː]\",\"ru\":\"ю — как буква U\"},{\"w\":\"m[y]\",\"ipa\":\"[aɪ]\",\"ru\":\"ай — y как буква I\"}],\"drill\":[{\"word\":\"n[a]me\",\"ipa\":\"[eɪ]\",\"ex\":\"как в day\",\"wrong\":[[\"[æ]\",\"как в cat\",\"[æ] — так a читается в закрытом слоге, без немой e на конце: cat, man.\"],[\"[ɑː]\",\"как в car\",\"[ɑː] даёт ar: car, park. Здесь после a нет r.\"]],\"why\":\"В name за a одна согласная m и немая e: слог открытый, a читается как в алфавите — [eɪ].\"},{\"word\":\"P[e]te\",\"ipa\":\"[iː]\",\"ex\":\"как в see\",\"wrong\":[[\"[e]\",\"как в pen\",\"[e] — так e читается в закрытом слоге, без немой e на конце: pen, pet.\"],[\"[ɜː]\",\"как в her\",\"[ɜː] дают er, ir, ur. Здесь после e нет r.\"]],\"why\":\"В Pete за e одна согласная t и немая e: слог открытый, e читается как в алфавите — [iː].\"},{\"word\":\"n[i]ne\",\"ipa\":\"[aɪ]\",\"ex\":\"как в my\",\"wrong\":[[\"[ɪ]\",\"как в big\",\"[ɪ] — так i читается в закрытом слоге, без немой e на конце: big, pin.\"],[\"[iː]\",\"как в see\",\"[iː] — так в алфавите называется буква e, а не i.\"]],\"why\":\"В nine за i одна согласная n и немая e: слог открытый, i читается как в алфавите — [aɪ].\"},{\"word\":\"n[o]te\",\"ipa\":\"[əʊ]\",\"ex\":\"как в go\",\"wrong\":[[\"[ɒ]\",\"как в box\",\"[ɒ] — так o читается в закрытом слоге, без немой e: box, not.\"],[\"[ɔː]\",\"как в for\",\"[ɔː] — долгое «о», его даёт or: for, fork. Здесь после o нет r.\"]],\"why\":\"В note за o одна согласная t и немая e: слог открытый, o читается как в алфавите — [əʊ].\"},{\"word\":\"t[u]ne\",\"ipa\":\"[juː]\",\"ex\":\"как в music\",\"wrong\":[[\"[ʌ]\",\"как в cup\",\"[ʌ] — так u читается в закрытом слоге, без немой e на конце: cup, but.\"],[\"[ʊ]\",\"как в book\",\"[ʊ] — короткое «у» из oo перед k: book, look.\"]],\"why\":\"В tune за u одна согласная n и немая e: слог открытый, u читается как в алфавите — [juː].\"},{\"word\":\"h[o]me\",\"ipa\":\"[əʊ]\",\"ex\":\"как в note\",\"wrong\":[[\"[ɒ]\",\"как в box\",\"[ɒ] — так o читается в закрытом слоге, без немой e: box, hot.\"],[\"[uː]\",\"как в too\",\"[uː] — долгое «у» из двойной oo: too, food.\"]],\"why\":\"В home за o одна согласная m и немая e: слог открытый — [əʊ].\"},{\"word\":\"l[a]ke\",\"ipa\":\"[eɪ]\",\"ex\":\"как в name\",\"wrong\":[[\"[æ]\",\"как в cat\",\"[æ] — так a читается в закрытом слоге, без немой e: cat, back.\"],[\"[ɑː]\",\"как в car\",\"[ɑː] даёт ar: car, park. Здесь посл [θ] — без голоса, как шёпот: think, three, bath. [ð] — язык тот же, но с голосом: this, the, mother. Приложи ладонь к горлу: на [ð] чувствуется дрожь, на [θ] её нет.\",\"<span class='h'>Как узнать на письме<\/span>Буквы одни и те же — th, поэтому звук подсказывает само слово. Звонкий [ð] обычно в служебных словах (the, this, that, they, them, there, with) и между гласными (mother, brother). Глухой [θ] — в начале и в конце знаменательных слов: think, three, month, bath.\",\"<span class='h'>Как поймать ошибку у себя<\/span>Запиши на телефон, как читаешь фразу «I think this is the third thing», и послушай. Если слышишь «синк» или «зис» — язык остался за зубами. Потренируйся: скажи долгое «с» и медленно выдвигай язык вперёд, пока кончик не окажется между зубами, — звук сам станет [θ]. С «з» так же получится [ð].\"],\"examples\":[{\"w\":\"[th]ink\",\"ipa\":\"[θ]\",\"ru\":\"не sink!\"},{\"w\":\"[th]ick\",\"ipa\":\"[θ]\",\"ru\":\"не sick!\"},{\"w\":\"[th]ree\",\"ipa\":\"[θ]\",\"ru\":\"не tree и не free\"},{\"w\":\"[th]is\",\"ipa\":\"[ð]\",\"ru\":\"звонкий, не zis\"},{\"w\":\"[th]e\",\"ipa\":\"[ð]\",\"ru\":\"звонкий, самое частое слово\"},{\"w\":\"brea[th]e\",\"ipa\":\"[ð]\",\"ru\":\"звонкий\"}],\"drill\":[{\"word\":\"[th]ink\",\"ipa\":\"[θ]\",\"ex\":\"межзубный глухой\",\"wrong\":[[\"[s]\",\"получится sink\",\"Язык остался за зубами — вышло sink «тонуть». Это ошибка, искажающая смысл.\"],[\"[ð]\",\"звонкий\",\"[ð] — с голосом, он в служебных словах: this, the.\"]],\"why\":\"Межзубный глухой [θ]: кончик языка между зубами, без голоса.\"},{\"word\":\"[th]ick\",\"ipa\":\"[θ]\",\"ex\":\"межзубный глухой\",\"wrong\":[[\"[s]\",\"получится sick\",\"Язык остался за зубами — вышло sick «больной». Это ошибка, искажающая смысл.\"],[\"[t]\",\"т\",\"Язык упёрся в зубы — вышло tick «галочка». Для th воздух идёт через щель между языком и зубами.\"]],\"why\":\"Межзубный глухой [θ]: кончик языка между зубами, без голоса.\"},{\"word\":\"[th]is\",\"ipa\":\"[ð]\",\"ex\":\"межзубный звонкий\",\"wrong\":[[\"[z]\",\"получится zis\",\"Язык остался за зубами — вышло «зис». Смысл не меняется, но это фонетическая ошибка, а this и the в тексте встречаются постоянно.\"],[\"[θ]\",\"глухой\",\"[θ] — глухой, без голоса: так th читается в think.\"]],\"why\":\"Межзубный звонкий [ð]: язык между зубами, с голосом.\"},{\"word\":\"[th]ree\",\"ipa\":\"[θ]\",\"ex\":\"межзубный глухой\",\"wrong\":[[\"[s]\",\"получится sree\",\"Язык остался за зубами — вышло «сри».\"],[\"[tr]\",\"тр\",\"С «тр» получится tree «дерево» — ошибка, искажающая смысл.\"]],\"why\":\"Межзубный глухой [θ]: кончик языка между зубами, без голоса.\"},{\"word\":\"brea[th]e\",\"ipa\":\"[ð]\",\"ex\":\"звонкий\",\"wrong\":[[\"[θ]\",\"глухой — получится breath\",\"С глухим [θ] получится breath «дыхание» — другое слово.\"],[\"[z]\",\"з\",\"Язык остался за зубами — получилось «з» вместо [ð].\"]],\"why\":\"breathe «дышать» — th перед немой e звонкий: [ð].\"},{\"word\":\"[th]anks\",\"ipa\":\"[θ]\",\"ex\":\"межзубный глухой\",\"wrong\":[[\"[s]\",\"получится «санкс»\",\"Язык остался за зубами. На слух это ошибка произношения, её замечают сразу.\"],[\"[t]\",\"т\",\"Язык упёрся в зубы — вышло «танкс».\"]],\"why\":\"В thanks кончик языка между зубами, воздух идёт без голоса.\"},{\"word\":\"nor[th]\",\"ipa\":\"[θ]\",\"ex\":\"глухой на конце\",\"wrong\":[[\"[s]\",\"получится «норс»\",\"Язык за зубами — вместо north вышло другое звучание.\"],[\"[f]\",\"ф\",\"Зубы на губе — вышло «норф». Частая замена, её слышно сразу.\"]],\"why\":\"На конце слова th тоже межзубный: north, bath, month.\"},{\"word\":\"mon[th]\",\"ipa\":\"[θ]\",\"ex\":\"глухой на конце\",\"wrong\":[[\"[s]\",\"получится «монс»\",\"Язык остался за зубами.\"],[\"[t]\",\"т\",\"С «т» выйдет «монт»: язык упёрся в зубы вместо того, чтобы пройти между ними.\"]],\"why\":\"month — глухой [θ]. Во множественном months звук сохраняется.\"},{\"word\":\"[th]ose\",\"ipa\":\"[ð]\",\"ex\":\"звонкий\",\"wrong\":[[\"[z]\",\"получится «зоуз»\",\"Язык остался за зубами. Нужен межзубный с голосом.\"],[\"[θ]\",\"глухой\",\"[θ] — в знаменательных словах: think, three. those — указательное, оно звонкое.\"]],\"why\":\"those, these, this, that — звонкий межзубный [ð].\"},{\"word\":\"wea[th]er\",\"ipa\":\"[ð]\",\"ex\":\"звонкий между гласными\",\"wrong\":[[\"[z]\",\"получится «уэзер»\",\"Типичная замена: язык за зубами вместо межзубного положения.\"],[\"[θ]\",\"глухой\",\"Между гласными th звонкий: weather, mother, father.\"]],\"why\":\"weather — звонкий [ð]. Звучит так же, как whether «ли».\"}]},{\"name\":\"w и v — разные звуки\",\"explain\":[\"<span class='h'>Чем грозит на ЕГЭ<\/span>ФИПИ требует <span class='key'>различать губно-губной [w] и губно-зубной [v]<\/span>. В русском звука [w] нет, и его заменяют на «в». Тогда west превращается в vest «жилет», а wine — в vine «лоза». Слово меняется — ошибка искажает смысл.\",\"<span class='h'>Как произносить [w]<\/span>Зубы в этом звуке не участвуют совсем. Вытяни губы трубочкой, как для русского «у», и сразу разведи их, переходя к следующей гласной: we звучит почти как быстрое «уи», wine — как «уайн».\",\"<span class='h'>Как произносить [v]<\/span>Верхние зубы слегка касаются нижней губы, воздух проходит между ними с голосом. Это почти русское «в»: very, village, seven.\",\"<span class='h'>Как узнать на письме<\/span>[w] пишется буквой w и сочетанием wh: we, what, when, white. Ещё он прячется в qu — quick читается [kwɪk] — и в слове one [wʌn]. [v] — только буква v.\",\"<span class='h'>Как поймать ошибку у себя<\/span>Читай перед зеркалом: если на [w] верхние зубы коснулись губы, получился [v]. Тренируй пары подряд — west и vest, wine и vine, wet и vet, — а потом фразу, где звуки идут вперемешку: «We visit the village every week».\"],\"examples\":[{\"w\":\"[w]est\",\"ipa\":\"[w]\",\"ru\":\"губы трубочкой · vest — зубы на губе\"},{\"w\":\"[w]ine\",\"ipa\":\"[w]\",\"ru\":\"не vine!\"},{\"w\":\"[w]et\",\"ipa\":\"[w]\",\"ru\":\"«мокрый» · vet «ветеринар» — [v]\"},{\"w\":\"[wh]at\",\"ipa\":\"[w]\",\"ru\": .\"]],\"why\":\"Буква v всегда [v]: верхние зубы касаются нижней губы, голос звучит.\"},{\"word\":\"[w]ork\",\"ipa\":\"[w]\",\"ex\":\"губно-губной\",\"wrong\":[[\"[v]\",\"в\",\"Зубы коснулись губы — вышло «ворк». Для [w] губы вытянуты трубочкой.\"],[\"[u]\",\"у\",\"«у» — только начало звука: [w] короткий и сразу переходит в гласную.\"]],\"why\":\"w читается [w]: work, we, want. Зубы в этом звуке не участвуют.\"},{\"word\":\"[v]isit\",\"ipa\":\"[v]\",\"ex\":\"губно-зубной\",\"wrong\":[[\"[w]\",\"получится «уизит»\",\"Губы трубочкой — так читается w, а не v.\"],[\"[f]\",\"ф\",\"Тот же уклад, но глухой — вышло «физит».\"]],\"why\":\"v — всегда [v], в начале слова тоже: visit, very, village.\"},{\"word\":\"[w]orld\",\"ipa\":\"[w]\",\"ex\":\"губно-губной\",\"wrong\":[[\"[v]\",\"в\",\"Зубы на губе — вышло «ворлд». Для [w] зубы не нужны.\"],[\"[b]\",\"б\",\"На «б» губы смыкаются полностью, а на [w] вытягиваются трубочкой.\"]],\"why\":\"world начинается с [w], дальше идёт [ɜː]: после w сочетание or даёт именно его.\"},{\"word\":\"[v]oice\",\"ipa\":\"[v]\",\"ex\":\"губно-зубной\",\"wrong\":[[\"[w]\",\"получится «уойс»\",\"Так читается w. Буква v требует зубов на губе.\"],[\"[f]\",\"ф\",\"[f] — то же положение, но без голоса.\"]],\"why\":\"voice — [v], дальше дифтонг [ɔɪ]: oi читается «ой».\"}]},{\"name\":\"[ɔː] и [ɜː] — walk и work\",\"explain\":[\"<span class='h'>Чем грозит на ЕГЭ<\/span>ФИПИ приводит эту пару отдельно: <span class='key'>walk — work, form — firm<\/span>. Звуки близкие, а слова разные: «идти пешком» и «работа», «форма» и «фирма». Перепутал — ошибка, искажающая смысл.\",\"<span class='h'>Как произносить [ɔː]<\/span>Губы округлены и немного вытянуты, как для русского «о», звук долгий: walk, form, more, four.\",\"<span class='h'>Как произносить [ɜː]<\/span>Губы не округляй — они спокойные, чуть растянуты. Язык лежит посередине рта. Звук средний между «э» и «ё», но без округления губ: work, firm, bird, learn.\",\"<span class='h'>Как узнать на письме<\/span>[ɔː] дают or и ore (form, more), al перед k (walk, talk), aw (saw), our в слове four. [ɜː] дают er, ir, ur перед согласной (term, bird, turn) и чаще всего ear перед согласной (learn, early).\",\"Почему work читается не как fork: после <span class='key'>w<\/span> сочетание <span class='key'>or<\/span> обычно даёт [ɜː] — work, word, world, worse. А в walk и talk буквы <span class='key'>al<\/span> читаются [ɔː], l не произносится.\",\"<span class='h'>Как поймать ошибку у себя<\/span>Если округлить губы и на [ɜː], work прозвучит как walk. Посмотри в зеркало: на [ɜː] губы в лёгкой улыбке, на [ɔː] вытянуты вперёд. Читай пары подряд: walk — work, form — firm, short — shirt, born — burn.\"],\"examples\":[{\"w\":\"w[al]k\",\"ipa\":\"[ɔː]\",\"ru\":\"о · «идти пешком»\"},{\"w\":\"w[or]k\",\"ipa\":\"[ɜː]\",\"ru\":\"ё · «работа»\"},{\"w\":\"f[or]m\",\"ipa\":\"[ɔː]\",\"ru\":\"о · «форма»\"},{\"w\":\"f[ir]m\",\"ipa\":\"[ɜː]\",\"ru\":\"ё · «фирма»\"},{\"w\":\"b[or]n\",\"ipa\":\"[ɔː]\",\"ru\":\"о · «родился»\"},{\"w\":\"b[ur]n\",\"ipa\":\"[ɜː]\",\"ru\":\"ё · «гореть»\"}],\"drill\":[{\"word\":\"w[al]k\",\"ipa\":\"[ɔː]\",\"ex\":\"как в more\",\"wrong\":[[\"[ɜː]\",\"получится work\",\"Губы не округлились — вышло work «работа». Это ошибка, искажающая смысл.\"],[\"[æ]\",\"как в cat\",\"[æ] — одна a в закрытом слоге: cat.\"]],\"why\":\"al перед k читается [ɔː], l молчит: walk, talk.\"},{\"word\":\"w[or]k\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"получится walk\",\"Губы округлились — вышло walk «идти пешком».\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — одна o в закрытом слоге без r: box.\"]],\"why\":\"После w сочетание or читается [ɜː]: work, word, world.\"},{\"word\":\"f[or]m\",\"ipa\":\"[ɔː]\",\"ex\":\"как в more\",\"wrong\":[[\"[ɜː]\",\"получится firm\",\"Губы не округлились — вышло firm «фирма». Это ошибка, искажающая смысл.\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — краткое, одна o без r: box.\"]],\"why\":\"or перед согласной — долгое [ɔː], губы округлены: form «форма».\"},{\"word\":\"f[ir]m\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"получится form\",\"Губы округлились — вышло form «форма». Это ошибка, искажающая смысл.\"],[\"[ɪ]\",\"как в big\",\"[ɪ] — краткое, одна i без r: big.\"]],\"why\":\"ir перед согласной — долгое [ɜː], губы спокойные: firm «фирма».\"},{\"word\":\"sh[ir]t\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"как в short\",\"С [ɔː] получится short «короткий» — ошибка, искажающая смысл.\"],[\"[ɪ]\",\"как в big\",\"[ɪ] — краткое, одна i без r: big, sit.\"]],\"why\":\"ir перед согласной — долгое [ɜː]: shirt «рубашка».\"},{\"word\":\"t[al]k\",\"ipa\":\"[ɔː]\",\"ex\":\"как в walk\",\"wrong\":[[\"[ɜː]\",\"как в work\",\"Губы не округлились — звук ушёл в сторону work.\"],[\"[æ]\",\"как в cat\",\"[æ] — одна a в закрытом слоге. В сочетании al перед k буква l молчит, а a даёт [ɔː].\"]],\"why\":\"talk, walk, chalk: l не читается, гласная долгая и округлая [ɔː].\"},{\"word\":\"sp[or]t\",\"ipa\":\"[ɔː]\",\"ex\":\"как в more\",\"wrong\":[[\"[ɜː]\",\"как в her\",\"[ɜː] дают er, ir, ur: her, firm, turn.\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — краткое, одна o без r: box, got.\"]],\"why\":\"or под ударением — долгое округлое [ɔː]: sport, form, short.\"},{\"word\":\"w[or]d\",\"ipa\":\"[ɜː]\",\"ex\":\"после w\",\"wrong\":[[\"[ɔː]\",\"как в more\",\"[ɔː] — обычное чтение or: form, sport. Но после w сочетание or даёт [ɜː].\"],[\"[ɒ]\",\"как в box\",\"[ɒ] — одна o без r: box, got.\"]],\"why\":\"После w сочетание or читается [ɜː]: word, work, world, worse.\"},{\"word\":\"b[ir]d\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"как в more\",\"[ɔː] даёт or: form, sport. Губы здесь не округляются.\"],[\"[aɪ]\",\"как в my\",\"[aɪ] — i в открытом слоге: five, time. Здесь после i стоит r.\"]],\"why\":\"ir под ударением — [ɜː]: bird, firm, shirt.\"},{\"word\":\"t[ur]n\",\"ipa\":\"[ɜː]\",\"ex\":\"как в her\",\"wrong\":[[\"[ɔː]\",\"как в more\",\"С округлыми губами получится torn «порванный» — другое слово.\"],[\"[ʌ]\",\"как в cup\",\"[ʌ] — одна u в закрытом слоге без r: cup, but.\"]],\"why\":\"ur под ударением — [ɜː]: turn, nurse, hurt.\"}]},{\"name\":\"Связующее r (linking r)\",\"explain\":[\"<span class='h'>Чем грозит на ЕГЭ<\/span>ФИПИ требует <span class='key'>владеть связующим r<\/span>. Без него слова отрываются друг от друга, и чтение звучит рублено.\",\"<span class='h'>Правило<\/span>В британском произношении r в конце слова <span class='key'>не читается<\/span>: car, more, where. Но если следующее слово начинается с гласного звука, r <span class='key'>появляется<\/span> и связывает слова: car is, more and more, where is.\",\"<span class='h'>Когда r молчит<\/span>Перед согласной и в конце фразы: car park, more time, «Where?». Смотри на начало следующего слова: в far away дальше гласная — r звучит, в far from home — согласная, r нет.\",\"<span class='h'>Как произносить<\/span>Это не русское раскатистое «р». Кончик языка приподнят к нёбу, но не касается его и не дрожит. Звук короткий, как мостик между словами: where is — почти «уэ-риз».\",\"<span class='h'>Как тренировать<\/span>Прежде чем читать текст, найди в нём все места «слово на r или re + слово на гласную» и соедини их карандашом дугой. Потом читай эти пары, не отрывая одно слово от другого: there are, for a walk, after all, here and there.\"],\"examples\":[{\"w\":\"whe[r]e is\",\"ipa\":\"[r]\",\"ru\":\"r звучит — дальше гласная\"},{\"w\":\"the[r]e are\",\"ipa\":\"[r]\",\"ru\":\"r звучит\"},{\"w\":\"fa[r] away\",\"ipa\":\"[r]\",\"ru\":\"r звучит\"},{\"w\":\"afte[r] all\",\"ipa\":\"[r]\",\"ru\":\"r звучит\"},{\"w\":\"whe[r]e\",\"ipa\":\"—\",\"ru\":\"отдельно — r не читается\"},{\"w\":\"fa[r] from\",\"ipa\":\"—\",\"ru\":\"дальше согласная — r не читается\"}],\"drill\":[{\"word\":\"whe[r]e is\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ɹə]\",\"с гласной\",\"Лишняя гласная после r не нужна: r — короткий мостик прямо к is.\"]],\"why\":\"Следующее слово is начинается с гласной — r появляется и связывает слова: «уэ-риз».\"},{\"word\":\"the[r]e are\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ə]\",\"только призвук\",\"Одного призвука мало: без r слова отрываются друг от друга.\"]],\"why\":\"Следующее слово are начинается с гласной — r появляется и связывает слова.\"},{\"word\":\"fa[r] away\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ɑː]\",\"только долгая гласная\",\"Одной долгой гласной мало: без r слова отрываются друг от друга.\"]],\"why\":\"Следующее слово away начинается с гласной — r появляется и связывает слова.\"},{\"word\":\"ca[r]\",\"ipa\":\"—\",\"ex\":\"отдельное слово — не звучит\",\"wrong\":[[\"[r]\",\"звучит\",\"r звучит, только если следующее слово начинается с гласной: car is.\"],[\"[ɹ]\",\"звучит слабо\",\"Даже слабого r здесь нет: в конце фразы r молчит полностью.\"]],\"why\":\"car отдельно, дальше ничего нет — в британском произношении r не читается: [kɑː].\"},{\"word\":\"mo[r]e and more\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"r молчит только перед согласной и в конце фразы.\"],[\"[ɔː]\",\"только гласная\",\"Одной гласной мало: без r слова отрываются друг от друга.\"]],\"why\":\"Следующее слово and начинается с гласной — r появляется и связывает слова.\"},{\"word\":\"fo[r] example\",\"ipa\":\"[r]\",\"ex\":\"звучит\",\"wrong\":[[\"—\",\"не звучит\",\"Следующее слово начинается с гласной — r оживает и связывает слова.\"],[\"[ɔː]\",\"только гласная\",\"Одной гласной мало: без r между словами появится пауза.\"]],\"why\":\"r в конце слова звучит, если дальше гласная: for example, for us.\"},{\"word\":\"fo[r] me\",\"ipa\":\"—\",\"ex\":\"не звучит\",\"wrong\":[[\"[r]\",\"звучит\",\"r звучит только перед гласной: for example. Перед согласной он молчит.\"],[\"[ɹ]\",\"слабое r\",\"Даже слабого r здесь нет: дал ется [ði], а to — [tu]: the apple, to eat.\",\"<span class='h'>Как поймать ошибку у себя<\/span>Если каждое служебное слово читать полностью — «ту скул», «фор ю», — речь звучит как по слогам. Прочитай фразу «I want to go for a walk», произнося полностью только слова со смыслом: want, go, walk. Служебные проговаривай быстро и тихо, будто они приклеены к соседнему слову.\"],\"examples\":[{\"w\":\"[to] school\",\"ipa\":\"[tə]\",\"ru\":\"не «ту», а слабое [tə]\"},{\"w\":\"[for] you\",\"ipa\":\"[fə]\",\"ru\":\"не «фо», а [fə]\"},{\"w\":\"[of] them\",\"ipa\":\"[əv]\",\"ru\":\"слабое [əv]\"},{\"w\":\"[can] swim\",\"ipa\":\"[kən]\",\"ru\":\"слабое [kən], не «кэн»\"},{\"w\":\"[the] apple\",\"ipa\":\"[ði]\",\"ru\":\"перед гласной the читается [ði]\"},{\"w\":\"Yes, I [can].\",\"ipa\":\"[kæn]\",\"ru\":\"в конце фразы — сильная форма\"}],\"drill\":[{\"word\":\"[to] school\",\"ipa\":\"[tə]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[tuː]\",\"сильная — под ударением\",\"Сильная форма [tuː] — под ударением или в конце фразы.\"],[\"[tɒ]\",\"то\",\"«то» — русское чтение буквы o.\"]],\"why\":\"to без ударения, дальше согласная — слабая форма [tə].\"},{\"word\":\"[for] you\",\"ipa\":\"[fə]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[fɔː]\",\"сильная\",\"Сильная [fɔː] — под ударением или в конце фразы: What for?\"],[\"[fɜː]\",\"как в fur\",\"[ɜː] — долгий звук из er, ir, ur, а в слабой форме гласная короткая.\"]],\"why\":\"for без ударения — слабая форма [fə].\"},{\"word\":\"[of] them\",\"ipa\":\"[əv]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[ɒv]\",\"сильная\",\"Сильная [ɒv] — под ударением или в конце фразы: What is it made of?\"],[\"[ɒf]\",\"как в off\",\"[ɒf] — это off «выключено, прочь».\"]],\"why\":\"of без ударения — слабая форма [əv]. Буква f в of читается [v].\"},{\"word\":\"[can] swim\",\"ipa\":\"[kən]\",\"ex\":\"слабая форма\",\"wrong\":[[\"[kæn]\",\"сильная — в конце фразы\",\"Сильная [kæn] — в конце фразы или под ударением: Yes, I can.\"],[\"[kɑːn]\",\"долгая\",\"Долгое [ɑː] звучит нкого\",\"То же самое.\"]],\"why\":\"Кончается на t: [ˈstɑːtɪd].\"},{\"word\":\"watch[ed]\",\"ipa\":\"[t]\",\"ex\":\"после глухого ч\",\"wrong\":[[\"[d]\",\"после звонкого\",\"Звук ч глухой.\"],[\"[ɪd]\",\"после t и d\",\"ch — это не t, хотя t в написании есть.\"]],\"why\":\"ch даёт глухой [tʃ]: [wɒtʃt].\"}]},{\"name\":\"Окончание -s: [s], [z] или [ɪz]\",\"explain\":[\"<span class='h'>Где встречается<\/span>Это окончание множественного числа (cats, dogs) и третьего лица в Present Simple (he works, she plays).\",\"<span class='h'>Три случая<\/span>После глухого — [s]. После звонкого или гласной — [z]. После свистящих и шипящих — <span class='key'>[ɪz]<\/span>, и снова добавляется слог.\",\"<span class='h'>Глухие<\/span>p, t, k, f: stops, cats, books, laughs. Звучит [s].\",\"<span class='h'>Звонкие и гласные<\/span>b, d, g, v, m, n, l, r и гласные: dogs, plays, lives, opens. Звучит [z].\",\"<span class='h'>Когда [ɪz]<\/span>Если слово кончается на s, z, sh, ch, x, ge: buses, watches, washes, boxes, changes. Два свистящих подряд не произнести.\",\"<span class='h'>Подсказка написания<\/span>Там, где слышно [ɪz], обычно и пишется -es.\"],\"examples\":[{\"w\":\"work[s]\",\"ipa\":\"[s]\",\"ru\":\"после глухого k\"},{\"w\":\"play[s]\",\"ipa\":\"[z]\",\"ru\":\"после гласной\"},{\"w\":\"watch[es]\",\"ipa\":\"[ɪz]\",\"ru\":\"после ч — лишний слог\"},{\"w\":\"dog[s]\",\"ipa\":\"[z]\",\"ru\":\"после звонкого g\"}],\"drill\":[{\"word\":\"work[s]\",\"ipa\":\"[s]\",\"ex\":\"после глухого k\",\"wrong\":[[\"[z]\",\"после звонкого\",\"[z] звучит после звонких и гласных: plays, dogs.\"],[\"[ɪz]\",\"после шипящих\",\"[ɪz] бывает после s, sh, ch, x: watches, boxes.\"]],\"why\":\"k — глухой, окончание глухое: [wɜːks].\"},{\"word\":\"play[s]\",\"ipa\":\"[z]\",\"ex\":\"после гласной\",\"wrong\":[[\"[s]\",\"после глухого\",\"[s] звучит после p, t, k, f: stops, cats.\"],[\"[ɪz]\",\"после шипящих\",\"Лишний слог появляется только после свистящих и шипящих.\"]],\"why\":\"После гласной окончание звонкое: [pleɪz].\"},{\"word\":\"watch[es]\",\"ipa\":\"[ɪz]\",\"ex\":\"после ч\",\"wrong\":[[\"[s]\",\"после глухого\",\"После ч окончание без гласной не произнести.\"],[\"[z]\",\"после звонкого\",\"То же самое: нужен лишний слог.\"]],\"why\":\"ch даёт [tʃ], поэтому [ˈwɒtʃɪz] — на слог длиннее.\"},{\"word\":\"dog[s]\",\"ipa\":\"[z]\",\"ex\":\"после звонкого g\",\"wrong\":[[\"[s]\",\"после глухого\",\"g — звонкий. Глухая пара k дала бы [s], как в books.\"],[\"[ɪz]\",\"после шипящих\",\"g — не шипящий.\"]],\"why\":\"g — звонкий: [dɒɡz].\"},{\"word\":\"cat[s]\",\"ipa\":\"[s]\",\"ex\":\"после глухого t\",\"wrong\":[[\"[z]\",\"после звонкого\",\"t — глухой, голос не дрожит.\"],[\"[ɪz]\",\"после шипящих\",\"t — не свистящий, лишний слог не нужен.\"]],\"why\":\"t — глухой: [kæts].\"},{\"word\":\"box[es]\",\"ipa\":\"[ɪz]\",\"ex\":\"после x\",\"wrong\":[[\"[s]\",\"после глухого\",\"x — это уже [ks], ещё один [s] подряд не произнести.\"],[\"[z]\",\"после звонкого\",\"Нужен лишний слог: [ˈbɒksɪz].\"]],\"why\":\"После x всегда [ɪz]: boxes, foxes.\"},{\"word\":\"live[s]\",\"ipa\":\"[z]\",\"ex\":\"после звонкого v\",\"wrong\":[[\"[s]\",\"после глухого\",\"v — звонкий.\"],[\"[ɪz]\",\"после шипящих\",\"v — не шипящий.\"]],\"why\":\"v — звонкий: [lɪvz].\"},{\"word\":\"wash[es]\",\"ipa\":\"[ɪz]\",\"ex\":\"после ш\",\"wrong\":[[\"[s]\",\"после глухого\",\"Два шипящих подряд не произнести.\"],[\"[z]\",\"после звонкого\",\"Нужен слог: [ˈwɒʃɪz].\"]],\"why\":\"sh даёт [ʃ], поэтому окончание [ɪz].\"},{\"word\":\"book[s]\",\"ipa\":\"[s]\",\"ex\":\"после глухого k\",\"wrong\":[[\"[z]\",\"после звонкого\",\"k — глухой.\"],[\"[ɪz]\",\"после шипящих\",\"k — не шипящий.\"]],\"why\":\"k — глухой: [bʊks].\"},{\"word\":\"chang[es]\",\"ipa\":\"[ɪz]\",\"ex\":\"после дж\",\"wrong\":[[\"[z]\",\"после звонкого\",\"Звук дж уже свистящий, после него нужен слог.\"],[\"[s]\",\"после глухого\",\"Дж — звонкий, и окончание всё равно [ɪz].\"]],\"why\":\"После [dʒ] окончание читается [ɪz]: changes, pages.\"}]}]},\"texts\":{\"kind\":\"text\",\"title\":\"Тексты для чтения вслух\",\"sub\":\"На каждое правило: читаешь сам, потом слушаешь и сравниваешь\",\"blocks\":[{\"name\":\"At the Club\",\"rule\":\"Закрытый слог\",\"tip\":\"Гласная, за которой идёт согласная, читается кратко: c[a]t, b[i]g, r[e]d, t[o]p, c[u]p.\",\"text\":\"M[a]x h[a]s a pl[a]n. [A]t s[i]x he g[e]ts [u]p, gr[a]bs h[i]s bl[a]ck t[o]p [a]nd r[u]ns to the cl[u]b. The cl[u]b [i]s n[o]t b[i]g, b[u]t [i]t h[a]s a l[o]t of k[i]t. M[a]x l[i]fts, j[u]mps [a]nd str[e]tches. H[i]s b[e]st p[a]l B[e]n [i]s [a]t the cl[u]b [a]s w[e]ll. B[e]n [i]s f[i]t [a]nd str[o]ng. [A]t t[e]n M[a]x h[a]s a sn[a]ck: [a]n [a]pple, a b[u]n [a]nd a c[u]p of m[i]lk. Th[e]n he g[e]ts [o]n the b[u]s [a]nd g[e]ts to h[i]s j[o]b.\",\"ru\":\"У Макса есть план. В шесть он встаёт, хватает чёрную футболку и бежит в клуб. Клуб небольшой, но снаряжения там много. Макс поднимает вес, прыгает и делает растяжку. Его лучший друг Бен тоже в клубе. Бен подтянутый и сильный. В десять Макс перекусывает: яблоко, булочка и чашка молока. Потом он садится на автобус и едет на работу.\"},{\"name\":\"The Big Match\",\"rule\":\"Закрытый слог\",\"tip\":\"Гласная, за которой идёт согласная, читается кратко. В слове [u]ps[e]t таких слогов два.\",\"text\":\"D[a]n [i]s [i]n the r[e]d k[i]t. H[i]s cl[u]b h[a]s a b[i]g m[a]tch [a]t s[i]x. The p[i]tch [i]s w[e]t [a]nd the w[i]nd [i]s str[o]ng, b[u]t D[a]n [i]s n[o]t [u]ps[e]t. The f[a]ns cl[a]p [a]nd s[i]ng. D[a]n r[u]ns [a]nd r[u]ns. Th[e]n, [a]t the [e]nd, he h[i]ts the n[e]t! The f[a]ns j[u]mp [u]p [a]nd y[e]ll. D[a]n's cl[u]b w[i]ns the m[a]tch. D[a]n [i]s gl[a]d, b[u]t he [i]s w[e]t fr[o]m t[o]p to b[o]ttom.\",\"ru\":\"Дэн в красной форме. У его клуба в шесть большой матч. Поле мокрое, ветер сильный, но Дэн не расстроен. Болельщики хлопают и поют. Дэн бежит и бежит. И вот в самом конце он забивает! Болельщики вскакивают и кричат. Клуб Дэна выигрывает матч. Дэн доволен, хотя промок с головы до ног.\"},{\"name\":\"The Lost Cap\",\"rule\":\"Закрытый слог\",\"tip\":\"Гласная, за которой идёт согласная, читается кратко: c[a]p, d[e]sk, b[i]g, n[o]t, r[u]n.\",\"text\":\"T[o]m c[a]nnot f[i]nd h[i]s c[a]p. He ch[e]cks the d[e]sk, the b[a]g and the sh[e]lf. The c[a]p [i]s n[o]t [i]n the fl[a]t. H[i]s m[u]m s[i]ts [o]n the b[e]d and th[i]nks. Th[e]n she g[e]ts [u]p: the c[a]p [i]s [i]n the v[a]n! T[o]m r[u]ns, gr[a]bs [i]t and puts [i]t [o]n. Now he c[a]n g[e]t to the m[a]tch, and he [i]s n[o]t late.\",\"ru\":\"Том не может найти кепку. Он проверяет стол, сумку и полку. Кепки в квартире нет. Мама садится на кровать и думает. Потом встаёт: кепка в машине! Том бежит, хватает её и надевает. Теперь он успевает на матч и не опаздывает.\"},{\"name\":\"A Day at the Camp\",\"rule\":\"Закрытый слог\",\"tip\":\"Все выделенные слоги закрыты согласной, и немой e на конце нет. Поэтому гласная звучит кратко.\",\"text\":\"J[a]ck sp[e]nds July at a c[a]mp. The t[e]nts are small, b[u]t the c[a]mp [i]s b[i]g. [A]t s[i]x the b[e]ll r[i]ngs. J[a]ck j[u]mps [u]p, gr[a]bs h[i]s k[i]t and r[u]ns to the lake. The sw[i]m [i]s qu[i]ck and the morning [i]s fr[e]sh. Th[e]n he h[a]s a sn[a]ck and h[e]lps w[i]th the t[e]nts. [A]t t[e]n he s[i]ts [o]n the gr[a]ss w[i]th h[i]s friends and feels gl[a]d.\",\"ru\":\"Джек проводит июль в лагере. Палатки маленькие, зато лагерь большой. В шесть звенит колокол. Джек вскакивает, хватает вещи и бежит к озеру. Купание быстрое, а утро свежее. Потом он перекусывает и помогает с палатками. В десять он сидит на траве с друзьями и радуется.\"},{\"name\":\"A Late Plane\",\"rule\":\"Открытый слог\",\"tip\":\"Слог кончается на гласную или за согласной стоит немая e — гласная читается как в алфавите: n[a]me, t[i]me, h[o]me, [u]se, h[e].\",\"text\":\"K[a]te and M[i]ke t[a]ke a pl[a]ne h[o]me at f[i]ve. The pl[a]ne is l[a]te. K[a]te h[a]tes to b[e] l[a]te, but M[i]ke is f[i]ne. H[e] l[i]kes to [u]se the t[i]me. H[e] t[a]kes his ph[o]ne and m[a]kes a n[o]te: “R[o]me. G[a]me. H[o]tel.” K[a]te sm[i]les. “Is it a plan?” “Yes,” M[i]ke nods. “W[e] g[o] to R[o]me for a g[a]me. It is a n[i]ce t[i]me to g[o].”\",\"ru\":\"Кейт и Майк летят домой пятичасовым рейсом. Самолёт задерживается. Кейт терпеть не может опаздывать, а Майку нормально. Он любит использовать время с толком. Он берёт телефон и пишет заметку: «Рим. Матч. Отель». Кейт улыбается: «Это план?» «Да, — кивает Майк. — Мы едем в Рим на матч. Самое время съездить».\"},{\"name\":\"A Ride to the Lake\",\"rule\":\"Открытый слог\",\"tip\":\"Гласная читается как в алфавите. В ph[o]t[o] открытых слогов два, оба [əʊ].\",\"text\":\"P[e]te has a b[i]ke. It is wh[i]te, and it is his pr[i]de. At n[i]ne P[e]te and his m[a]te J[a]ke r[i]de to the l[a]ke. The l[a]ke is qu[i]te h[u]ge. P[e]te t[a]kes a ph[o]t[o], and J[a]ke sm[i]les: “[I] l[i]ke the l[a]ke. It is a n[i]ce pl[a]ce.” At f[i]ve P[e]te and J[a]ke r[i]de h[o]me. P[e]te is l[a]te, but h[e] is f[i]ne: it was a n[i]ce r[i]de.\",\"ru\":\"У Пита есть велосипед. Он белый, и Пит им гордится. В девять Пит и его приятель Джейк едут к озеру. Озеро просто огромное. Пит фотографирует, а Джейк улыбается: «Мне нравится это озеро. Хорошее место». В пять Пит и Джейк едут домой. Пит опаздывает, но ему нормально: поездка была отличная.\"},{\"name\":\"A Ride before School\",\"rule\":\"Открытый слог\",\"tip\":\"Слог кончается на гласную или за согласной стоит немая e — гласная читается как в алфавите: b[i]ke, l[a]ke, n[o]te, h[e].\",\"text\":\"M[i]ke w[a]kes up at f[i]ve. He t[a]kes his b[i]ke and r[i]des to the l[a]ke. The r[i]de is long, but M[i]ke l[i]kes it. At the l[a]ke he t[a]kes a ph[o]t[o] and wr[i]tes a n[o]te to K[a]te: 'The pl[a]ce is n[i]ce, I h[o]pe you can join me.' Then he r[i]des h[o]me, t[a]kes a shower and goes to school. He is l[a]te, but he sm[i]les.\",\"ru\":\"Майк просыпается в пять. Он берёт велосипед и едет к озеру. Дорога длинная, но Майку нравится. У озера он фотографирует и пишет Кейт записку: «Место отличное, надеюсь, ты сможешь присоединиться». Потом едет домой, принимает душ и идёт в школу. Он опаздывает, но улыбается.\"},{\"name\":\"A Plane to Rome\",\"rule\":\"Открытый слог\",\"tip\":\"Гласная читается как в алфавите. В ph[o]t[o] открытых слогов два, оба [əʊ].\",\"text\":\"In J[u]ne K[a]te flies to R[o]me. Sh[e] h[o]pes to t[a]ke a lot of ph[o]t[o]s. The pl[a]ne lands at n[i]ne, and the h[o]tel is cl[o]se to the park. D[a]ve t[a]kes the s[a]me pl[a]ne. He h[a]tes to be l[a]te, so they g[o] to the g[a]te at f[i]ve. At the g[a]te K[a]te sm[i]les and wr[i]tes one l[i]ne in her n[o]te: 'R[o]me at last.'\",\"ru\":\"В июне Кейт летит в Рим. Она надеется сделать много фотографий. Самолёт садится в девять, а отель рядом с парком. Дейв летит тем же рейсом. Он терпеть не может опаздывать, поэтому к выходу они идут в пять. У выхода Кейт улыбается и пишет в заметке одну строчку: «Наконец-то Рим».\"},{\"name\":\"A Farm in the North\",\"rule\":\"Гласная + r + согласная\",\"tip\":\"После гласной идёт r и ещё согласная — гласная тянется, r не читается: f[ar]m, n[or]th, b[ir]d. Написания er, ir, ur звучат одинаково.\",\"text\":\"M[ar]k was b[or]n on a f[ar]m in the n[or]th. The f[ar]m is l[ar]ge: it has a b[ar]n, a g[ar]den and six h[or]ses. In the m[or]ning M[ar]k gets up in the d[ar]k. F[ir]st, he t[ur]ns on the lamp in the b[ar]n. Then he feeds the h[or]ses. It is h[ar]d, but M[ar]k is strong. In M[ar]ch the st[or]ms st[ar]t, and the h[or]ses get n[er]vous. M[ar]k stands next to them, and they stop kicking. In the evening M[ar]k sits in the g[ar]den. His sh[ir]t is d[ir]ty and his [ar]ms h[ur]t, but he smiles: it is his f[ar]m.\",\"ru\":\"Марк родился на ферме на севере. Ферма большая: там амбар, сад и шесть лошадей. Утром Марк встаёт затемно. Сначала он включает лампу в амбаре. Потом кормит лошадей. Это тяжело, но Марк сильный. В марте начинаются бури, и лошади нервничают. Марк стоит рядом, и они перестают бить копытами. Вечером Марк сидит в саду. Рубашка у него грязная, руки болят, но он улыбается: это его ферма.\"},{\"name\":\"Carl's Party\",\"rule\":\"Гласная + r + согласная\",\"tip\":\"Гласная тянется, r не читается. Сравни звук в C[ar]l и B[er]t, в f[or]ks и b[ur]nt.\",\"text\":\"It is C[ar]l's b[ir]thday on Th[ur]sday. He t[ur]ns th[ir]ty. His friend B[er]t is in ch[ar]ge of the p[ar]ty. He [or]ders a l[ar]ge cake with p[ur]ple cream and gets a set of f[or]ks. The p[ar]ty st[ar]ts in the g[ar]den at six. C[ar]l gets a sh[ir]t, a sc[ar]f and a lot of c[ar]ds. It is a p[er]fect p[ar]ty. In the m[or]ning the g[ar]den is a mess: b[ur]nt candles in the c[or]ner and cake on the steps.\",\"ru\":\"В четверг у Карла день рождения. Ему исполняется тридцать. Праздник организует его друг Берт. Он заказывает большой торт с фиолетовым кремом и покупает набор вилок. Праздник начинается в саду в шесть. Карлу дарят рубашку, шарф и кучу открыток. Праздник удался. Утром в саду беспорядок: огарки свечей в углу и торт на ступеньках.\"},{\"name\":\"The First Day at Work\",\"rule\":\"Гласная + r + согласная\",\"tip\":\"После гласной идёт r и ещё согласная — гласная тянется, r не читается: f[ir]st, sh[or]t, l[ar]ge. В h[er] после r ничего нет, читается так же.\",\"text\":\"It is M[ar]ch, and M[ar]ta st[ar]ts h[er] f[ir]st job in a l[ar]ge shop. She works in the sp[or]ts dep[ar]tment. The f[ir]st m[or]ning is h[ar]d: th[ir]ty boxes of sh[ir]ts and sk[ir]ts, and no time for a sh[or]t break. Her boss, Mister B[ur]ton, is st[er]n but fair. 'Be f[ir]m with the prices,' he says. By Th[ur]sday M[ar]ta t[ur]ns into a real w[or]ker: she s[or]ts the shelves, s[er]ves the customers and forgets nothing.\",\"ru\":\"Март, и Марта выходит на первую работу в большой магазин. Она работает в спортивном отделе. Первое утро тяжёлое: тридцать коробок рубашек и юбок и ни минуты на перерыв. Её начальник, мистер Бёртон, строгий, но справедливый. «С ценами будь твёрдой», — говорит он. К четвергу Марта становится настоящим работником: раскладывает полки, обслуживает покупателей и ничего не забывает.\"},{\"name\":\"A Dark Morning\",\"rule\":\"Гласная + r + согласная\",\"tip\":\"Гласная тянется, r не читается. Сравни звук в c[ar] и в t[ur]ns, в m[or]ning и в ch[ur]ch.\",\"text\":\"It is d[ar]k when M[ar]k st[ar]ts the c[ar]. The road to the f[ar]m is h[ar]d after the st[or]m. At the c[or]ner he t[ur]ns left and p[ar]ks near the ch[ur]ch. Mister B[ur]ns is already in the b[ar]n: th[ir]ty h[or]ses need their f[ir]st meal. M[ar]k w[or]ks f[ir]st and talks later. By ten the w[or]k is done, the b[ar]n is in [or]der, and the f[ar]m t[ur]ns quiet.\",\"ru\":\"Темно, когда Марк заводит машину. Дорога на ферму тяжёлая после бури. На повороте он сворачивает налево и паркуется у церкви. Мистер Бёрнс уже в амбаре: тридцати лошадям нужен первый корм. Марк сначала работает, разговаривает потом. К десяти работа сделана, в амбаре порядок, и на ферме становится тихо.\"},{\"name\":\"Fire at the Store\",\"rule\":\"Гласная + r + гласная\",\"tip\":\"После r снова гласная, чаще всего немая e, — звук с призвуком на конце: c[are], h[ere], f[ire], m[ore].\",\"text\":\"Cl[are] has a st[ore] on the sh[ore]. The st[ore] sells r[are] shells and w[ire] lamps. Late in the evening Cl[are] smells smoke. F[ire]! Cl[are] is sc[are]d, but she takes c[are]. She grabs a sp[are] f[ire] blanket and puts out the f[ire]. The f[ire] is out bef[ore] the f[ire] crew gets h[ere]. Cl[are] is t[ire]d, but the st[ore] is safe. From now on she is m[ore] c[are]ful.\",\"ru\":\"У Клэр магазинчик на берегу. Там продаются редкие ракушки и лампы из проволоки. Поздно вечером Клэр чувствует запах дыма. Пожар! Клэр страшно, но она не теряет голову. Она хватает запасное противопожарное покрывало и тушит огонь. Огонь потушен ещё до приезда пожарных. Клэр вымоталась, но магазин цел. С этого дня она ещё осторожнее.\"},{\"name\":\"A Cabin on the Shore\",\"rule\":\"Гласная + r + гласная\",\"tip\":\"Звук с призвуком на конце. Буквы правила могут стоять и внутри слова: p[are]nts, t[ire]d.\",\"text\":\"My p[are]nts h[ire] a cabin on the sh[ore]. We sh[are] it with my cousins. H[ere] we have m[ore] time. We do not c[are] about phones. Mum likes to expl[ore] the sh[ore] and finds r[are] stones. In the evening we make a f[ire] and sing. I am t[ire]d of the city, and I ad[ore] it h[ere]. I hope to come back bef[ore] long.\",\"ru\":\"Родители снимают домик на берегу. Мы живём там вместе с двоюродными братьями и сёстрами. Здесь у нас больше времени. Про телефоны мы забываем. Мама любит бродить по берегу и находит редкие камни. Вечером мы разводим костёр и поём. Город выматывает, а здесь мне очень нравится. Надеюсь скоро вернуться.\"},{\"name\":\"The Old Square\",\"rule\":\"Гласная + r + гласная\",\"tip\":\"После r снова гласная — звук с призвуком на конце: squ[are], h[ere], st[ore]. В th[ere] призвук такой же, как в c[are].\",\"text\":\"In the centre of our town th[ere] is an old squ[are]. People come h[ere] to sh[are] news and to st[are] at the fountain. My p[are]nts first took me h[ere] when I was six. On the corner th[ere] is a small st[ore] with r[are] books. The owner is a t[ire]d man who ad[ore]s old maps. He does not c[are] about money and never hurries. I d[are] say it is my favourite place in town.\",\"ru\":\"В центре нашего города есть старая площадь. Сюда приходят, чтобы обменяться новостями и посмотреть на фонтан. Родители впервые привели меня сюда, когда мне было шесть. На углу маленький магазин с редкими книгами. Хозяин — усталый человек, который обожает старые карты. Деньги его не волнуют, и он никогда не спешит. Пожалуй, это моё любимое место в городе.\"},{\"name\":\"A Fire Drill\",\"rule\":\"Гласная + r + гласная\",\"tip\":\"Звук с призвуком на конце. Буквы правила бывают и внутри слова: t[ire]d, sc[are]d, p[are]nts.\",\"text\":\"At nine the f[ire] bell rings. We leave the classroom and go to the squ[are] behind the school. Nobody is sc[are]d: it is only a drill. Our teacher counts us and asks if anyone is still in th[ere]. The p[are]nts of the little ones st[are] at us from the gate. Then we wait twenty minutes and get t[ire]d. H[ere] is the odd part: after the drill nobody wants to go back. We ad[ore] a lesson that disappears, and we c[are] little about the rain.\",\"ru\":\"В девять звенит пожарный звонок. Мы выходим из класса на площадку за школой. Никто не боится: это учебная тревога. Учитель пересчитывает нас и спрашивает, не остался ли кто внутри. Родители малышей смотрят на нас от ворот. Потом мы двадцать минут ждём и устаём. Самое смешное дальше: после тревоги никто не хочет возвращаться. Урок, который исчез, обожают все, и дождь никого не смущает.\"},{\"name\":\"Jane's First Job\",\"rule\":\"Все четыре типа\",\"tip\":\"Здесь встречаются все четыре типа. Прежде чем прочитать слово, определи тип: J[a]ne, j[o]b, p[ar]k, st[ore].\",\"text\":\"J[a]ne is s[i]xteen. This s[u]mmer sh[e] has a j[o]b in a sp[or]ts st[ore] n[e]xt to the p[ar]k. The st[ore] is l[ar]ge, and J[a]ne l[i]kes it. Sh[e] st[ar]ts at n[i]ne. F[ir]st, sh[e] ch[e]cks the sh[e]lves and h[e]lps c[u]stomers. A m[a]n p[i]cks a b[i]ke, and J[a]ne t[e]lls him the pr[i]ce. H[e] is not h[a]ppy: it is qu[i]te a l[o]t. J[a]ne finds a n[i]ce b[i]ke on s[a]le. The m[a]n t[a]kes it, and h[e] is gl[a]d. At f[i]ve J[a]ne is t[ire]d and has s[ore] l[e]gs, but sh[e] ad[ore]s the j[o]b.\",\"ru\":\"Джейн шестнадцать. Этим летом она работает в спортивном магазине рядом с парком. Магазин большой, и Джейн там нравится. Она начинает в девять. Сначала проверяет полки и помогает покупателям. Мужчина выбирает велосипед, и Джейн называет цену. Он недоволен: дороговато. Джейн находит хороший велосипед со скидкой. Мужчина берёт его и радуется. К пяти Джейн устаёт и ноги гудят, но работа ей очень нравится.\"},{\"name\":\"A Rainy Day\",\"rule\":\"Сочетания гласных\",\"tip\":\"Две гласные подряд читаются одним звуком: r[ai]n, s[ee], b[oo]k, t[ow]n, b[oy]. Смотри внимательно на h[ea]d и sl[ow] — у ea и ow есть второе чтение.\",\"text\":\"Tod[ay] it r[ai]ns, so R[oy] st[ay]s in his r[oo]m. He r[ea]ds a b[oo]k ab[ou]t the s[ea]. His mum makes t[ea]. His old dog Sc[ou]t sl[ee]ps next to him. Sc[ou]t is sl[ow], but n[ow] and then he makes a n[oi]se. At n[oo]n the r[ai]n stops. R[oy] l[oo]ks [ou]t: the t[ow]n l[oo]ks cl[ea]n and gr[ee]n. R[oy] pats Sc[ou]t on the h[ea]d, and they go [ou]t to pl[ay]. In the str[ee]t they m[ee]t a b[oy] from sch[oo]l. It is a g[oo]d d[ay] after all.\",\"ru\":\"Сегодня дождь, поэтому Рой сидит у себя в комнате. Он читает книгу о море. Мама заваривает чай. Рядом спит его старый пёс Скаут. Скаут медлительный, но время от времени подаёт голос. В полдень дождь заканчивается. Рой выглядывает на улицу: город чистый и зелёный. Рой треплет Скаута по голове, и они идут гулять. На улице они встречают парня из школы. День всё-таки удался.\"},{\"name\":\"A Day by the Sea\",\"rule\":\"Сочетания гласных\",\"tip\":\"Следи за oo: перед k звук короткий — t[oo]k, b[oo]k, c[oo]kies, в остальных словах долгий — c[oo]l, s[oo]n.\",\"text\":\"In July we t[oo]k a tr[ai]n to the s[ea]. The trip t[oo]k ab[ou]t thr[ee] h[ou]rs. We f[ou]nd a c[oo]l place on the b[ea]ch. The b[oy]s swam, and I l[ay] in the shade with a b[oo]k. We enj[oy]ed the sun and the s[ou]nd of the s[ea]. At thr[ee] the cl[ou]ds came, and it began to r[ai]n. We had t[ea] and c[oo]kies in a small café. S[oo]n the sun came [ou]t, and we went back to the b[ea]ch. In the evening we t[oo]k the tr[ai]n home. What a d[ay]!\",\"ru\":\"В июле мы поехали на поезде к морю. Дорога заняла около трёх часов. Мы нашли прохладное местечко на пляже. Ребята плавали, а я — в тени с книгой. Мы грелись на солнце и слушали шум моря. В три набежали тучи и пошёл дождь. Мы пили чай с печеньем в маленьком кафе. Скоро снова выглянуло солнце, и мы вернулись на пляж. Вечером поехали домой на поезде. Вот это день!\"},{\"name\":\"The Wrong Phone\",\"rule\":\"Сочетания согласных\",\"tip\":\"Две согласные дают один звук: [sh]op, [ch]eck, [ph]one, [th]ink. В [kn]ow и [wr]ong первая буква молчит.\",\"text\":\"[Wh]ere is my [ph]one? Jo[sh] [ch]e[ck]s his po[ck]et, but it is not [th]ere. He [kn]ows he had it at lun[ch]. He [th]inks and [th]inks. [Th]en he ri[ng]s his [ph]one. A [qu]i[ck] ri[ng], [th]en a cli[ck]. “Hello, [th]is is Mrs [Wh]ite. I [th]ink [th]is [ph]one is [th]e [wr]o[ng] one. I pi[ck]ed it up at [th]e fi[sh] [sh]op by mistake.” Jo[sh] ru[sh]es to [th]e [sh]op, and Mrs [Wh]ite gives [th]e [ph]one back wi[th] a smile. Jo[sh] [th]anks her and buys her a [ch]ocolate.\",\"ru\":\"Где мой телефон? Джош проверяет карман, но телефона там нет. Он точно помнит, что за обедом телефон был. Он думает и думает. Потом звонит на свой номер. Короткий гудок, потом щелчок. «Алло, это миссис Уайт. Кажется, это чужой телефон. Я по ошибке взяла его в рыбной лавке». Джош бежит в лавку, и миссис Уайт с улыбкой отдаёт телефон. Джош благодарит её и покупает ей шоколадку.\"},{\"name\":\"The Writer and the Knight\",\"rule\":\"Сочетания согласных\",\"tip\":\"wh обычно [w], как в [wh]ite, но перед o — [h], как в [wh]o. Звонкий th — в [th]e и [th]en, глухой — в [th]ink и [th]ree.\",\"text\":\"Ka[th] is a [wr]iter. [Sh]e [wr]ites [sh]ort stories. Ea[ch] morni[ng] [sh]e sits in [th]e ki[tch]en wi[th] a cup of coffee and [th]inks. Today [sh]e [th]inks of a [kn]ight [wh]o lives in a bla[ck] tower. [Th]e [kn]ight has a [sh]ield and a [wh]ite horse. [Wh]at does he want? Ka[th] [wr]ites a page, [th]en [ch]e[ck]s it. [Wh]i[ch] word is [wr]o[ng]? [Sh]e [ch]anges [th]ree [th]i[ng]s. At lun[ch] [th]e [ch]apter is ready, and Ka[th] is [th]ankful for a [qu]iet morni[ng].\",\"ru\":\"Кэт — писательница. Она пишет короткие рассказы. Каждое утро она сидит на кухне с чашкой кофе и думает. Сегодня она придумывает рыцаря, который живёт в чёрной башне. У рыцаря есть щит и белый конь. Чего он хочет? Кэт пишет страницу, потом перечитывает. Какое слово здесь неудачное? Она меняет три вещи. К обеду глава готова, и Кэт благодарна за спокойное утро.\"},{\"name\":\"Why Do We Sleep?\",\"rule\":\"Звуки для ЕГЭ\",\"tip\":\"Подсвечены места, за которые на экзамене снимают балл: th, w и v, долгие [ɜː] и [ɔː], связующее r — mo[r]e often, [th]e[r]e is.\",\"text\":\"Scientists still do not fully understand [wh]y [w]e sleep. [W]e spend about a [th][ir]d of our li[v]es asleep, and [th]is is a [v]ery long time. Res[ear]ch shows [th]at sleep helps [th]e brain to [w][or]k better. At night [th]e brain s[or]ts [th]e information [w]e have recei[v]ed during [th]e day. [W]i[th]out enough sleep, people find it harder to l[ear]n and remember new [th]ings. [Th]ey also get ill mo[r]e often. Most teenagers need eight to ten hours of sleep, but many of [th]em sleep far less. Doctors ad[v]ise t[ur]ning off phones at least half an hour bef[or]e bed. It is easier to f[al]l asleep [wh]ere [th]e[r]e is a quiet, dark room.\",\"ru\":\"Учёные до сих пор не до конца понимают, зачем мы спим. Около трети жизни мы проводим во сне, а это очень много. Исследования показывают, что сон помогает мозгу работать лучше. Ночью мозг раскладывает по полкам информацию, полученную за день. Без достаточного сна людям труднее учиться и запоминать новое. Кроме того, они чаще болеют. Большинству подростков нужно от восьми до десяти часов сна, но многие спят гораздо меньше. Врачи советуют выключать телефон хотя бы за полчаса до сна. Легче заснуть там, где тихо и темно.\"},{\"name\":\"The World's Oceans\",\"rule\":\"Звуки для ЕГЭ\",\"tip\":\"Подсвечены th, w и v, долгие [ɜː] и [ɔː] и связующее r: [th]e[r]e are, fo[r] over. Отдельно следи за [th]e перед гласной: [th]e [Ear][th] читается [ði].\",\"text\":\"[W]ater co[v]ers more than se[v]enty per cent of [th]e [Ear][th]. [Th]e oceans are home to [th]ousands of animals [th]at [w]e have ne[v]er seen. E[v]ery year scientists disco[v]er new f[or]ms of life in [th]e deep [w]ater, [wh]ere [th]e sun ne[v]er reaches. [Th]e[r]e are [wh]ales [wh]ich can li[v]e fo[r] over a hundred years, and small fish [th]at glow in [th]e dark. Ho[w]e[v]er, [th]e [w][or]ld's oceans a[r]e in danger. [W][ar]mer [w]ater and plastic [w]aste harm sea life. E[v]ery year ri[v]ers carry about a million tonnes of plastic into [th]e sea. B[ir]ds and t[ur]tles often eat it by mistake. Many countries are [w][or]king toge[th]er to solve [th]is problem, but each of us can help too: [w]e can use less plastic and [th]row our rubbish a[w]ay.\",\"ru\":\"Вода покрывает больше семидесяти процентов поверхности Земли. В океане живут тысячи животных, которых мы никогда не видели. Каждый год учёные открывают новые формы жизни в глубинах, куда не проникает солнце. Там обитают киты, которые могут жить больше ста лет, и маленькие рыбы, светящиеся в темноте. Однако мировой океан в опасности. Потепление воды и пластиковый мусор вредят морским обитателям. Каждый год реки выносят в море около миллиона тонн пластика. Птицы и черепахи часто глотают его по ошибке. Многие страны вместе решают эту проблему, но помочь может каждый: меньше пользоваться пластиком и выбрасывать мусор в урну.\"},{\"name\":\"The First Bicycles\",\"rule\":\"Числа и годы\",\"tip\":\"Годы читаются парами: 1817 — eighteen seventeen, 1885 — eighteen eighty-five. Десятилетия так же, с -s на конце: 1860s — eighteen sixties. Нажми «Как читать числа» — рядом с каждым числом появится подсказка.\",\"text\":\"The bicycle has a long history. In {1817|eighteen seventeen} a German inventor, Karl Drais, built a wooden “running machine” without pedals. People pushed it along with their feet. About {50|fifty} years later, in the {1860s|eighteen sixties}, pedals appeared on the front wheel. The next big step came in {1885|eighteen eighty-five}, when John Kemp Starley made the “safety bicycle” with two wheels of similar size and a chain. Three years later, in {1888|eighteen eighty-eight}, John Dunlop patented the first practical air-filled tyre. By the beginning of the {20th|twentieth} century, cycling had become popular all over Europe. In {2020|twenty twenty}, bicycle sales grew in many countries.\",\"ru\":\"У велосипеда долгая история. В 1817 году немецкий изобретатель Карл Драйс построил деревянную «беговую машину» без педалей. Её толкали вперёд ногами. Примерно через 50 лет, в 1860-х, на переднем колесе появились педали. Следующий большой шаг сделал в 1885 году Джон Кемп Старли: у его «безопасного велосипеда» были два колеса почти одного размера и цепь. Через три года, в 1888-м, Джон Данлоп запатентовал первую практичную надувную шину. К началу XX века велосипед стал популярен по всей Европе. В 2020 году продажи велосипедов выросли во многих странах.\"},{\"name\":\"The Titanic\",\"rule\":\"Числа и годы\",\"tip\":\"Даты по-британски: 10 April 1912 — the tenth of April, nineteen twelve, число порядковое. Перед десятками и единицами ставится and: 110 — one hundred and ten. В 2,200 десятков нет, поэтому and не нужен: two thousand two hundred.\",\"text\":\"The Titanic was the largest ship of its time. It left Southampton on its first voyage on {10 April 1912|the tenth of April, nineteen twelve}. There were more than {2,200|two thousand two hundred} people on board. Four days later, late at night on {14 April|the fourteenth of April}, the ship hit an iceberg in the North Atlantic. In less than three hours it sank. About {1,500|one thousand five hundred} people died, partly because there were not enough lifeboats for everyone. The wreck lies at a depth of about {3,800|three thousand eight hundred} metres. Scientists found it in {1985|nineteen eighty-five}. Today, more than {110|one hundred and ten} years later, people still tell its story.\",\"ru\":\"«Титаник» был самым большим судном своего времени. В первый рейс он вышел из Саутгемптона 10 апреля 1912 года. На борту было больше 2200 человек. Через четыре дня, поздно ночью 14 апреля, корабль столкнулся с айсбергом в Северной Атлантике. Меньше чем за три часа он затонул. Погибли около 1500 человек, в том числе потому, что шлюпок на всех не хватило. Обломки лежат на глубине около 3800 метров. Учёные нашли их в 1985 году. Прошло больше 110 лет, а эту историю рассказывают до сих пор.\"},{\"name\":\"Reaching the Moon\",\"rule\":\"Числа и годы\",\"tip\":\"Длинные числа читаются по разрядам: 384,400 — three hundred and eighty-four thousand, four hundred. Дробь 1/6 — one sixth. Десятичная точка читается point: 3.8 — three point eight.\",\"text\":\"On {20 July 1969|the twentieth of July, nineteen sixty-nine}, the Apollo {11|eleven} spacecraft landed on the Moon, and Neil Armstrong became the first person to walk on its surface. About {600|six hundred} million people watched it on television. The Moon is about {384,400|three hundred and eighty-four thousand, four hundred} kilometres from the Earth, and the flight took the astronauts four days. Its diameter is about {3,475|three thousand, four hundred and seventy-five} kilometres, a little more than a quarter of the Earth's. Gravity on the Moon is about {1/6|one sixth} of the gravity on Earth. Every year the Moon moves about {3.8|three point eight} centimetres further away from us. Between {1969|nineteen sixty-nine} and {1972|nineteen seventy-two}, {12|twelve} people walked on the Moon.\",\"ru\":\"20 июля 1969 года корабль «Аполлон-11» сел на Луну, и Нил Армстронг стал первым человеком, ступившим на её поверхность. Посадку смотрели по телевизору около 600 миллионов человек. Луна находится примерно в 384 400 километрах от Земли, и полёт занял у астронавтов четыре дня. Её диаметр — около 3475 километров, чуть больше четверти земного. Сила тяжести на Луне — около 1/6 земной. Каждый год Луна отдаляется от нас примерно на 3,8 сантиметра. С 1969 по 1972 год по Луне прошли 12 человек.\"},{\"name\":\"Lake Baikal\",\"rule\":\"Числа и годы\",\"tip\":\"Проценты — per cent: 20% — twenty per cent. 2/3 — two thirds. Запятая в 1,642 отделяет тысячи, а точка в 744.4 — десятичная: seven hundred and forty-four point four.\",\"text\":\"Lake Baikal in Siberia is the oldest and the deepest lake on the planet. It is about {25|twenty-five} million years old. Its average depth is {744.4|seven hundred and forty-four point four} metres, and at its deepest point it goes down {1,642|one thousand, six hundred and forty-two} metres. The lake holds about {20%|twenty per cent} of all the unfrozen fresh water on the surface of the Earth. More than {300|three hundred} rivers flow into Baikal, but only one, the Angara, flows out. The water is so clear that in some places you can see stones at a depth of {40|forty} metres. More than {2,600|two thousand six hundred} kinds of plants and animals live in the lake, and about {2/3|two thirds} of them cannot be found anywhere else. In {1996|nineteen ninety-six} Baikal became a UNESCO World Heritage Site.\",\"ru\":\"Байкал в Сибири — самое древнее и самое глубокое озеро на планете. Ему около 25 миллионов лет. Его средняя глубина — 744,4 метра, а в самом глубоком месте дно уходит на 1642 метра. В озере около 20% всей незамёрзшей пресной воды на поверхности Земли. В Байкал впадает больше 300 рек, а вытекает только одна — Ангара. Вода настолько прозрачна, что местами камни видно на глубине 40 метров. В озере живут больше 2600 видов растений и животных, и около 2/3 из них больше нигде не встречаются. В 1996 году Байкал включили в список Всемирного наследия ЮНЕСКО.\"},{\"name\":\"The World Wide Web\",\"rule\":\"Числа и годы\",\"tip\":\"Годы с 2000: 2007 — two thousand and seven. С 2010 можно и парами: 2023 — twenty twenty-three. Десятилетия: 2000s — the two thousands. После числа billion пишется без -s: 5.4 billion — five point four billion.\",\"text\":\"The internet and the World Wide Web are not the same thing. The internet is a network of computers, and its history began in the {1960s|nineteen sixties}. The Web is a way to share pages on this network. In {1989|nineteen eighty-nine} Tim Berners-Lee, a British scientist at CERN in Switzerland, suggested the idea, and at the end of {1990|nineteen ninety} the first website went online. In {2007|two thousand and seven} the first iPhone appeared, and in the {2000s|two thousands} and {2010s|twenty tens} smartphones let people go online anywhere. By {2023|twenty twenty-three}, about {5.4|five point four} billion people, or {67%|sixty-seven per cent} of the world's population, were using the internet.\",\"ru\":\"Интернет и Всемирная паутина — не одно и то же. Интернет — это сеть компьютеров, и его история началась в 1960-х. Паутина — способ публиковать страницы в этой сети. В 1989 году британский учёный Тим Бернерс-Ли, работавший в ЦЕРН в Швейцарии, предложил эту идею, а в конце 1990 года заработал первый сайт. В 2007 году появился первый iPhone, а в 2000-х и 2010-х смартфоны позволили выходить в сеть откуда угодно. К 2023 году интернетом пользовались около 5,4 миллиарда человек, то есть 67% населения Земли.\"}]},\"past\":{\"kind\":\"gram\",\"title\":\"Past Simple — прошедшее время\",\"sub\":\"was и were, окончание -ed, неправильные глаголы, didn't, вопросы с did, вопрос к подлежащему\",\"blocks\":[{\"name\":\"was и were — «был», «были»\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Правильные глаголы: окончание -ed\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Неправильные глаголы: вторая форма\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Отрицание: didn't\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Вопросы с did и короткие ответы\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]},{\"name\":\"Вопросительные слова и вопрос к подлежащему\",\"zakryto\":true,\"n\":10,\"drill\":[],\"explain\":[],\"examples\":[]}],\"zakryto\":true},\"egegram\":{\"kind\":\"gram\",\"fullForm\":true,\"title\":\"Грамматика в формате ЕГЭ\",\"sub\":\"Темы кодификатора: множественное число, местоимения, числительные, степени сравнения, времена глагола, пассив, модальные, неличные формы. Задания в формате ЕГЭ\",\"blocks\":[{\"name\":\"Множественное число существительных\",\"explain\":[\"<span class='h'>Как обычно<\/span>Прибавляем <span class='key'>-s<\/span>: tree — trees. После s, sh, ch, x, o — <span class='key'>-es<\/span>: box — boxes, potato — potatoes.\",\"<span class='h'>Изменения<\/span>Согласная + y — ies: city — cities. Гласная + y — просто -s: toy — toys, monkey — monkeys. f, fe — ves: leaf — leaves, life — lives, wife — wives.\",\"<span class='h'>Исключения<\/span>man — men, woman — women, child — children, foot — feet, tooth — teeth, mouse — mice, person — people. Не меняются: sheep, fish, deer. После o только -s: photo — photos, piano — pianos.\",\"<span class='h'>Подсказки<\/span>Глагол are, were, have; слова many, several, two, these, other, a lot of: many children, these women.\",\"<span class='h'>Ловушка<\/span>Не добавляй -s к особым формам: children, а не childrens; women, а не womans.\",\"<span class='h'>В кодификаторе ЕГЭ<\/span>Пункт 2.4.29: множественное число по правилу и исключения.\"],\"examples\":[{\"w\":\"They have three small children.\",\"ru\":\"CHILD → children\"},{\"w\":\"Doctors and nurses save people's lives.\",\"ru\":\"LIFE → lives\"},{\"w\":\"We watched six monkeys.\",\"ru\":\"MONKEY → monkeys\"}],\"drill\":[{\"q\":\"We saw two ___ drinking water from the lake.\",\"hint\":\"DEER\",\"a\":\"deer\",\"wrong\":[\"deers\",\"deeres\"],\"why\":\"Оленей два, но deer во множественном числе не меняется: one deer — two deer.\",\"src\":\"своё\",\"title\":\"A Walk in the Forest\",\"ctx\":\"Last weekend my family went to the national park.\"},{\"q\":\"They have three small ___ and a big friendly dog.\",\"hint\":\"CHILD\",\"a\":\"children\",\"wrong\":[\"childs\",\"childrens\"],\"why\":\"Детей трое — child имеет особую форму множественного числа: children (не childs).\",\"src\":\"своё\",\"title\":\"Our New Neighbours\",\"ctx\":\"A young family moved into the house next to ours.\"},{\"q\":\"The doctor said that two of my ___ needed treatment.\",\"hint\":\"TOOTH\",\"a\":\"teeth\",\"wrong\":[\"tooths\",\"tooth\"],\"why\":\"Зубов два — tooth во множественном числе меняет гласную: teeth.\",\"s
